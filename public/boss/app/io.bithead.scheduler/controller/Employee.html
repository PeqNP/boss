<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      // `null` until `create` makes one. An employee exists from the moment
      // this form opens, so working days and time off have someone to belong
      // to before anything is saved.
      let employeeId = null;

      // This form created the employee, and nothing has been saved over it
      // yet. Cancelling or closing discards it; one reopened later does not.
      let isNew = false;

      // What an employee is called before anyone names them.
      const DRAFT_FIRST_NAME = "Untitled";

      const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

      // A document: the window owns Cancel, Delete and Save, asks before
      // discarding or deleting, and says "Saved".
      //
      // The discard question speaks of the employee rather than of changes,
      // because leaving an unsaved draft does not merely lose edits — it
      // throws away the employee this window created to hang working days on.
      this.document = new UIDocument(
        "Remove this employee? Jobs they are assigned to become unassigned.",
        "Discard this employee?"
      );

      // EmployeeDelegate
      let delegate = protocol(
        "EmployeeDelegate", this, "delegate",
        [
          /**
           * @param {object} employee - The saved employee.
           */
          "didSaveEmployee",
          /**
           * @param {number} employeeId - The deleted employee's ID.
           */
          "didDeleteEmployee"
        ]
      );

      // EmployeeScheduleDelegate
      let scheduleDelegate = {
        didSaveEmployeeSchedule: reload,
        didDeleteEmployeeSchedule: reload
      };

      // EmployeeTimeOffDelegate
      let timeOffDelegate = {
        didSaveEmployeeTimeOff: reload,
        didDeleteEmployeeTimeOff: reload
      };

      // --- Private helpers ---

      /**
       * Load the employee and redraw everything they own.
       */
      async function reload() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/admin/employee/${employeeId}`);
        }
        catch {
          os.ui.showError("Failed to load the employee. Please try again later.");
          return;
        }
        win.input("first-name").value = response.firstName;
        win.input("last-name").value = response.lastName;
        win.input("include-in-schedule").checked = response.includeInSchedule;
        win.input("can-manage-own-schedule").checked = response.canManageOwnSchedule;

        renderSchedule(response.scheduleTemplate);
        renderTimeOff(response.timeOff);
        await loadJobTypes(response.jobTypes);
      }

      function renderSchedule(days) {
        win.select("schedule").ui.addNewOptions(
          days.map(function(d) {
            return {
              id: String(d.id),
              name: `${DAY_NAMES[d.dayOfWeek]} — ${d.startTime} to ${d.endTime}`
            };
          })
        );
        win.button("edit-schedule-btn").disabled = days.length === 0;
      }

      function renderTimeOff(windows) {
        win.select("time-off").ui.addNewOptions(
          windows.map(function(w) {
            return { id: String(w.id), name: `${w.date} — ${w.startTime} to ${w.endTime}` };
          })
        );
        win.button("edit-time-off-btn").disabled = windows.length === 0;
      }

      /**
       * Every job type the business offers, with the ones this employee can
       * perform selected.
       *
       * @param {array} performs - Job types the employee performs
       */
      async function loadJobTypes(performs) {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/job-types");
        }
        catch {
          os.ui.showError("Failed to load the job types. Please try again later.");
          return;
        }
        const selected = new Set(performs.map(function(jt) { return jt.id; }));
        win.select("job-types").ui.addNewOptions(
          response.jobTypes.map(function(jt) {
            return { id: String(jt.id), name: jt.name, selected: selected.has(jt.id) };
          })
        );
      }

      // --- Controller functions ---

      async function addScheduleDay() {
        const child = await $(app.controller).loadController("EmployeeSchedule");
        child.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, scheduleId: null });
          ctrl.delegate = scheduleDelegate;
        });
      }
      this.addScheduleDay = addScheduleDay;

      async function editScheduleDay() {
        const value = win.select("schedule").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const child = await $(app.controller).loadController("EmployeeSchedule");
        child.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, scheduleId: parseInt(value) });
          ctrl.delegate = scheduleDelegate;
        });
      }
      this.editScheduleDay = editScheduleDay;

      async function addTimeOff() {
        const child = await $(app.controller).loadController("EmployeeTimeOff");
        child.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, windowId: null });
          ctrl.delegate = timeOffDelegate;
        });
      }
      this.addTimeOff = addTimeOff;

      async function editTimeOff() {
        const value = win.select("time-off").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const child = await $(app.controller).loadController("EmployeeTimeOff");
        child.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, windowId: parseInt(value) });
          ctrl.delegate = timeOffDelegate;
        });
      }
      this.editTimeOff = editTimeOff;

      /**
       * Check the form, write it, and tell whoever opened this window.
       *
       * @returns {boolean} `true` when something was written
       */
      async function save() {
        // `inputValue` with a message tells the user and throws, which stops
        // the save here. The window catches it, so no "Saved" is shown.
        const firstName = win.inputValue("first-name", "Please provide a first name.");
        const lastName = win.inputValue("last-name", "Please provide a last name.");
        const jobTypeIds = win.select("job-types").ui.selectedValues().map(function(v) {
          return parseInt(v);
        });
        const payload = {
          firstName,
          lastName,
          jobTypeIds,
          includeInSchedule: win.input("include-in-schedule").checked,
          canManageOwnSchedule: win.input("can-manage-own-schedule").checked
        };
        let response;
        try {
          response = await os.network.put(
            `/api/io.bithead.scheduler/admin/employee/${employeeId}`, payload
          );
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return false;
        }
        // Saved, so they are no longer this form's to discard.
        isNew = false;
        delegate.didSaveEmployee(response);
        return true;
      }
      this.save = save;

      /**
       * Remove them. The window has already asked.
       */
      async function _delete() {
        try {
          await os.network.delete(`/api/io.bithead.scheduler/admin/employee/${employeeId}`);
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return;
        }
        // The list never learned about a draft, so it has nothing to update.
        if (!isNew) {
          delegate.didDeleteEmployee(employeeId);
        }
        win.close();
      }
      this.delete = _delete;

      /**
       * Leave — and take the draft with us.
       *
       * An employee this window created exists on the server from the moment
       * it opened, so walking away has to remove them. The window has already
       * asked; this only carries it out.
       */
      async function cancel() {
        if (isNew) {
          await _delete();
          return;
        }
        win.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      /**
       * @param {number|null} _employeeId - Employee to edit, or `null` to create
       */
      function configure(_employeeId) {
        employeeId = _employeeId;
      }
      this.configure = configure;

      // --- Lifecycle ---

      /**
       * Create the employee up front, so working days and time off have
       * someone to belong to. Until this form saves over it, the draft is this
       * window's, and leaving discards it.
       */
      async function create() {
        let response;
        try {
          response = await os.network.post("/api/io.bithead.scheduler/admin/employee",
                                           { firstName: DRAFT_FIRST_NAME, lastName: "" });
        }
        catch {
          // Deliberately not awaited. `viewDidLoad` cannot close its own
          // window — the lifecycle has to finish first — so the close is hung
          // off the alert and runs once the user has read it.
          os.ui.showAlert("Failed to create the employee. Please try again later.")
               .then(function() { win.close(); });
          return;
        }
        employeeId = response.id;
        isNew = true;
        await reload();
      }

      async function viewDidLoad() {
        // Wired before the branch below, because a new employee gains working
        // days after `create` and `viewDidLoad` does not run again.
        win.select("schedule").ui.setDefaultAction(editScheduleDay);
        win.select("time-off").ui.setDefaultAction(editTimeOff);

        if (isEmpty(employeeId)) {
          await create();
          return;
        }
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        win.input("first-name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      // Enter is the window's to wire: a document gives it to the default
      // control, so `didHitEnter` is not declared here.
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Employee</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">

    <fieldset>
      <legend>Personal Info</legend>
      <div class="vbox gap-10">
        <div class="text-field">
          <label for="first-name">First Name</label>
          <input type="text" name="first-name" autocomplete="new-password">
        </div>
        <div class="text-field">
          <label for="last-name">Last Name</label>
          <input type="text" name="last-name" autocomplete="new-password">
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="include-in-schedule" checked>
          <label for="include-in-schedule">Include in the schedule</label>
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="can-manage-own-schedule">
          <label for="can-manage-own-schedule">May manage their own schedule and job types</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Weekly Schedule</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 140px;">
          <select name="schedule"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addScheduleDay();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-schedule-btn" class="primary" disabled onclick="$(this.controller).editScheduleDay();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Time Off</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 120px;">
          <select name="time-off"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addTimeOff();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-time-off-btn" class="primary" disabled onclick="$(this.controller).editTimeOff();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Job Types</legend>
      <p>The jobs this employee can be assigned to.</p>
      <div class="ui-list-box" style="width: 100%; height: 120px;">
        <select name="job-types" multiple></select>
      </div>
    </fieldset>

    <!-- No onclick: a document's controls are wired by the window, which asks
         before discarding or deleting and disables them all while one runs. -->
    <div class="controls">
      <button class="primary" doc-action="cancel">Cancel</button>
      <button class="primary" doc-action="delete">Delete</button>
      <button class="default" doc-action="save">Save</button>
    </div>

  </div>
</div>
