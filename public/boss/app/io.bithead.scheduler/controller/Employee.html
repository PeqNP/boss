<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      let employeeId = null;

      const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

      // EmployeeDelegate
      let delegate = protocol(
        "EmployeeDelegate", this, "delegate",
        ["didSaveEmployee", "didDeleteEmployee"]
      );

      // --- Private helpers ---

      function buildScheduleRow(day) {
        const tr = document.createElement("tr");
        tr.dataset.day = day.dayOfWeek;
        tr.innerHTML =
          "<td>" + DAY_NAMES[day.dayOfWeek] + "</td>" +
          "<td><input type='time' value='" + (day.startTime || "08:00") + "'></td>" +
          "<td><input type='time' value='" + (day.endTime || "17:00") + "'></td>" +
          "<td><button class='primary delete' onclick='$(this.controller).removeScheduleRow(this);'></button></td>";
        return tr;
      }

      function buildTimeOffRow(window) {
        const tr = document.createElement("tr");
        tr.dataset.windowId = window.id || "";
        tr.innerHTML =
          "<td><input type='date' value='" + (window.date || "") + "'></td>" +
          "<td><input type='time' value='" + (window.startTime || "08:00") + "'></td>" +
          "<td><input type='time' value='" + (window.endTime || "12:00") + "'></td>" +
          "<td><button class='primary delete' onclick='$(this.controller).removeTimeOffRow(this);'></button></td>";
        return tr;
      }

      // --- Controller functions ---

      function addScheduleDay() {
        const sel = view.ui.select("add-day-select");
        const day = parseInt(sel.value);
        const tbody = view.ui.table("schedule-table").querySelector("tbody");
        tbody.appendChild(buildScheduleRow({dayOfWeek: day, startTime: "08:00", endTime: "17:00"}));
      }
      this.addScheduleDay = addScheduleDay;

      function removeScheduleRow(btn) {
        btn.closest("tr").remove();
      }
      this.removeScheduleRow = removeScheduleRow;

      function addTimeOff() {
        const tbody = view.ui.table("time-off-table").querySelector("tbody");
        tbody.appendChild(buildTimeOffRow({id: null, date: "", startTime: "08:00", endTime: "12:00"}));
      }
      this.addTimeOff = addTimeOff;

      function removeTimeOffRow(btn) {
        btn.closest("tr").remove();
      }
      this.removeTimeOffRow = removeTimeOffRow;

      async function save() {
        const firstName = view.ui.inputValue("first-name", "Please provide a first name.");
        if (isEmpty(firstName)) {
          return;
        }
        const lastName = view.ui.inputValue("last-name", "Please provide a last name.");
        if (isEmpty(lastName)) {
          return;
        }
        const payload = {
          firstName,
          lastName,
          includeInSchedule: view.ui.input("include-in-schedule").checked,
          canManageOwnSchedule: view.ui.input("can-manage-own-schedule").checked
        };
        try {
          if (isEmpty(employeeId)) {
            // TODO: POST /api/io.bithead.scheduler/admin/employee
            await os.network.post("/api/io.bithead.scheduler/admin/employee", payload);
          }
          else {
            // TODO: PUT /api/io.bithead.scheduler/admin/employee/{id}
            await os.network.put("/api/io.bithead.scheduler/admin/employee/" + employeeId, payload);
          }
        }
        catch {
          os.ui.showError("Failed to save employee. Please try again.");
          return;
        }
        delegate.didSaveEmployee();
        view.ui.close();
      }
      this.save = save;

      function _delete() {
        os.ui.showDelete("Are you sure you want to remove this employee?", null, async function() {
          try {
            // TODO: DELETE /api/io.bithead.scheduler/admin/employee/{id}
            await os.network.delete("/api/io.bithead.scheduler/admin/employee/" + employeeId);
          }
          catch {
            os.ui.showError("Failed to remove employee. Please try again.");
            return;
          }
          delegate.didDeleteEmployee();
          view.ui.close();
        });
      }
      this.delete = _delete;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      function configure(_employeeId) {
        employeeId = _employeeId;
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        if (isEmpty(employeeId)) {
          return;
        }
        let response;
        try {
          // TODO: GET /api/io.bithead.scheduler/admin/employee/{id}
          response = await os.network.get("/api/io.bithead.scheduler/admin/employee/" + employeeId);
        }
        catch {
          os.ui.showError("Failed to load employee. Please try again.");
          return;
        }
        view.ui.input("first-name").value = response.firstName;
        view.ui.input("last-name").value = response.lastName;
        view.ui.input("include-in-schedule").checked = response.includeInSchedule;
        view.ui.input("can-manage-own-schedule").checked = response.canManageOwnSchedule;

        const schedTbody = view.ui.table("schedule-table").querySelector("tbody");
        schedTbody.innerHTML = "";
        for (const day of response.scheduleTemplate) {
          schedTbody.appendChild(buildScheduleRow(day));
        }

        const timeOffTbody = view.ui.table("time-off-table").querySelector("tbody");
        timeOffTbody.innerHTML = "";
        for (const w of response.timeOff) {
          timeOffTbody.appendChild(buildTimeOffRow(w));
        }

        // Job types
        const jtSel = view.ui.select("job-types");
        jtSel.innerHTML = "";
        for (const jt of response.jobTypes) {
          const opt = document.createElement("option");
          opt.value = jt.id;
          opt.textContent = jt.name;
          opt.selected = true;
          jtSel.appendChild(opt);
        }
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        view.ui.input("first-name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      // --- OS listeners ---

      this.didHitEnter = save;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).save();">Save</option>
        <option onclick="$(this.controller).delete();">Delete</option>
        <option onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Employee</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">

    <fieldset>
      <legend>Personal Info</legend>
      <div class="vbox gap-10">
        <div class="text-field">
          <label for="first-name">First Name</label>
          <input type="text" name="first-name" autocomplete="new-password">
        </div>
        <div class="text-field">
          <label for="last-name">Last Name</label>
          <input type="text" name="last-name" autocomplete="new-password">
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="include-in-schedule" checked>
          <label for="include-in-schedule">Include in schedule</label>
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="can-manage-own-schedule">
          <label for="can-manage-own-schedule">Can manage own schedule and job types</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Weekly Schedule Template</legend>
      <table name="schedule-table" style="width: 100%;">
        <thead>
          <tr>
            <th>Day</th>
            <th>Start</th>
            <th>End</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="hbox gap-10" style="margin-top: 6px; align-items: flex-end;">
        <div class="ui-popup-menu stacked" style="width: 160px;">
          <label>Day</label>
          <select name="add-day-select">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </div>
        <button class="primary" onclick="$(this.controller).addScheduleDay();">Add Day</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Time Off</legend>
      <table name="time-off-table" style="width: 100%;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Start</th>
            <th>End</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="primary" onclick="$(this.controller).addTimeOff();" style="margin-top: 6px;">Add Time Off</button>
    </fieldset>

    <fieldset>
      <legend>Job Types (can perform)</legend>
      <div class="ui-list-box" style="width: 100%; height: 120px;">
        <select name="job-types" multiple></select>
      </div>
      <p style="font-size: 0.85em; margin-top: 4px;">Hold ⌘ / Ctrl to select multiple.</p>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button class="primary" onclick="$(this.controller).delete();">Delete</button>
      <button class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
