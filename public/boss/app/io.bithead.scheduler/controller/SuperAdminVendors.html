<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      let vendors = [];

      // A document: the window owns Save, asks before discarding a choice
      // nobody saved, and says "Saved". Vendors are registered by the
      // platform, so there is nothing here to delete.
      this.document = new UIDocument(null, null);

      // --- Controller functions ---

      /**
       * Write every vendor choice.
       *
       * @returns {boolean} `true` when all of them were written
       */
      async function save() {
        for (const v of vendors) {
          const vendorSel = win.select("vendor-select-" + v.type);
          if (isEmpty(vendorSel)) {
            continue;
          }
          // Through `.ui`: the raw `value` reports the prompt as a choice.
          const selectedVendor = vendorSel.ui.selectedValue();
          const payload = { vendor: selectedVendor, config: {} };
          try {
            await os.network.put(`/api/io.bithead.scheduler/superadmin/vendor/${v.type}`, payload);
          }
          catch (error) {
            // Named, because several are saved in turn and "it failed" does
            // not say which one still holds its old vendor.
            win.showMessage(v.type + ": " + error.message, { error: true });
            return false;
          }
        }
        return true;
      }
      this.save = save;

      // --- Lifecycle ---

      async function viewDidLoad() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/superadmin/vendors");
        }
        catch {
          os.ui.showError("Failed to load vendor config. Please try again.");
          return;
        }
        vendors = response.vendors;
        const container = win.div("vendors-container");
        container.innerHTML = "";
        for (const v of vendors) {
          const section = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = v.type.charAt(0).toUpperCase() + v.type.slice(1) + " Vendor";
          section.appendChild(legend);
          // Built by the factory rather than by hand: the styling pass that
          // attaches a menu's `ui` interface runs once, when the window
          // renders, so a `select` assembled afterwards stays a bare HTML
          // control. See js.md, "Building components at run-time".
          const menu = os.ui.makePopupMenu(
            "vendor-select-" + v.type,
            "Vendor",
            "No vendor",
            v.registeredVendors.map(function(name) {
              return { id: name, name: name };
            })
          );
          section.appendChild(menu);
          if (!isEmpty(v.currentVendor)) {
            menu.querySelector("select").ui.selectValue(v.currentVendor);
          }
          if (!isEmpty(v.config)) {
            const configNote = document.createElement("p");
            configNote.style.fontSize = "0.85em";
            configNote.textContent = "Current config keys: " + Object.keys(v.config).join(", ");
            section.appendChild(configNote);
          }
          container.appendChild(section);
        }
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Vendor Integrations</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 480px;">
    <p>Configure platform-level vendor integrations for email and SMS delivery.</p>
    <div name="vendors-container" class="vbox gap-20"></div>
    <div class="controls">
      <button class="default" doc-action="save">Save</button>
    </div>
  </div>
</div>
