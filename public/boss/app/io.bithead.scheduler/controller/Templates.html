<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // TemplateDelegate
      let templateDelegate = {
        didSaveTemplate: loadTemplates,
        didDeleteTemplate: loadTemplates
      };

      // --- Controller functions ---

      async function addTemplate() {
        const win = await $(app.controller).loadController("Template");
        win.ui.show(function(ctrl) {
          ctrl.delegate = templateDelegate;
        });
      }
      this.addTemplate = addTemplate;

      async function editTemplate() {
        const value = view.ui.select("templates").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("Template");
        win.ui.show(function(ctrl) {
          ctrl.configure({ templateId: parseInt(value) });
          ctrl.delegate = templateDelegate;
        });
      }
      this.editTemplate = editTemplate;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("templates").ui.setDefaultAction(editTemplate);
        await loadTemplates();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadTemplates() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/templates");
        }
        catch {
          os.ui.showError("Failed to load the templates. Please try again later.");
          return;
        }
        view.ui.select("templates").ui.addNewOptions(
          response.templates.map(function(t) {
            return { id: String(t.id), name: `${t.name} — ${t.description}` };
          })
        );
        view.ui.button("edit-btn").disabled = response.templates.length === 0;
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 180px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).addTemplate();">Add Template</option>
        <option onclick="$(this.controller).editTemplate();">Edit Template</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Business Templates</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">
    <p>A template pre-configures a business for a kind of trade. An operator
       chooses one when they sign up.</p>
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 240px;">
        <select name="templates"></select>
      </div>
      <div class="controls-right separated">
        <div class="vbox gap-10">
          <button class="primary" onclick="$(this.controller).addTemplate();">Add</button>
        </div>
        <div class="vbox gap-10">
          <button name="edit-btn" class="default" disabled onclick="$(this.controller).editTemplate();">Edit</button>
        </div>
      </div>
    </div>
  </div>
</div>
