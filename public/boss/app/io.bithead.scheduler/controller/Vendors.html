<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      let channels = [];

      // A document: the window owns Save, asks before discarding a choice
      // nobody saved, and says "Saved". The catalog is code, so there is
      // nothing here to delete.
      this.document = new UIDocument(null, null);

      // --- Controller functions ---

      function offerFor(channel, vendorId) {
        return (channel.vendors || []).find(function(offer) {
          return offer.id === vendorId;
        }) || null;
      }

      function renderFields(channel) {
        const container = win.div(`vendor-fields-${channel.channel}`);
        container.innerHTML = "";
        const menu = win.select(`vendor-select-${channel.channel}`);
        const vendorId = isEmpty(menu) ? "" : menu.ui.selectedValue();
        const offer = offerFor(channel, vendorId);
        if (isEmpty(offer) || isEmpty(offer.fields)) {
          return;
        }
        const configured = new Set(channel.configuredKeys || []);
        const saved = (channel.chosen === vendorId) ? (channel.config || {}) : {};
        for (const field of offer.fields) {
          const input = os.ui.makeTextField(
            `vendor-field-${channel.channel}-${field.key}`,
            field.label,
            {
              type: field.kind === "password" ? "password"
                : field.kind === "number" ? "number"
                : "text",
              classes: "stacked"
            }
          );
          const control = input.querySelector("input");
          if (field.secret && configured.has(field.key)) {
            control.placeholder = "unchanged";
          }
          else if (!isEmpty(saved[field.key])) {
            control.value = saved[field.key];
          }
          else if (!isEmpty(field.default)) {
            control.value = field.default;
          }
          container.appendChild(input);
        }
      }
      this.renderFields = renderFields;

      /**
       * Write every vendor choice.
       *
       * @returns {boolean} `true` when all of them were written
       */
      async function save() {
        for (const channel of channels) {
          const menu = win.select(`vendor-select-${channel.channel}`);
          const vendorId = isEmpty(menu) ? "" : menu.ui.selectedValue();
          const offer = offerFor(channel, vendorId);
          const config = {};
          if (!isEmpty(offer)) {
            for (const field of offer.fields || []) {
              const control = win.input(
                `vendor-field-${channel.channel}-${field.key}`
              );
              config[field.key] = isEmpty(control) ? "" : control.value;
            }
          }
          try {
            await os.network.put(
              `/api/io.bithead.scheduler/vendor/${channel.channel}`,
              { id: isEmpty(vendorId) ? null : vendorId, config }
            );
          }
          catch (error) {
            win.showMessage(
              `${channel.channel}: ${error.message}`,
              { error: true }
            );
            return false;
          }
        }
        return true;
      }
      this.save = save;

      function cancel() {
        win.close();
      }
      this.cancel = cancel;

      // --- Lifecycle ---

      async function viewDidLoad() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/vendors");
        }
        catch {
          os.ui.showError("Failed to load vendor config. Please try again.");
          return;
        }
        channels = response.vendors;
        const container = win.div("vendors-container");
        container.innerHTML = "";
        for (const channel of channels) {
          const section = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = channel.channel.charAt(0).toUpperCase()
            + channel.channel.slice(1) + " Vendor";
          section.appendChild(legend);
          // Built by the factory rather than by hand: the styling pass that
          // attaches a menu's `ui` interface runs once, when the window
          // renders, so a `select` assembled afterwards stays a bare HTML
          // control. See js.md, "Building components at run-time".
          const menu = os.ui.makePopupMenu(
            `vendor-select-${channel.channel}`,
            "Vendor",
            "No vendor",
            channel.vendors.map(function(offer) {
              return { id: offer.id, name: offer.name };
            })
          );
          section.appendChild(menu);
          const fields = document.createElement("div");
          fields.setAttribute("name", `vendor-fields-${channel.channel}`);
          fields.className = "vbox gap-10";
          section.appendChild(fields);
          container.appendChild(section);
          const select = menu.querySelector("select");
          select.onchange = (function(ch) {
            return function() { renderFields(ch); };
          })(channel);
          if (!isEmpty(channel.chosen)) {
            select.ui.selectValue(channel.chosen);
          }
          renderFields(channel);
        }
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Vendor Integrations</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 480px;">
    <p>Choose how this platform sends email and SMS, and how it takes card payments.</p>
    <div name="vendors-container" class="vbox gap-20"></div>
    <div class="controls">
      <button class="primary" doc-action="cancel">Cancel</button>
      <button class="default" doc-action="save">Save</button>
    </div>
  </div>
</div>
