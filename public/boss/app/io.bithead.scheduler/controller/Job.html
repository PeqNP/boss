<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      const businessId = $(app.controller).getBusinessId();

      let jobId = null;
      let productCost = null;

      this.document = new UIDocument(null, null);

      let delegate = protocol(
        "JobDelegate", this, "delegate",
        ["didSaveJob", "didDeleteJob"]
      );

      // --- Private helpers ---

      /**
       * Returns the employees matching a search term.
       *
       * @param {string} term - Search term. Empty returns every employee.
       * @returns {[{id: string, name: string}]} Choices for the token menu
       */
      async function searchEmployees(term) {
        const query = isEmpty(term)
          ? "" : `?${new URLSearchParams({ term: term }).toString()}`;
        let response;
        try {
          response = await os.network.get(
            `/api/io.bithead.scheduler/business/${businessId}/employees${query}`
          );
        }
        catch {
          os.ui.showError("Failed to load employees. Please try again.");
          return [];
        }
        return (response.employees || []).map(function(e) {
          return { id: String(e.id), name: `${e.firstName} ${e.lastName}` };
        });
      }

      /**
       * Keeps Record Payment from enabling Save.
       *
       * The OS marks every input dirty. These fields are an action of their
       * own, not an edit to the appointment.
       *
       * @param {HTMLElement} element
       * @param {string} event - "oninput" or "onchange"
       */
      function ignoreDirty(element, event) {
        const existing = element[event];
        element[event] = function(e) {
          const wasDirty = win.isDirty;
          if (!isEmpty(existing)) {
            existing.call(element, e);
          }
          if (!wasDirty) {
            win.setDirty(false);
          }
        };
      }

      function fillPaymentAmount() {
        if (!isNumeric(productCost)) {
          return;
        }
        win.input("payment-amount").value = Number(productCost).toFixed(2);
      }

      function buildTransactionRow(tx) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>$${tx.amount.toFixed(2)}</td><td>${tx.method}</td><td>${(tx.date || "")}</td><td>${(tx.collectedBy || "—")}</td>`;
        return tr;
      }

      // --- Controller functions ---

      /**
       * Writes the schedule and the crew.
       *
       * Reports the save to the delegate, and shows an error in the window
       * when the date or time is missing.
       *
       * @returns {boolean} `true` when something was written
       */
      async function save() {
        const scheduledDate = win.input("scheduled-date").value;
        const scheduledTime = win.input("scheduled-time").value;
        if (isEmpty(scheduledDate) || isEmpty(scheduledTime)) {
          win.showMessage("Please provide a date and time.", { error: true });
          return false;
        }
        const employeeIds = Array.from(win.select("job-employees").selectedOptions)
          .map(function(o) { return parseInt(o.value); });
        const payload = { scheduledDate, scheduledTime, employeeIds };
        try {
          await os.network.put(`/api/io.bithead.scheduler/business/${businessId}/job/${jobId}`, payload);
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return false;
        }
        delegate.didSaveJob();
        return true;
      }
      this.save = save;

      function cancel() {
        win.close();
      }
      this.cancel = cancel;

      /**
       * Marks the job completed, asking first.
       *
       * Closes the window once the job is complete.
       */
      async function markComplete() {
        os.ui.showConfirmation("Mark this job as completed?", null, async function() {
          try {
            await os.network.post(`/api/io.bithead.scheduler/business/${businessId}/job/${jobId}/complete`);
          }
          catch (error) {
            win.showMessage(error.message, { error: true });
            return;
          }
          delegate.didSaveJob();
          win.close();
        });
      }
      this.markComplete = os.ui.mutex(markComplete);

      /**
       * Cancel the appointment and close the window.
       */
      async function cancelJob() {
        os.ui.showConfirmation("Cancel this appointment?", null, async function() {
          try {
            await os.network.post(`/api/io.bithead.scheduler/business/${businessId}/job/${jobId}/cancel`);
          }
          catch (error) {
            win.showMessage(error.message, { error: true });
            return;
          }
          delegate.didSaveJob();
          win.close();
        });
      }
      this.cancelJob = os.ui.mutex(cancelJob);

      async function showQrPayment() {
        const child = await $(app.controller).loadController("QRPayment");
        child.ui.show(function(ctrl) {
          ctrl.configure(jobId);
        });
      }
      this.showQrPayment = showQrPayment;

      async function addPayment() {
        const amount = parseFloat(win.input("payment-amount").value);
        if (!isNumeric(amount) || amount <= 0) {
          os.ui.showAlert("Please provide the amount that was paid.");
          return;
        }
        // Checked here so the operator is told what is missing. The server
        // refuses a payment with no method, but its answer only says the
        // payment failed.
        const method = win.select("payment-method").ui.selectedValue();
        if (isEmpty(method)) {
          os.ui.showAlert("Please choose how it was paid.");
          return;
        }
        let response;
        try {
          response = await os.network.post(`/api/io.bithead.scheduler/business/${businessId}/job/${jobId}/payment`, { amount, method });
        }
        catch {
          os.ui.showError("Failed to record payment. Please try again.");
          return;
        }
        fillPaymentAmount();
        win.span("payment-status").textContent = response.paymentStatus;
        await loadTransactions();
      }
      this.addPayment = addPayment;

      /**
       * Stops chasing the balance.
       */
      async function writeOff() {
        os.ui.showConfirmation("Stop chasing the balance on this job?", null, async function() {
          let response;
          try {
            response = await os.network.post(
              `/api/io.bithead.scheduler/business/${businessId}/job/${jobId}/write-off`
            );
          }
          catch (error) {
            win.showMessage(error.message, { error: true });
            return;
          }
          win.span("payment-status").textContent = response.paymentStatus;
          win.button("write-off-btn").disabled = true;
        });
      }
      this.writeOff = os.ui.mutex(writeOff);

      // --- Configure ---

      function configure(_jobId) {
        jobId = _jobId;
      }
      this.configure = configure;

      async function viewDidLoad() {
        // Wire employees token menu
        win.select("job-employees").ui.delegate = {
          didFocusTokenMenu: async function() {
            return await searchEmployees("");
          },
          didSearchForTerm: async function(term) {
            return await searchEmployees(term);
          },
          didAddToken: async function() {
            win.setDirty(true);
          },
          didRemoveToken: async function() {
            win.setDirty(true);
          }
        };
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/business/${businessId}/job/${jobId}`);
        }
        catch {
          os.ui.showError("Failed to load job. Please try again.");
          return;
        }

        win.span("job-code").textContent = response.jobCode;
        win.span("job-type").textContent = response.jobType.name;
        win.span("job-size").textContent = response.size ? response.size.name : "—";
        productCost = response.size ? response.size.cost : null;
        fillPaymentAmount();
        win.span("job-duration").textContent = `${response.durationMinutes} min`;
        win.span("job-status").textContent = response.status;

        // `locked` means the customer failed too many verification codes and
        // can no longer change this appointment themselves. An operator still
        // can. The notice tells them why the customer is calling.
        if (response.locked === true) {
          win.span("job-locked-attempts").innerText = response.failedCodeAttempts;
          win.div("job-locked-notice").style.display = "";
        }
        win.span("payment-status").textContent = response.paymentStatus;
        if (response.paymentStatus === "written_off") {
          win.button("write-off-btn").disabled = true;
        }
        win.button("qr-payment-btn").disabled = response.stripeConfigured !== true;
        win.input("scheduled-date").value = response.scheduledDate;
        win.input("scheduled-time").value = response.scheduledTime;

        // Customer
        if (!isEmpty(response.customer)) {
          const c = response.customer;
          win.span("customer-name").textContent = c.name;
          win.span("customer-phone").textContent = c.phone || "—";
          win.span("customer-address").textContent =
            [c.addressLine1, c.city, c.state].filter(Boolean).join(", ");
        }

        // Employees
        const employeesMenu = win.select("job-employees").ui;
        employeesMenu.setTokens(
          (response.employees || []).map(function(e) {
            return { id: String(e.id), name: `${e.firstName} ${e.lastName}` };
          })
        );

        // Attributes
        const attrTbody = win.table("attributes-table").querySelector("tbody");
        attrTbody.innerHTML = "";
        for (const a of response.attributes) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${a.name}</td><td>${a.value}</td>`;
          attrTbody.appendChild(tr);
        }

        // Transactions
        await loadTransactions();
        ignoreDirty(win.input("payment-amount"), "oninput");
        ignoreDirty(win.select("payment-method"), "onchange");
      }
      this.viewDidLoad = viewDidLoad;

      async function loadTransactions() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/business/${businessId}/job/${jobId}`);
        }
        catch {
          return;
        }
        const tbody = win.table("transactions-table").querySelector("tbody");
        tbody.innerHTML = "";
        for (const tx of response.transactions) {
          tbody.appendChild(buildTransactionRow(tx));
        }
      }
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Job</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 550px;">

    <fieldset>
      <legend>Details</legend>
      <div class="vbox gap-10 wider-labels">
        <div class="read-only">
          <label>Job Code</label>
          <span name="job-code"></span>
        </div>
        <div class="read-only">
          <label>Job Type</label>
          <span name="job-type"></span>
        </div>
        <div class="read-only">
          <label>Size</label>
          <span name="job-size"></span>
        </div>
        <div class="read-only">
          <label>Duration</label>
          <span name="job-duration"></span>
        </div>
        <div class="read-only">
          <label>Status</label>
          <span name="job-status"></span>
        </div>
        <div class="read-only">
          <label>Payment Status</label>
          <span name="payment-status"></span>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Schedule</legend>
      <div class="vbox gap-10 wider-labels">
        <div class="text-field">
          <label for="scheduled-date">Date</label>
          <input type="date" name="scheduled-date">
        </div>
        <div class="text-field">
          <label for="scheduled-time">Time</label>
          <input type="time" name="scheduled-time">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Customer</legend>
      <div class="vbox gap-10 wider-labels">
        <div class="read-only">
          <label>Name</label>
          <span name="customer-name"></span>
        </div>
        <div class="read-only">
          <label>Phone</label>
          <span name="customer-phone"></span>
        </div>
        <div class="read-only">
          <label>Address</label>
          <span name="customer-address"></span>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Employees</legend>
      <div class="ui-token-menu" style="width: 100%;">
        <select name="job-employees"></select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Job Attributes</legend>
      <table name="attributes-table" style="width: 100%;">
        <thead><tr><th>Attribute</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table>
    </fieldset>

    <fieldset class="vbox gap-10">
      <legend>Payments</legend>
      <table name="transactions-table" style="width: 100%; margin-bottom: 8px;">
        <thead>
          <tr>
            <th>Amount</th>
            <th>Method</th>
            <th>Date</th>
            <th>Collected By</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="hbox gap-10" style="align-items: flex-end;">
        <div class="text-field">
          <label for="payment-amount">Amount ($)</label>
          <input type="number" name="payment-amount" placeholder="0.00" step="0.01" style="width: 100px;">
        </div>
        <div class="ui-popup-menu stacked" style="--popup-width: 160px;">
          <label>Method</label>
          <select name="payment-method">
            <option>Choose a method</option>
            <option value="cash">Cash</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="hbox gap-10" style="margin-top: 10px;">
        <button name="write-off-btn" class="primary" onclick="$(this.controller).writeOff();">Write Off</button>
        <button name="qr-payment-btn" class="primary" disabled onclick="$(this.controller).showQrPayment();">QR Code</button>
        <button name="record-payment-btn" class="primary" onclick="$(this.controller).addPayment();">Record</button>
      </div>
    </fieldset>

    <div name="job-locked-notice" class="info-message" style="display: none;">
      The customer failed to provide the correct verification code
      <span name="job-locked-attempts"></span> times, so this appointment is
      locked to them. Only the business may change it now.
    </div>

    <div class="controls">
      <button class="primary" doc-action="cancel">Cancel</button>
      <button name="cancel-job-btn" class="primary" onclick="$(this.controller).cancelJob();">Cancel Appointment</button>
      <button name="complete-btn" class="primary" onclick="$(this.controller).markComplete();">Mark Complete</button>
      <button name="save-btn" class="default" doc-action="save">Save</button>
    </div>

  </div>
</div>
