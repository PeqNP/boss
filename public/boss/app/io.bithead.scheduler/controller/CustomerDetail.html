<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      let customerId = null;
      let hasBossAccount = false;

      // CustomerDelegate
      let delegate = protocol(
        "CustomerDetailDelegate", this, "delegate",
        ["didUpdateCustomer"]
      );

      // --- Private helpers ---

      function buildNoteRow(note) {
        const tr = document.createElement("tr");
        tr.dataset.noteId = note.id;
        tr.innerHTML =
          "<td style='white-space: pre-wrap; max-width: 260px;'>" + note.note + "</td>" +
          "<td>" + note.createdBy + "</td>" +
          "<td>" + note.date + "</td>" +
          "<td>" +
            "<button onclick='$(this.controller).editNote(" + note.id + ");'>Edit</button> " +
            "<button onclick='$(this.controller).deleteNote(" + note.id + ");'>✕</button>" +
          "</td>";
        return tr;
      }

      // --- Controller functions ---

      async function save() {
        if (hasBossAccount) {
          return;
        }
        const payload = {
          firstName: view.ui.input("first-name").value,
          lastName: view.ui.input("last-name").value,
          phone: view.ui.input("phone").value,
          email: view.ui.input("email").value,
          addressLine1: view.ui.input("address-line1").value,
          addressLine2: view.ui.input("address-line2").value,
          city: view.ui.input("city").value,
          state: view.ui.input("state").value,
          zip: view.ui.input("zip").value
        };
        try {
          // TODO: PUT /api/io.bithead.scheduler/admin/customer/{id}
          await os.network.put("/api/io.bithead.scheduler/admin/customer/" + customerId, payload);
        }
        catch {
          os.ui.showError("Failed to save customer info. Please try again.");
          return;
        }
        delegate.didUpdateCustomer();
        view.ui.close();
      }
      this.save = save;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      async function addNote() {
        const noteText = view.ui.textarea("new-note").value.trim();
        if (isEmpty(noteText)) {
          os.ui.showError("Please enter a note.");
          return;
        }
        try {
          // TODO: POST /api/io.bithead.scheduler/admin/customer/{id}/notes
          await os.network.post("/api/io.bithead.scheduler/admin/customer/" + customerId + "/notes", { note: noteText });
        }
        catch {
          os.ui.showError("Failed to add note. Please try again.");
          return;
        }
        view.ui.textarea("new-note").value = "";
        await loadNotes();
      }
      this.addNote = addNote;

      async function editNote(noteId) {
        const tr = view.ui.table("notes-table").querySelector("tr[data-note-id='" + noteId + "']");
        const currentText = tr ? tr.cells[0].textContent : "";
        const newText = prompt("Edit note:", currentText);
        if (isEmpty(newText)) {
          return;
        }
        try {
          // TODO: PUT /api/io.bithead.scheduler/admin/customer/{id}/note/{noteId}
          await os.network.put("/api/io.bithead.scheduler/admin/customer/" + customerId + "/note/" + noteId, { note: newText });
        }
        catch {
          os.ui.showError("Failed to update note. Please try again.");
          return;
        }
        await loadNotes();
      }
      this.editNote = editNote;

      async function deleteNote(noteId) {
        os.ui.showDelete("Delete this note?", null, async function() {
          try {
            // TODO: DELETE /api/io.bithead.scheduler/admin/customer/{id}/note/{noteId}
            await os.network.delete("/api/io.bithead.scheduler/admin/customer/" + customerId + "/note/" + noteId);
          }
          catch {
            os.ui.showError("Failed to delete note. Please try again.");
            return;
          }
          await loadNotes();
        });
      }
      this.deleteNote = deleteNote;

      // --- Configure ---

      function configure(_customerId) {
        customerId = _customerId;
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        let response;
        try {
          // TODO: GET /api/io.bithead.scheduler/admin/customer/{id}
          response = await os.network.get("/api/io.bithead.scheduler/admin/customer/" + customerId);
        }
        catch {
          os.ui.showError("Failed to load customer. Please try again.");
          return;
        }
        hasBossAccount = response.hasBossAccount;

        // Contact info — read-only if BOSS account exists
        const readOnly = hasBossAccount;
        function setField(name, value) {
          const el = view.ui.input(name);
          if (el) {
            el.value = value || "";
            el.readOnly = readOnly;
          }
        }
        setField("first-name", response.firstName);
        setField("last-name", response.lastName);
        setField("phone", response.phone);
        setField("email", response.email);
        setField("address-line1", response.addressLine1);
        setField("address-line2", response.addressLine2);
        setField("city", response.city);
        setField("state", response.state);
        setField("zip", response.zip);

        if (hasBossAccount) {
          view.ui.div("boss-account-notice").style.display = "";
          view.ui.button("save-btn").style.display = "none";
        }

        // Notes
        await loadNotes();

        // Appointment history
        const apptTbody = view.ui.table("appointments-table").querySelector("tbody");
        apptTbody.innerHTML = "";
        for (const a of response.appointments) {
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + a.jobCode + "</td>" +
            "<td>" + a.jobType + "</td>" +
            "<td>" + a.displayDate + " " + (a.displayTime || "") + "</td>" +
            "<td>" + a.status + "</td>";
          apptTbody.appendChild(tr);
        }
      }
      this.viewDidLoad = viewDidLoad;

      async function loadNotes() {
        let response;
        try {
          // Notes are included in the customer detail response, but here we reload the customer.
          // In production this would be a dedicated notes endpoint.
          response = await os.network.get("/api/io.bithead.scheduler/admin/customer/" + customerId);
        }
        catch {
          return;
        }
        const tbody = view.ui.table("notes-table").querySelector("tbody");
        tbody.innerHTML = "";
        for (const n of response.notes) {
          tbody.appendChild(buildNoteRow(n));
        }
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).save();">Save</option>
        <option onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Customer</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">

    <div name="boss-account-notice" style="display: none;">
      <p><strong>This customer has a BOSS account.</strong> Contact info is managed by the customer and is read-only here.</p>
    </div>

    <fieldset>
      <legend>Contact Info</legend>
      <div class="vbox gap-20">
        <div class="text-field">
          <label for="first-name">First Name</label>
          <input type="text" name="first-name">
        </div>
        <div class="text-field">
          <label for="last-name">Last Name</label>
          <input type="text" name="last-name">
        </div>
        <div class="text-field">
          <label for="phone">Phone</label>
          <input type="text" name="phone">
        </div>
        <div class="text-field">
          <label for="email">Email</label>
          <input type="text" name="email">
        </div>
        <div class="text-field">
          <label for="address-line1">Address Line 1</label>
          <input type="text" name="address-line1">
        </div>
        <div class="text-field">
          <label for="address-line2">Address Line 2</label>
          <input type="text" name="address-line2">
        </div>
        <div class="hbox gap-10">
          <div class="text-field" style="flex: 2;">
            <label for="city">City</label>
            <input type="text" name="city">
          </div>
          <div class="text-field" style="flex: 1;">
            <label for="state">State</label>
            <input type="text" name="state">
          </div>
          <div class="text-field" style="flex: 1;">
            <label for="zip">Zip</label>
            <input type="text" name="zip">
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notes</legend>
      <table name="notes-table" style="width: 100%;">
        <thead>
          <tr>
            <th>Note</th>
            <th>By</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="textarea-field">
        <label for="new-note">Add Note</label>
        <textarea name="new-note" rows="3"></textarea>
      </div>
      <button class="primary" onclick="$(this.controller).addNote();">Add Note</button>
    </fieldset>

    <fieldset>
      <legend>Appointment History</legend>
      <table name="appointments-table" style="width: 100%;">
        <thead>
          <tr>
            <th>Code</th>
            <th>Job Type</th>
            <th>Date/Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button name="save-btn" class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
