<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      let jobId = null;

      // JobEditDelegate
      let delegate = protocol(
        "JobEditDelegate", this, "delegate",
        ["didSaveJob", "didDeleteJob"]
      );

      // --- Private helpers ---

      function formatTime(t) {
        if (isEmpty(t)) { return "—"; }
        const [h, m] = t.split(":").map(Number);
        const ampm = h >= 12 ? "PM" : "AM";
        const h12 = h % 12 || 12;
        return `${h12}:${m.toString().padStart(2, "0")} ${ampm}`;
      }

      function buildTransactionRow(tx) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>$" + tx.amount.toFixed(2) + "</td>" +
          "<td>" + tx.method + "</td>" +
          "<td>" + (tx.date || "") + "</td>" +
          "<td>" + (tx.collectedBy || "—") + "</td>";
        return tr;
      }

      // --- Controller functions ---

      async function save() {
        const scheduledDate = view.ui.input("scheduled-date").value;
        const scheduledTime = view.ui.input("scheduled-time").value;
        if (isEmpty(scheduledDate) || isEmpty(scheduledTime)) {
          os.ui.showError("Please provide a date and time.");
          return;
        }
        const employeeIds = Array.from(view.ui.select("job-employees").selectedOptions)
          .map(function(o) { return parseInt(o.value); });
        const payload = { scheduledDate, scheduledTime, employeeIds };
        try {
          // TODO: PUT /api/io.bithead.scheduler/admin/job/{jobId}
          await os.network.put("/api/io.bithead.scheduler/admin/job/" + jobId, payload);
        }
        catch {
          os.ui.showError("Failed to save job. Please try again.");
          return;
        }
        delegate.didSaveJob();
        view.ui.close();
      }
      this.save = save;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      async function markComplete() {
        os.ui.showDelete("Mark this job as completed?", null, async function() {
          try {
            // TODO: POST /api/io.bithead.scheduler/admin/job/{jobId}/complete
            await os.network.post("/api/io.bithead.scheduler/admin/job/" + jobId + "/complete");
          }
          catch {
            os.ui.showError("Failed to mark complete. Please try again.");
            return;
          }
          delegate.didSaveJob();
          view.ui.close();
        });
      }
      this.markComplete = markComplete;

      async function showQrPayment() {
        const win = await $(app.controller).loadController("QRPayment");
        win.ui.show(function(ctrl) {
          ctrl.configure(jobId);
        });
      }
      this.showQrPayment = showQrPayment;

      async function addPayment() {
        const amount = parseFloat(view.ui.input("payment-amount").value);
        if (isNaN(amount) || amount <= 0) {
          os.ui.showError("Please enter a valid payment amount.");
          return;
        }
        const method = view.ui.select("payment-method").value;
        let response;
        try {
          // TODO: POST /api/io.bithead.scheduler/admin/job/{jobId}/payment
          response = await os.network.post("/api/io.bithead.scheduler/admin/job/" + jobId + "/payment", { amount, method });
        }
        catch {
          os.ui.showError("Failed to record payment. Please try again.");
          return;
        }
        view.ui.input("payment-amount").value = "";
        view.ui.span("payment-status").textContent = response.newPaymentStatus;
        await loadTransactions();
      }
      this.addPayment = addPayment;

      // --- Configure ---

      function configure(_jobId) {
        jobId = _jobId;
      }
      this.configure = configure;

      async function viewDidLoad() {
        // Wire employees token menu
        view.ui.select("job-employees").ui.delegate = {
          didFocusTokenMenu: async function() {
            // TODO: GET /api/io.bithead.scheduler/admin/employees
            const resp = await os.network.get("/api/io.bithead.scheduler/admin/employees");
            return (resp.employees || []).map(function(e) {
              return { id: String(e.id), name: e.firstName + " " + e.lastName };
            });
          },
          didSearchForTerm: async function(term) {
            const resp = await os.network.get("/api/io.bithead.scheduler/admin/employees");
            const lower = term.toLowerCase();
            return (resp.employees || [])
              .filter(function(e) { return (e.firstName + " " + e.lastName).toLowerCase().includes(lower); })
              .map(function(e) { return { id: String(e.id), name: e.firstName + " " + e.lastName }; });
          },
          didAddToken: async function() { },
          didRemoveToken: async function() { }
        };
        let response;
        try {
          // TODO: GET /api/io.bithead.scheduler/admin/job/{jobId}
          response = await os.network.get("/api/io.bithead.scheduler/admin/job/" + jobId);
        }
        catch {
          os.ui.showError("Failed to load job. Please try again.");
          return;
        }

        view.ui.span("job-code").textContent = response.jobCode;
        view.ui.span("job-type").textContent = response.jobType.name;
        view.ui.span("job-size").textContent = response.size ? response.size.name : "—";
        view.ui.span("job-duration").textContent = response.durationMinutes + " min";
        view.ui.span("job-status").textContent = response.status;
        view.ui.span("payment-status").textContent = response.paymentStatus;
        view.ui.input("scheduled-date").value = response.scheduledDate;
        view.ui.input("scheduled-time").value = response.scheduledTime;

        // Customer
        if (!isEmpty(response.customer)) {
          const c = response.customer;
          view.ui.span("customer-name").textContent = c.firstName + " " + c.lastName;
          view.ui.span("customer-phone").textContent = c.phone || "—";
          view.ui.span("customer-address").textContent =
            [c.addressLine1, c.city, c.state].filter(Boolean).join(", ");
        }

        // Employees
        const employeesMenu = view.ui.select("job-employees").ui;
        employeesMenu.setTokens(
          (response.employees || []).map(function(e) {
            return { id: String(e.id), name: e.firstName + " " + e.lastName };
          })
        );

        // Attributes
        const attrTbody = view.ui.table("attributes-table").querySelector("tbody");
        attrTbody.innerHTML = "";
        for (const a of response.attributes) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td>" + a.name + "</td><td>" + a.value + "</td>";
          attrTbody.appendChild(tr);
        }

        // Transactions
        await loadTransactions();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadTransactions() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/job/" + jobId);
        }
        catch {
          return;
        }
        const tbody = view.ui.table("transactions-table").querySelector("tbody");
        tbody.innerHTML = "";
        for (const tx of response.transactions) {
          tbody.appendChild(buildTransactionRow(tx));
        }
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 160px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).save();">Save</option>
        <option onclick="$(this.controller).markComplete();">Mark Complete</option>
        <option onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Job</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-14" style="width: 520px;">

    <fieldset>
      <legend>Details</legend>
      <div class="read-only">
        <label>Job Code</label>
        <span name="job-code"></span>
      </div>
      <div class="read-only">
        <label>Job Type</label>
        <span name="job-type"></span>
      </div>
      <div class="read-only">
        <label>Size</label>
        <span name="job-size"></span>
      </div>
      <div class="read-only">
        <label>Duration</label>
        <span name="job-duration"></span>
      </div>
      <div class="read-only">
        <label>Status</label>
        <span name="job-status"></span>
      </div>
      <div class="read-only">
        <label>Payment Status</label>
        <span name="payment-status"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Schedule</legend>
      <div class="text-field">
        <label for="scheduled-date">Date</label>
        <input type="date" name="scheduled-date">
      </div>
      <div class="text-field">
        <label for="scheduled-time">Time</label>
        <input type="time" name="scheduled-time">
      </div>
    </fieldset>

    <fieldset>
      <legend>Customer</legend>
      <div class="read-only">
        <label>Name</label>
        <span name="customer-name"></span>
      </div>
      <div class="read-only">
        <label>Phone</label>
        <span name="customer-phone"></span>
      </div>
      <div class="read-only">
        <label>Address</label>
        <span name="customer-address"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Employees</legend>
      <div class="ui-token-menu" style="width: 100%;">
        <select name="job-employees"></select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Job Attributes</legend>
      <table name="attributes-table" style="width: 100%;">
        <thead><tr><th>Attribute</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table>
    </fieldset>

    <fieldset>
      <legend>Payments</legend>
      <table name="transactions-table" style="width: 100%; margin-bottom: 8px;">
        <thead>
          <tr>
            <th>Amount</th>
            <th>Method</th>
            <th>Date</th>
            <th>Collected By</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="hbox gap-8" style="align-items: flex-end;">
        <div class="text-field">
          <label for="payment-amount">Amount ($)</label>
          <input type="number" name="payment-amount" placeholder="0.00" step="0.01" style="width: 100px;">
        </div>
        <div class="ui-popup-menu" style="width: 120px;">
          <label>Method</label>
          <select name="payment-method">
            <option value="cash">Cash</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button class="primary" onclick="$(this.controller).addPayment();">Record Payment</button>
        <button class="primary" onclick="$(this.controller).showQrPayment();">QR Code</button>
      </div>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button class="primary" onclick="$(this.controller).markComplete();">Mark Complete</button>
      <button class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
