<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {
      function close() {
        view.ui.close();
      }
      this.close = close;
    }
  </script>

  <div class="title">About Scheduler</div>

  <div class="container vbox gap-10" style="width: 300px;">
    <h1><img src="$(app.resourcePath)/icon.svg" width="26" height="26"> Scheduler</h1>
    <p>
      Scheduler — A multi-tenant appointment scheduling platform.
    </p>
    <p>2026 Bithead LLC. All rights reserved.</p>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
