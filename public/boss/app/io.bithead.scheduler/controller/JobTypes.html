<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // The business this window acts on, held by the app from `/me`.
      const businessId = $(app.controller).getBusinessId();

      // JobTypeDelegate
      let jobTypeDelegate = {
        didSaveJobType: loadJobTypes,
        didDeleteJobType: loadJobTypes
      };

      // --- Controller functions ---

      async function addJobType() {
        const win = await $(app.controller).loadController("JobType");
        win.ui.show(function(ctrl) {
          ctrl.delegate = jobTypeDelegate;
        });
      }
      this.addJobType = addJobType;

      async function editJobType() {
        const value = view.ui.select("job-types").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("JobType");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
          ctrl.delegate = jobTypeDelegate;
        });
      }
      this.editJobType = editJobType;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("job-types").ui.delegate = {
          didSelectListBoxOption: function() {
            view.ui.button("edit-btn").disabled = false;
          },
          didRemoveAllOptions: function() {
            view.ui.button("edit-btn").disabled = true;
          }
        };
        await loadJobTypes();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadJobTypes() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/business/${businessId}/job-types`);
        }
        catch {
          os.ui.showError("Failed to load job types. Please try again.");
          return;
        }
        view.ui.select("job-types").ui.addNewOptions(
          response.jobTypes.map(function(jt) {
            return { id: String(jt.id), name: jt.name + (jt.isActive ? "" : " (inactive)") };
          })
        );
        view.ui.button("edit-btn").disabled = response.jobTypes.length === 0;
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).addJobType();">Add Job Type</option>
        <option onclick="$(this.controller).editJobType();">Edit Job Type</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Job Types</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 340px;">
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 220px;">
        <select name="job-types"></select>
      </div>
      <div class="controls-right separated">
        <div class="vbox gap-10">
          <button class="primary" onclick="$(this.controller).addJobType();">Add</button>
        </div>
        <div class="vbox gap-10">
          <button name="edit-btn" class="default" disabled onclick="$(this.controller).editJobType();">Edit</button>
        </div>
      </div>
    </div>
  </div>
</div>
