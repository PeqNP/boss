<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      let businessId = null;

      // SuperAdminBusinessDelegate
      let delegate = protocol(
        "SuperAdminBusinessDelegate", this, "delegate",
        ["didSaveBusiness", "didDeleteBusiness"]
      );

      // This is a document: the window owns Cancel, Delete and Save, asks
      // before discarding or deleting, disables its controls while one runs,
      // and says "Saved" when one succeeds. Everything below is just the work.
      this.document = new UIDocument(
        "Permanently delete this business and all of its data?",
        null
      );

      // --- Controller functions ---

      /**
       * Writes the business and reports it to the delegate.
       *
       * Shows an error in the window when the name is missing or the write
       * fails, and reveals Delete once the business exists.
       *
       * @returns {boolean} `true` when something was written
       */
      async function save() {
        // `inputValue` with a message tells the user and throws, which stops
        // the save here. The window catches it, so no "Saved" is shown.
        const name = win.inputValue("biz-name", "Please provide a business name.");
        const payload = {
          name,
          ownerName: win.input("owner-name").value,
          phone: win.input("biz-phone").value,
          addressLine1: win.input("address-line1").value,
          city: win.input("city").value,
          state: win.input("state").value,
          zip: win.input("zip").value,
          timezone: win.select("timezone").ui.selectedValue(),
          isActive: win.input("is-active").checked
        };
        let response;
        try {
          if (isEmpty(businessId)) {
            response = await os.network.post("/api/io.bithead.scheduler/businesses", payload);
          }
          else {
            response = await os.network.put(`/api/io.bithead.scheduler/business/${businessId}`, payload);
          }
        }
        catch (error) {
          // In the window rather than over it: the form is still open and the
          // message belongs beside what it is about.
          win.showMessage(error.message, { error: true });
          return false;
        }
        if (isEmpty(businessId)) {
          // The business exists now. Without this the next Save would post a
          // second one — a window that stays open has to stop creating.
          businessId = response.businessId;
          win.button("delete-btn").style.display = null;
        }
        delegate.didSaveBusiness();
        return true;
      }
      this.save = save;

      /**
       * Deletes the business and closes the window.
       */
      async function _delete() {
        try {
          await os.network.delete(`/api/io.bithead.scheduler/business/${businessId}`);
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return;
        }
        delegate.didDeleteBusiness();
        win.close();
      }
      this.delete = _delete;

      async function toggleActive() {
        const enable = win.input("is-active").checked;
        const action = enable ? "enable" : "disable";
        try {
          await os.network.post(`/api/io.bithead.scheduler/business/${businessId}/` + action);
        }
        catch {
          os.ui.showError("Failed to update status. Please try again.");
          win.input("is-active").checked = !enable;
          return;
        }
      }
      this.toggleActive = toggleActive;

      function cancel() {
        win.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      function configure(_businessId) {
        businessId = _businessId;
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        // Show/hide delete button based on whether editing or creating
        if (isEmpty(businessId)) {
          win.button("delete-btn").style.display = "none";
          return;
        }
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/business/${businessId}`);
        }
        catch {
          os.ui.showError("Failed to load business. Please try again.");
          return;
        }
        win.input("biz-name").value = response.name;
        win.input("owner-name").value = response.ownerName || "";
        win.input("biz-phone").value = response.phone || "";
        win.input("address-line1").value = response.addressLine1 || "";
        win.input("city").value = response.city || "";
        win.input("state").value = response.state || "";
        win.input("zip").value = response.zip || "";
        win.select("timezone").ui.selectValue(response.timezone || "UTC");
        win.input("is-active").checked = response.isActive;
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        win.input("biz-name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      // Enter is the window's to wire: a document gives it to the default
      // control, so `didHitEnter` is not declared here.
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Business</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 420px;">

    <fieldset>
      <legend>General</legend>
      <div class="vbox gap-10">
        <div class="text-field">
          <label for="biz-name">Business Name</label>
          <input type="text" name="biz-name" autocomplete="new-password">
        </div>
        <div class="text-field">
          <label for="owner-name">Owner Name</label>
          <input type="text" name="owner-name">
        </div>
        <div class="text-field">
          <label for="biz-phone">Phone</label>
          <input type="text" name="biz-phone">
        </div>
        <div class="text-field">
          <label for="address-line1">Address</label>
          <input type="text" name="address-line1">
        </div>
        <div class="hbox gap-10">
          <div class="text-field" style="flex: 2;">
            <label for="city">City</label>
            <input type="text" name="city">
          </div>
          <div class="text-field" style="flex: 1;">
            <label for="state">State</label>
            <input type="text" name="state">
          </div>
          <div class="text-field" style="flex: 1;">
            <label for="zip">Zip</label>
            <input type="text" name="zip">
          </div>
        </div>
        <div class="ui-popup-menu stacked" style="--popup-width: 220px;">
          <label for="timezone">Timezone</label>
          <select name="timezone">
            <option>Choose a timezone</option>
            <option value="America/New_York">Eastern (ET)</option>
            <option value="America/Chicago">Central (CT)</option>
            <option value="America/Denver">Mountain (MT)</option>
            <option value="America/Los_Angeles">Pacific (PT)</option>
            <option value="UTC">UTC</option>
          </select>
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="is-active" checked>
          <label for="is-active">Active</label>
        </div>
      </div>
    </fieldset>

    <!-- No onclick: a document's controls are wired by the window, which asks
         before discarding or deleting and disables them all while one runs. -->
    <div class="controls">
      <button class="primary" doc-action="cancel">Cancel</button>
      <button name="delete-btn" class="primary" doc-action="delete">Delete</button>
      <button class="default" doc-action="save">Save</button>
    </div>

  </div>
</div>
