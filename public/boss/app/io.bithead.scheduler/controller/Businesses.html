<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // BusinessDelegate
      let businessDelegate = {
        didSaveBusiness: loadBusinesses,
        didDeleteBusiness: loadBusinesses
      };

      // --- Controller functions ---


      /**
       * Opens the kiosk customers use to schedule with the selected business.
       *
       * Covers the screen until the close button is tapped. Whether that
       * button is shown is the server's call — see `GET /operator/me`.
       */
      async function enterSite() {
        const value = view.ui.select("businesses").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("SchedulerKiosk");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
        });
      }
      this.enterSite = enterSite;

      async function editBusiness() {
        const value = view.ui.select("businesses").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        // The operator's own settings window: an admin helping with a business
        // reaches everything its operator does rather than a second form
        // carrying a subset of the same fields.
        const win = await $(app.controller).loadController("BusinessConfig");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
          ctrl.delegate = businessDelegate;
        });
      }
      this.editBusiness = editBusiness;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("businesses").ui.setDefaultAction(editBusiness);
        view.ui.select("businesses").ui.delegate = {
          didSelectListBoxOption: function() {
            setButtonsEnabled(true);
          },
          didRemoveAllOptions: function() {
            setButtonsEnabled(false);
          }
        };
        await loadBusinesses();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadBusinesses() {
        const status = view.ui.select("filter-status").value;
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/businesses${status ? `?status=${status}` : ""}`);
        }
        catch {
          os.ui.showError("Failed to load businesses. Please try again.");
          return;
        }
        const listBox = view.ui.select("businesses").ui;
        listBox.addNewOptions(response.businesses.map(function(b) {
          return { id: String(b.id), name: b.name + (b.isActive ? "" : " (disabled)") };
        }));
        // The first item is auto-selected on load; enable the buttons that act
        // on a selection if the list is non-empty.
        setButtonsEnabled(response.businesses.length > 0);
      }

      /**
       * Enables or disables both buttons that act on the selected business.
       *
       * @param {boolean} enabled
       */
      function setButtonsEnabled(enabled) {
        view.ui.button("enter-site-btn").disabled = !enabled;
        view.ui.button("edit-btn").disabled = !enabled;
      }

      function onFilterChange() {
        loadBusinesses();
      }
      this.onFilterChange = onFilterChange;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 160px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).enterSite();">Enter Site</option>
        <option onclick="$(this.controller).editBusiness();">Edit</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Businesses</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 480px;">

    <div class="hbox gap-8" style="align-items: center;">
      <div class="ui-popup-menu intrinsic">
        <label class="">Filter</label>
        <select name="filter-status" onchange="$(this.controller).onFilterChange();">
          <option value="">All</option>
          <option value="active">Active</option>
          <option value="disabled">Disabled</option>
        </select>
      </div>
    </div>

    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 220px;">
        <select name="businesses"></select>
      </div>
      <div class="controls-right separated">
        <div class="vbox gap-10">
        </div>
        <div class="vbox gap-10">
          <button name="enter-site-btn" class="primary" disabled onclick="$(this.controller).enterSite();">Enter Site</button>
          <button name="edit-btn" class="default" disabled onclick="$(this.controller).editBusiness();">Edit</button>
        </div>
      </div>
    </div>

  </div>
</div>
