<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // This employee's own record. The child modals act on it through the
      // same routes an operator uses; who may call them is the service's
      // question, not this screen's.
      let employeeId = null;

      const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

      // EmployeeScheduleDelegate
      let scheduleDelegate = {
        didSaveEmployeeSchedule: reload,
        didDeleteEmployeeSchedule: reload
      };

      // EmployeeTimeOffDelegate
      let timeOffDelegate = {
        didSaveEmployeeTimeOff: reload,
        didDeleteEmployeeTimeOff: reload
      };

      // --- Private helpers ---

      async function reload() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/employee/profile");
        }
        catch {
          os.ui.showError("Failed to load your profile. Please try again later.");
          return;
        }
        employeeId = response.employeeId;
        view.ui.span("employee-name").innerText = response.firstName + " " + response.lastName;

        renderSchedule(response.scheduleTemplate);
        renderTimeOff(response.timeOff);
        await loadJobTypes(response.jobTypes);
      }

      function renderSchedule(days) {
        view.ui.select("schedule").ui.addNewOptions(
          days.map(function(d) {
            return {
              id: String(d.id),
              name: `${DAY_NAMES[d.dayOfWeek]} — ${d.startTime} to ${d.endTime}`
            };
          })
        );
        view.ui.button("edit-schedule-btn").disabled = days.length === 0;
      }

      function renderTimeOff(windows) {
        view.ui.select("time-off").ui.addNewOptions(
          windows.map(function(w) {
            return { id: String(w.id), name: `${w.date} — ${w.startTime} to ${w.endTime}` };
          })
        );
        view.ui.button("edit-time-off-btn").disabled = windows.length === 0;
      }

      /**
       * Every job type the business offers, with the ones this employee can
       * perform selected.
       *
       * @param {array} performs - Job types the employee performs
       */
      async function loadJobTypes(performs) {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/job-types");
        }
        catch {
          os.ui.showError("Failed to load the job types. Please try again later.");
          return;
        }
        const selected = new Set(performs.map(function(jt) { return jt.id; }));
        view.ui.select("job-types").ui.addNewOptions(
          response.jobTypes.map(function(jt) {
            return { id: String(jt.id), name: jt.name, selected: selected.has(jt.id) };
          })
        );
      }

      // --- Controller functions ---

      async function addScheduleDay() {
        const win = await $(app.controller).loadController("EmployeeSchedule");
        win.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, scheduleId: null });
          ctrl.delegate = scheduleDelegate;
        });
      }
      this.addScheduleDay = addScheduleDay;

      async function editScheduleDay() {
        const value = view.ui.select("schedule").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("EmployeeSchedule");
        win.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, scheduleId: parseInt(value) });
          ctrl.delegate = scheduleDelegate;
        });
      }
      this.editScheduleDay = editScheduleDay;

      async function addTimeOff() {
        const win = await $(app.controller).loadController("EmployeeTimeOff");
        win.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, windowId: null });
          ctrl.delegate = timeOffDelegate;
        });
      }
      this.addTimeOff = addTimeOff;

      async function editTimeOff() {
        const value = view.ui.select("time-off").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("EmployeeTimeOff");
        win.ui.show(function(ctrl) {
          ctrl.configure({ employeeId: employeeId, windowId: parseInt(value) });
          ctrl.delegate = timeOffDelegate;
        });
      }
      this.editTimeOff = editTimeOff;

      /**
       * The working days and time off save themselves as they are edited, so
       * this saves the one thing left: what this employee can do.
       */
      async function save() {
        const jobTypeIds = view.ui.select("job-types").ui.selectedValues().map(function(v) {
          return parseInt(v);
        });
        try {
          await os.network.put("/api/io.bithead.scheduler/employee/profile", { jobTypeIds });
        }
        catch {
          os.ui.showError("Failed to save your profile. Please try again later.");
          return;
        }
        view.ui.showMessage("Saved");
      }
      this.save = save;

      function close() {
        view.ui.close();
      }
      this.close = close;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("schedule").ui.setDefaultAction(editScheduleDay);
        view.ui.select("time-off").ui.setDefaultAction(editTimeOff);
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      // --- OS listeners ---

      this.didHitEnter = save;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).save();">Save</option>
        <option onclick="$(this.controller).close();">Close</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>My Profile</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 480px;">

    <div class="read-only intrinsic">
      <label>Employee</label>
      <span name="employee-name"></span>
    </div>

    <fieldset>
      <legend>Weekly Schedule</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 140px;">
          <select name="schedule"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addScheduleDay();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-schedule-btn" class="primary" disabled onclick="$(this.controller).editScheduleDay();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Time Off</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 120px;">
          <select name="time-off"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addTimeOff();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-time-off-btn" class="primary" disabled onclick="$(this.controller).editTimeOff();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Job Types</legend>
      <p>The jobs you can be assigned to.</p>
      <div class="ui-list-box" style="width: 100%; height: 120px;">
        <select name="job-types" multiple></select>
      </div>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).close();">Close</button>
      <button class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
