<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // The business this window acts on, held by the app from `/me`.
      const businessId = $(app.controller).getBusinessId();

      let currentStep = "account"; // account | business | template | done

      const STEPS = ["account", "business", "template"];

      // --- Private helpers ---

      function showStep(name) {
        for (const s of STEPS) {
          const el = view.ui.div(`step-${s}`);
          if (el) {
            el.style.display = s === name ? "" : "none";
          }
        }
        currentStep = name;
      }

      // --- Controller functions ---

      function goToSignIn() {
        // Delegate to BOSS sign-in flow
        os.showSignIn(function() {
          // After sign-in, proceed to business info step
          showStep("business");
        });
      }
      this.goToSignIn = goToSignIn;

      function proceedToBusiness() {
        showStep("business");
      }
      this.proceedToBusiness = proceedToBusiness;

      async function submitBusiness() {
        const name = view.ui.inputValue("biz-name", "Please provide your business name.");
        if (isEmpty(name)) {
          return;
        }
        const phone = view.ui.input("biz-phone").value;
        if (isEmpty(phone)) {
          os.ui.showError("Please provide a phone number.");
          return;
        }
        // Store temporarily, will submit with template choice
        view._pendingBusiness = {
          name,
          phone,
          addressLine1: view.ui.input("address-line1").value,
          city: view.ui.input("city").value,
          state: view.ui.input("state").value,
          zip: view.ui.input("zip").value,
          ownerName: view.ui.input("owner-name").value,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
        await loadTemplates();
        showStep("template");
      }
      this.submitBusiness = submitBusiness;

      async function submitWithTemplate(templateId) {
        const payload = Object.assign({}, view._pendingBusiness, { templateId });
        let response;
        try {
          response = await os.network.post("/api/io.bithead.scheduler/signup", payload);
        }
        catch {
          os.ui.showError("Failed to create account. Please try again.");
          return;
        }
        // Open operator dashboard
        view.ui.close();
        const win = await $(app.controller).loadController("OperatorDashboard");
        win.ui.show();
      }
      this.submitWithTemplate = submitWithTemplate;

      async function loadTemplates() {
        let response;
        try {
          // Not the business-scoped route: there is no business yet, which is
          // the whole point of this screen.
          response = await os.network.get("/api/io.bithead.scheduler/templates");
        }
        catch {
          os.ui.showError("Failed to load business types. Please try again.");
          return;
        }
        const grid = view.ui.div("template-grid");
        grid.innerHTML = "";
        for (const t of response.templates) {
          const card = document.createElement("div");
          card.className = "template-card";
          card.innerHTML =
            `<span class='template-name'>${t.name}</span><span class='template-desc'>${t.description}</span>`;
          card.title = t.description;
          card.onclick = (function(tid) { return function() { submitWithTemplate(tid); }; })(t.id);
          grid.appendChild(card);
        }
      }

      // --- Lifecycle ---

      async function viewDidLoad() {
        const user = os.user;
        if (!isEmpty(user)) {
          showStep("business");
        }
        else {
          showStep("account");
        }
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Set Up Your Business</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 480px;">

    <!-- Step: Account -->
    <div name="step-account" style="display: none; text-align: center;">
      <h2>Welcome to Scheduler</h2>
      <p>Create or sign in to your BOSS account to get started.</p>
      <div class="controls" style="justify-content: center;">
        <button class="default" onclick="$(this.controller).goToSignIn();">Sign In / Create Account</button>
      </div>
      <p style="margin-top: 16px; font-size: 0.85em;">Already have a business account? <a href="#" onclick="$(this.controller).goToSignIn();">Sign in to access it.</a></p>
    </div>

    <!-- Step: Business info -->
    <div name="step-business" style="display: none;">
      <h2>Tell us about your business</h2>
      <div class="text-field">
        <label for="biz-name">Business Name *</label>
        <input type="text" name="biz-name" autocomplete="new-password">
      </div>
      <div class="text-field">
        <label for="biz-phone">Phone *</label>
        <input type="text" name="biz-phone">
      </div>
      <div class="text-field">
        <label for="owner-name">Your Name</label>
        <input type="text" name="owner-name">
      </div>
      <div class="text-field">
        <label for="address-line1">Address</label>
        <input type="text" name="address-line1">
      </div>
      <div class="hbox gap-10">
        <div class="text-field" style="flex: 2;">
          <label for="city">City</label>
          <input type="text" name="city">
        </div>
        <div class="text-field" style="flex: 1;">
          <label for="state">State</label>
          <input type="text" name="state">
        </div>
        <div class="text-field" style="flex: 1;">
          <label for="zip">Zip</label>
          <input type="text" name="zip">
        </div>
      </div>
      <div class="controls">
        <button class="default" onclick="$(this.controller).submitBusiness();">Next →</button>
      </div>
    </div>

    <!-- Step: Template selection -->
    <div name="step-template" style="display: none;">
      <h2>What kind of business are you?</h2>
      <p>Choose a template to pre-configure your settings. You can change this later.</p>
      <div name="template-grid" class="vbox gap-10"></div>
    </div>

  </div>
</div>
