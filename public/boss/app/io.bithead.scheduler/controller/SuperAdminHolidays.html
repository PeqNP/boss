<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // --- Controller functions ---

      async function loadYear() {
        const year = parseInt(view.ui.select("year").ui.selectedValue());
        if (!isNumeric(year)) {
          return;
        }
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/superadmin/holidays?year=${year}`);
        }
        catch {
          os.ui.showError("Failed to load holidays. Please try again.");
          return;
        }
        const container = view.ui.div("holidays-container");
        container.innerHTML = "";
        for (const country of response.countries) {
          const section = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = `${country.countryName} (${country.countryCode})`;
          section.appendChild(legend);
          const table = document.createElement("table");
          table.style.width = "100%";
          table.innerHTML = "<thead><tr><th>Holiday</th><th>Date</th></tr></thead>";
          const tbody = document.createElement("tbody");
          for (const h of country.holidays) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${h.name}</td><td>${h.date}</td>`;
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
          section.appendChild(table);
          container.appendChild(section);
        }
      }
      this.loadYear = loadYear;

      async function refreshFromApi() {
        const year = parseInt(view.ui.select("year").ui.selectedValue());
        if (!isNumeric(year)) {
          return;
        }
        try {
          const resp = await os.network.post(`/api/io.bithead.scheduler/superadmin/holidays/refresh?year=${year}`);
          os.ui.showAlert(`${resp.count} holidays loaded for ${year}.`);
        }
        catch {
          os.ui.showError("Failed to refresh holidays. Please try again.");
          return;
        }
        await loadYear();
      }
      this.refreshFromApi = refreshFromApi;

      // --- Lifecycle ---

      async function viewDidLoad() {
        // Load available years from the server; fall back to current + next year.
        let years;
        try {
          const resp = await os.network.get("/api/io.bithead.scheduler/superadmin/holidays/years");
          years = resp.years;
        }
        catch {
          const currentYear = new Date().getFullYear();
          years = [currentYear, currentYear + 1];
        }
        if (isEmpty(years) || years.length === 0) {
          const currentYear = new Date().getFullYear();
          years = [currentYear, currentYear + 1];
        }
        view.ui.select("year").ui.addNewOptions(
          years.map(function(y) { return { id: String(y), name: String(y) }; })
        );
        await loadYear();
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Holidays</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 560px;">
    <div class="hbox gap-10" style="align-items: center;">
      <div class="ui-popup-menu intrinsic" style="--popup-width: 100px;">
        <label for="year">Year</label>
        <select name="year" onchange="$(this.controller).loadYear();">
          <option>Select a year</option>
        </select>
      </div>
      <button class="primary" onclick="$(this.controller).refreshFromApi();">Refresh from API</button>
    </div>
    <div name="holidays-container" class="vbox gap-10"></div>
  </div>
</div>
