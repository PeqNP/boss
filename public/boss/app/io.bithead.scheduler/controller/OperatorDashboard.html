<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // The business this operator runs, as the dashboard reports it. The
      // kiosk is opened against it.
      let businessId = null;

      // --- Controller functions ---

      /**
       * Open the kiosk customers use to schedule with this business.
       *
       * The kiosk covers the screen until its close button is tapped, and that
       * button is shown only to someone entitled to leave — which is the point
       * of it: a tablet left on a counter is a kiosk, not a desktop.
       */
      async function enterSite() {
        if (isEmpty(businessId)) {
          os.ui.showAlert("This account is not attached to a business yet.");
          return;
        }
        const win = await $(app.controller).loadController("SchedulerKiosk");
        win.ui.show(function(ctrl) {
          ctrl.configure(businessId);
        });
      }
      this.enterSite = enterSite;

      async function viewSchedule() {
        const win = await $(app.controller).loadController("ScheduleCalendar");
        win.ui.show();
      }
      this.viewSchedule = viewSchedule;

      async function searchJobs() {
        const win = await $(app.controller).loadController("SearchJob");
        win.ui.show();
      }
      this.searchJobs = searchJobs;

      async function assignEmployees() {
        const win = await $(app.controller).loadController("AssignEmployees");
        win.ui.show(function(ctrl) {
          ctrl.delegate = { didAssignEmployees: function() { viewDidLoad(); } };
        });
      }
      this.assignEmployees = assignEmployees;

      /**
       * What is still stopping customers from booking.
       *
       * The sentences and the window each one leads to are the server's — it
       * is the thing that knows which job type is missing what. This lists
       * them and opens what they name.
       */
      async function loadSetup() {
        let setup;
        try {
          setup = await os.network.get("/api/io.bithead.scheduler/admin/setup");
        }
        catch {
          // Not worth a modal on a dashboard: the panel stays hidden and
          // everything else on the screen still loads.
          return;
        }
        const container = view.ui.div("setup-tasks");
        container.innerHTML = "";
        for (const task of setup.tasks) {
          const row = document.createElement("div");
          row.className = "hbox gap-10";

          const text = document.createElement("span");
          text.style.flex = "1";
          text.innerText = task.text;
          row.appendChild(text);

          const button = document.createElement("button");
          button.className = "primary";
          button.innerText = "Fix";
          button.onclick = function() { openTask(task.controller); };
          row.appendChild(button);

          container.appendChild(row);
        }
        view.ui.fieldset("setup-row").style.display =
          setup.tasks.length > 0 ? "" : "none";
      }

      async function openTask(controller) {
        const win = await $(app.controller).loadController(controller);
        win.ui.show();
      }

      // --- Lifecycle ---

      async function viewDidLoad() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/dashboard");
        }
        catch {
          os.ui.showError("Failed to load dashboard. Please try again.");
          return;
        }
        businessId = response.businessId;
        await loadSetup();
        view.ui.span("jobs-today").textContent = response.jobsToday;
        view.ui.span("jobs-week").textContent = response.jobsThisWeek;
        view.ui.span("revenue-month").textContent = "$" + response.revenueThisMonth.toFixed(2);
        view.ui.span("upcoming-jobs").textContent = response.upcomingJobs;
        const conflictsEl = view.ui.span("unassigned-conflicts");
        conflictsEl.textContent = response.unassignedConflicts;
        const unassignedEl = view.ui.span("unassigned-jobs");
        unassignedEl.textContent = response.unassignedJobs;
        // An unlimited business allocates nobody to a time, so there is no
        // such thing as an unassigned job and this panel would cry wolf
        // permanently.
        const assigns = response.slotMode !== "unlimited";
        const needsAttention = assigns
          && (response.unassignedConflicts > 0 || response.unassignedJobs > 0);
        if (needsAttention) {
          view.ui.fieldset("conflicts-row").style.display = "";
        }
        else {
          view.ui.fieldset("conflicts-row").style.display = "none";
        }
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Dashboard</span></div>
  </div>

  <div class="container vbox gap-20" style="width: 480px;">

    <fieldset>
      <legend>Today</legend>
      <table>
        <tr>
          <td>Jobs scheduled today</td>
          <td style="text-align: right;"><span name="jobs-today">—</span></td>
        </tr>
        <tr>
          <td>Jobs scheduled this week</td>
          <td style="text-align: right;"><span name="jobs-week">—</span></td>
        </tr>
        <tr>
          <td>Revenue this month</td>
          <td style="text-align: right;"><span name="revenue-month">—</span></td>
        </tr>
        <tr>
          <td>Upcoming jobs</td>
          <td style="text-align: right;"><span name="upcoming-jobs">—</span></td>
        </tr>
      </table>
    </fieldset>

    <fieldset name="setup-row" style="display: none;">
      <legend>⚠ Before Customers Can Book</legend>
      <div name="setup-tasks" class="vbox gap-10"></div>
    </fieldset>

    <fieldset name="conflicts-row">
      <legend>⚠ Needs Attention</legend>
      <table style="width: 100%;">
        <tr>
          <td>Unassigned jobs</td>
          <td style="text-align: right;"><span name="unassigned-jobs">—</span></td>
        </tr>
        <tr>
          <td>Unassigned recurring jobs</td>
          <td style="text-align: right;"><span name="unassigned-conflicts">—</span></td>
        </tr>
      </table>
      <div class="controls" style="margin-top: 8px;">
        <button class="default" onclick="$(this.controller).assignEmployees();">Assign Employees</button>
      </div>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).enterSite();">Enter Site</button>
      <button class="primary" onclick="$(this.controller).searchJobs();">Search Jobs</button>
      <button class="default" onclick="$(this.controller).viewSchedule();">View Schedule</button>
    </div>

  </div>
</div>
