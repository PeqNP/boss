<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // EmployeeDelegate
      let employeeDelegate = {
        didSaveEmployee: loadEmployees,
        didDeleteEmployee: loadEmployees
      };

      // --- Controller functions ---

      async function addEmployee() {
        const win = await $(app.controller).loadController("Employee");
        win.ui.show(function(ctrl) {
          ctrl.delegate = employeeDelegate;
        });
      }
      this.addEmployee = addEmployee;

      async function editEmployee() {
        const value = view.ui.select("employees").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("Employee");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
          ctrl.delegate = employeeDelegate;
        });
      }
      this.editEmployee = editEmployee;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("employees").ui.delegate = {
          didSelectListBoxOption: function() {
            view.ui.button("edit-btn").disabled = false;
          },
          didRemoveAllOptions: function() {
            view.ui.button("edit-btn").disabled = true;
          }
        };
        await loadEmployees();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadEmployees() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/employees");
        }
        catch {
          os.ui.showError("Failed to load employees. Please try again.");
          return;
        }
        view.ui.select("employees").ui.addNewOptions(
          response.employees.map(function(e) {
            return { id: String(e.id), name: e.firstName + " " + e.lastName + (e.includeInSchedule ? "" : " (excluded)") };
          })
        );
        view.ui.button("edit-btn").disabled = response.employees.length === 0;
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).addEmployee();">Add Employee</option>
        <option onclick="$(this.controller).editEmployee();">Edit Employee</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Employees</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 320px;">
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 220px;">
        <select name="employees"></select>
      </div>
      <div class="controls-right separated">
        <div class="vbox gap-10">
          <button class="primary" onclick="$(this.controller).addEmployee();">Add</button>
        </div>
        <div class="vbox gap-10">
          <button name="edit-btn" class="default" disabled onclick="$(this.controller).editEmployee();">Edit</button>
        </div>
      </div>
    </div>
  </div>
</div>
