<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // --- Controller functions ---

      async function loadYear() {
        const year = parseInt(view.ui.select("year").ui.selectedValue());
        if (!isNumeric(year)) {
          return;
        }
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/system-holidays?year=${year}`);
        }
        catch {
          os.ui.showError("Failed to load holidays. Please try again.");
          return;
        }
        const container = view.ui.div("holidays-container");
        container.innerHTML = "";
        for (const country of response.countries) {
          const section = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = `${country.countryName} (${country.countryCode})`;
          section.appendChild(legend);
          const table = document.createElement("table");
          table.style.width = "100%";
          table.innerHTML = "<thead><tr><th>Holiday</th><th>Date</th></tr></thead>";
          const tbody = document.createElement("tbody");
          for (const h of country.holidays) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${h.name}</td><td>${h.date}</td>`;
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
          section.appendChild(table);
          container.appendChild(section);
        }
      }
      this.loadYear = loadYear;

      async function loadHolidays() {
        const year = parseInt(view.ui.select("year").ui.selectedValue());
        if (!isNumeric(year)) {
          return;
        }
        try {
          const resp = await os.network.post(`/api/io.bithead.scheduler/system-holidays/refresh?year=${year}`);
          os.ui.showAlert(`${resp.count} holidays loaded for ${year}.`);
        }
        catch {
          os.ui.showError("Failed to load holidays. Please try again.");
          return;
        }
        await loadYear();
      }
      this.loadHolidays = os.ui.mutex(
        loadHolidays,
        view.ui.button("load-holidays"),
        "Fetching holidays..."
      );

      // --- Lifecycle ---

      async function viewDidLoad() {
        const progressBar = await os.ui.showProgressBar(
          "Fetching holidays...",
          null,
          true
        );
        try {
          // First open fills this year and next if they are empty.
          let years;
          try {
            const resp = await os.network.get("/api/io.bithead.scheduler/system-holidays/years");
            years = resp.years;
          }
          catch {
            const currentYear = new Date().getFullYear();
            years = [currentYear, currentYear + 1];
          }
          if (isEmpty(years) || years.length === 0) {
            const currentYear = new Date().getFullYear();
            years = [currentYear, currentYear + 1];
          }
          view.ui.select("year").ui.addNewOptions(
            years.map(function(y) { return { id: String(y), name: String(y) }; })
          );
          const currentYear = new Date().getFullYear();
          const selected = years.indexOf(currentYear) >= 0 ? currentYear : years[0];
          view.ui.select("year").ui.selectValue(String(selected));
          await loadYear();
        }
        finally {
          progressBar?.ui.close();
        }
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Holidays</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 560px;">
    <div class="hbox gap-10" style="align-items: center;">
      <div class="ui-popup-menu intrinsic" style="--popup-width: 100px;">
        <label for="year">Year</label>
        <select name="year" onchange="$(this.controller).loadYear();">
          <option>Select a year</option>
        </select>
      </div>
      <button name="load-holidays" class="primary" onclick="$(this.controller).loadHolidays();">Load holidays</button>
    </div>
    <div name="holidays-container" class="vbox gap-10"></div>
  </div>
</div>
