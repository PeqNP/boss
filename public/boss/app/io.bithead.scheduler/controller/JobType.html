<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      // `null` until `create` makes one. A job type exists from the moment
      // this form opens, so sizes, attributes, and contact fields have
      // something to belong to before anything is saved.
      let jobTypeId = null;

      // This form created the job type, and nothing has been saved over it
      // yet. Cancelling or closing discards it; one reopened later does not.
      let isNew = false;

      // What a job type is called before anyone names it.
      const DRAFT_NAME = "Untitled";

      // Chosen in the icon picker, sent with the job type.
      let iconId = null;

      // Chosen from the connected Stripe account, sent with the job type.
      let stripeProductId = null;

      // Contact fields as last loaded. Order here is the order the customer is
      // asked for them, and is what a reorder is computed against.
      let contactFields = [];

      // A document: the window owns Cancel, Delete and Save, asks before
      // discarding or deleting, and says "Saved".
      //
      // The discard question speaks of the job type rather than of changes,
      // because leaving an unsaved draft does not merely lose edits — it
      // throws away the job type this window created to hang sizes on.
      this.document = new UIDocument(
        "Delete this job type? Jobs already scheduled against it are kept.",
        "Discard this job type?"
      );

      // JobTypeDelegate
      let delegate = protocol(
        "JobTypeDelegate", this, "delegate",
        [
          /**
           * @param {object} jobType - The saved job type.
           */
          "didSaveJobType",
          /**
           * @param {number} jobTypeId - The deleted job type's ID.
           */
          "didDeleteJobType"
        ]
      );

      // JobTypeSizeDelegate
      let sizeDelegate = {
        didSaveJobTypeSize: reload,
        didDeleteJobTypeSize: reload
      };

      // JobTypeAttributeDelegate
      let attributeDelegate = {
        didSaveJobTypeAttribute: reload,
        didDeleteJobTypeAttribute: reload
      };

      // JobTypeContactFieldDelegate
      let contactFieldDelegate = {
        didSaveJobTypeContactField: reload,
        didDeleteJobTypeContactField: reload
      };

      // --- Private helpers ---

      /**
       * Load the job type and redraw everything it owns.
       */
      async function reload() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/admin/job-type/${jobTypeId}`);
        }
        catch {
          os.ui.showError("Failed to load the job type. Please try again later.");
          return;
        }
        win.input("name").value = response.name;
        win.input("min-employees").value = response.minEmployees;
        win.input("payment-required").checked = response.paymentRequired;
        win.input("deposit-required").checked = response.depositRequired;
        win.input("is-active").checked = response.isActive;
        iconId = response.iconId;
        stripeProductId = response.stripeProductId;
        win.span("selected-stripe-product").innerText =
          isEmpty(response.stripeProductId) ? "None chosen" : response.stripeProductId;

        contactFields = response.contactFields;
        renderSizes(response.sizes);
        renderAttributes(response.attributes);
        renderContactFields(contactFields);
      }

      function renderSizes(sizes) {
        win.select("sizes").ui.addNewOptions(
          sizes.map(function(s) {
            return {
              id: String(s.id),
              name: `${s.name} — ${s.durationMinutes} min, $${s.cost.toFixed(2)}`
            };
          })
        );
        win.button("edit-size-btn").disabled = sizes.length === 0;
      }

      function renderAttributes(attributes) {
        win.select("attributes").ui.addNewOptions(
          attributes.map(function(a) {
            return {
              id: String(a.id),
              name: `${a.name} (${a.attributeType})` + (a.isRequired ? " — required" : "")
            };
          })
        );
        win.button("edit-attribute-btn").disabled = attributes.length === 0;
      }

      function renderContactFields(fields) {
        win.select("contact-fields").ui.addNewOptions(
          fields.map(function(f) {
            let suffix = f.isRequired ? " — required" : " — optional";
            if (f.requireOtp) {
              suffix += ", verified";
            }
            return { id: String(f.id), name: f.name + suffix };
          })
        );
        win.button("edit-contact-field-btn").disabled = fields.length === 0;
      }

      // --- Controller functions ---

      async function addSize() {
        const child = await $(app.controller).loadController("JobTypeSize");
        child.ui.show(function(ctrl) {
          ctrl.configure({ jobTypeId: jobTypeId, sizeId: null });
          ctrl.delegate = sizeDelegate;
        });
      }
      this.addSize = addSize;

      async function editSize() {
        const value = win.select("sizes").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const child = await $(app.controller).loadController("JobTypeSize");
        child.ui.show(function(ctrl) {
          ctrl.configure({ jobTypeId: jobTypeId, sizeId: parseInt(value) });
          ctrl.delegate = sizeDelegate;
        });
      }
      this.editSize = editSize;

      async function addAttribute() {
        const child = await $(app.controller).loadController("JobTypeAttribute");
        child.ui.show(function(ctrl) {
          ctrl.configure({ jobTypeId: jobTypeId, attributeId: null });
          ctrl.delegate = attributeDelegate;
        });
      }
      this.addAttribute = addAttribute;

      async function editAttribute() {
        const value = win.select("attributes").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const child = await $(app.controller).loadController("JobTypeAttribute");
        child.ui.show(function(ctrl) {
          ctrl.configure({ jobTypeId: jobTypeId, attributeId: parseInt(value) });
          ctrl.delegate = attributeDelegate;
        });
      }
      this.editAttribute = editAttribute;

      async function addContactField() {
        const child = await $(app.controller).loadController("JobTypeContactField");
        child.ui.show(function(ctrl) {
          ctrl.configure({ jobTypeId: jobTypeId, contactFieldId: null });
          ctrl.delegate = contactFieldDelegate;
        });
      }
      this.addContactField = addContactField;

      async function editContactField() {
        const value = win.select("contact-fields").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const child = await $(app.controller).loadController("JobTypeContactField");
        child.ui.show(function(ctrl) {
          ctrl.configure({ jobTypeId: jobTypeId, contactFieldId: parseInt(value) });
          ctrl.delegate = contactFieldDelegate;
        });
      }
      this.editContactField = editContactField;

      /**
       * The customer is asked for contact information in this order.
       */
      async function moveContactFieldUp() {
        await moveContactField(-1);
      }
      this.moveContactFieldUp = moveContactFieldUp;

      async function moveContactFieldDown() {
        await moveContactField(1);
      }
      this.moveContactFieldDown = moveContactFieldDown;

      async function moveContactField(offset) {
        const index = win.select("contact-fields").ui.selectedIndex();
        if (isEmpty(index) || index < 0) {
          return;
        }
        const target = index + offset;
        if (target < 0 || target >= contactFields.length) {
          return;
        }
        const ids = contactFields.map(function(f) { return f.id; });
        ids.splice(target, 0, ids.splice(index, 1)[0]);
        try {
          await os.network.post(
            `/api/io.bithead.scheduler/admin/job-type/${jobTypeId}/contact-fields/reorder`,
            { ids }
          );
        }
        catch {
          os.ui.showError("Failed to reorder the contact fields. Please try again later.");
          return;
        }
        // The server owns the order once it has accepted it, so the list is
        // redrawn from what it hands back rather than from the local swap.
        await reload();
        win.select("contact-fields").ui.selectOption(target);
      }

      async function pickIcon() {
        const child = await $(app.controller).loadController("IconPicker");
        child.ui.show(function(ctrl) {
          ctrl.delegate = {
            didSelectIcon: function(icon) {
              iconId = icon.id;
              win.span("selected-icon-name").innerText = icon.filename;
            }
          };
        });
      }
      this.pickIcon = pickIcon;

      async function loadStripeProducts() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/stripe/products");
        }
        catch {
          os.ui.showError("Failed to load the Stripe products. Please try again later.");
          return;
        }
        win.select("stripe-product").ui.addNewOptions(
          response.products.map(function(p) {
            return {
              id: p.id,
              name: `${p.name} ($${(p.defaultPrice.unitAmount / 100).toFixed(2)})`
            };
          })
        );
      }
      this.loadStripeProducts = loadStripeProducts;

      function didChangeStripeProduct() {
        stripeProductId = win.select("stripe-product").ui.selectedValue();
        win.span("selected-stripe-product").innerText =
          isEmpty(stripeProductId) ? "None chosen" : stripeProductId;
      }
      this.didChangeStripeProduct = didChangeStripeProduct;

      /**
       * Check the form, write it, and tell whoever opened this window.
       *
       * @returns {boolean} `true` when something was written
       */
      async function save() {
        // `inputValue` with a message tells the user and throws, which stops
        // the save here. The window catches it, so no "Saved" is shown.
        const name = win.inputValue("name", "Please provide a name.");
        const minEmployees = parseInt(win.input("min-employees").value);
        if (!isNumeric(minEmployees) || minEmployees < 1) {
          os.ui.showAlert("Please provide how many employees this job needs.");
          return false;
        }
        const payload = {
          name,
          iconId,
          minEmployees,
          stripeProductId,
          paymentRequired: win.input("payment-required").checked,
          depositRequired: win.input("deposit-required").checked,
          isActive: win.input("is-active").checked
        };
        let response;
        try {
          response = await os.network.put(
            `/api/io.bithead.scheduler/admin/job-type/${jobTypeId}`, payload
          );
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return false;
        }
        // Saved, so it is no longer this form's to discard.
        isNew = false;
        delegate.didSaveJobType(response);
        return true;
      }
      this.save = save;

      /**
       * Delete it. The window has already asked.
       */
      async function _delete() {
        try {
          await os.network.delete(`/api/io.bithead.scheduler/admin/job-type/${jobTypeId}`);
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return;
        }
        // The list never learned about a draft, so it has nothing to update.
        if (!isNew) {
          delegate.didDeleteJobType(jobTypeId);
        }
        win.close();
      }
      this.delete = _delete;

      /**
       * Leave — and take the draft with us.
       *
       * A job type this window created exists on the server from the moment it
       * opened, so walking away has to remove it. The window has already asked;
       * this only carries it out.
       */
      async function cancel() {
        if (isNew) {
          await _delete();
          return;
        }
        win.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      /**
       * @param {number|null} _jobTypeId - Job type to edit, or `null` to create
       */
      function configure(_jobTypeId) {
        jobTypeId = _jobTypeId;
      }
      this.configure = configure;

      // --- Lifecycle ---

      /**
       * Create the job type up front, so its sizes, attributes, and contact
       * fields have something to belong to. Until this form saves over it, the
       * draft is this window's, and leaving discards it.
       */
      async function create() {
        let response;
        try {
          response = await os.network.post("/api/io.bithead.scheduler/admin/job-type",
                                           { name: DRAFT_NAME });
        }
        catch {
          // Deliberately not awaited. `viewDidLoad` cannot close its own
          // window — the lifecycle has to finish first — so the close is hung
          // off the alert and runs once the user has read it.
          os.ui.showAlert("Failed to create the job type. Please try again later.")
               .then(function() { win.close(); });
          return;
        }
        jobTypeId = response.id;
        isNew = true;
        await reload();
      }

      async function viewDidLoad() {
        // Wired before the branch below, because a new job type gains its
        // sizes after `create` and `viewDidLoad` does not run again.
        win.select("sizes").ui.setDefaultAction(editSize);
        win.select("attributes").ui.setDefaultAction(editAttribute);
        win.select("contact-fields").ui.setDefaultAction(editContactField);

        if (isEmpty(jobTypeId)) {
          await create();
          return;
        }
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        win.input("name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      // Enter is the window's to wire: a document gives it to the default
      // control, so `didHitEnter` is not declared here.
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Job Type</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 560px;">

    <fieldset>
      <legend>General</legend>
      <div class="vbox gap-10">
        <div class="text-field">
          <label for="name">Name</label>
          <input type="text" name="name" autocomplete="new-password">
        </div>
        <div class="hbox gap-10">
          <button class="primary" onclick="$(this.controller).pickIcon();">Choose icon</button>
          <span name="selected-icon-name" style="flex: 1;">None chosen</span>
        </div>
        <div class="text-field">
          <label for="min-employees">Employees needed</label>
          <input type="number" name="min-employees" value="1">
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="is-active" checked>
          <label for="is-active">Customers may schedule it</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Sizes</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 120px;">
          <select name="sizes"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addSize();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-size-btn" class="primary" disabled onclick="$(this.controller).editSize();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Attributes</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 120px;">
          <select name="attributes"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addAttribute();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-attribute-btn" class="primary" disabled onclick="$(this.controller).editAttribute();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contact Fields</legend>
      <p>The customer is asked for these, in this order, when scheduling.</p>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 140px;">
          <select name="contact-fields"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addContactField();">Add</button>
            <button class="primary up-arrow" onclick="$(this.controller).moveContactFieldUp();"></button>
            <button class="primary down-arrow" onclick="$(this.controller).moveContactFieldDown();"></button>
          </div>
          <div class="vbox gap-10">
            <button name="edit-contact-field-btn" class="primary" disabled onclick="$(this.controller).editContactField();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Payment</legend>
      <div class="vbox gap-10">
        <div class="hbox gap-10">
          <input type="checkbox" name="payment-required">
          <label for="payment-required">Payment required before scheduling</label>
        </div>
        <div class="hbox gap-10">
          <input type="checkbox" name="deposit-required">
          <label for="deposit-required">Deposit required when scheduling</label>
        </div>
        <div class="hbox gap-10">
          <div class="ui-popup-menu intrinsic" style="--popup-width: 260px;">
            <label for="stripe-product">Stripe product</label>
            <select name="stripe-product" onchange="$(this.controller).didChangeStripeProduct();">
              <option>Choose a product</option>
            </select>
          </div>
          <button class="primary" onclick="$(this.controller).loadStripeProducts();">Load</button>
        </div>
        <div class="read-only">
          <label>Linked</label>
          <span name="selected-stripe-product">None chosen</span>
        </div>
      </div>
    </fieldset>

    <div class="controls">
      <button class="primary" doc-action="cancel">Cancel</button>
      <button class="primary" doc-action="delete">Delete</button>
      <button class="default" doc-action="save">Save</button>
    </div>

  </div>
</div>
