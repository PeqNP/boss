<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      // IconPickerDelegate
      let delegate = protocol(
        "IconPickerDelegate", this, "delegate",
        [DelegateMethod("didSelectIcon", true)]
      );

      // --- Private helpers ---

      function showTab(name) {
        view.ui.div("tab-system").style.display = name === "system" ? "" : "none";
        view.ui.div("tab-custom").style.display = name === "custom" ? "" : "none";
      }

      function buildIconCell(icon) {
        const cell = document.createElement("div");
        cell.className = "icon-picker-cell";
        const img = document.createElement("img");
        img.src = icon.url;
        img.alt = icon.filename;
        img.style.cssText = "width: 40px; height: 40px; object-fit: contain;";
        cell.appendChild(img);
        cell.onclick = function() {
          delegate.didSelectIcon(icon);
          view.ui.close();
        };
        return cell;
      }

      // --- Controller functions ---

      /**
       * Loads the icons belonging to a tab.
       *
       * @param {object} tab - The chosen tab, whose value names the icon set
       */
      async function selectTab(name) {
        showTab(name);
        await loadIcons(name);
      }

      async function uploadIcon() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = async function() {
          const file = input.files[0];
          if (isEmpty(file)) {
            return;
          }
          const formData = new FormData();
          formData.append("file", file);
          try {
            await os.network.upload("/api/io.bithead.scheduler/admin/icons", formData);
          }
          catch {
            os.ui.showError("Failed to upload icon. Please try again.");
            return;
          }
          await loadIcons("custom");
        };
        input.click();
      }
      this.uploadIcon = uploadIcon;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("icon-tabs").ui.delegate = {
          didSelectTab: function(option) { selectTab(option.value); }
        };
        await loadIcons("system");
        showTab("system");
      }
      this.viewDidLoad = viewDidLoad;

      async function loadIcons(type) {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/admin/icons?type=${type}`);
        }
        catch {
          return;
        }
        const grid = view.ui.div("icon-grid-" + type);
        grid.innerHTML = "";
        for (const icon of response.icons) {
          grid.appendChild(buildIconCell(icon));
        }
      }
    }
  </script>

  <div class="title">Choose Icon</div>

  <div class="container vbox gap-10" style="width: 320px;">
    <div class="ui-tabs">
      <select name="icon-tabs">
        <option value="system">System Icons</option>
        <option value="custom">My Custom Icons</option>
      </select>
    </div>

    <!-- System icons grid -->
    <div name="tab-system">
      <div name="icon-grid-system" class="icon-picker-grid"></div>
    </div>

    <!-- Custom icons grid -->
    <div name="tab-custom" style="display: none;">
      <div name="icon-grid-custom" class="icon-picker-grid"></div>
      <button class="primary" onclick="$(this.controller).uploadIcon();" style="margin-top: 8px;">Upload New Icon</button>
    </div>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
    </div>
  </div>
</div>
