<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      const businessId = $(app.controller).getBusinessId();

      // The BOSS mark, in the form `UIListBox` reads as an option's icon.
      const BOSS_MARK = "img:/boss/img/logo.png";

      let customers = [];

      // --- Controller functions ---

      async function openCustomer() {
        const value = view.ui.select("customers").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("Customer");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
          ctrl.delegate = { didSaveCustomer: reload };
        });
      }
      this.openCustomer = openCustomer;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("customers").ui.delegate = {
          didSelectListBoxOption: function() {
            view.ui.button("view-btn").disabled = false;
          },
          didRemoveAllOptions: function() {
            view.ui.button("view-btn").disabled = true;
          }
        };
        view.ui.select("customers").ui.setDefaultAction(openCustomer);
        view.ui.input("customers-filter").ui.delegate = {
          didChangeFilter: applyCustomerFilter
        };
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        view.ui.input("customers-filter").focus();
      }
      this.viewDidAppear = viewDidAppear;

      async function reload() {
        await loadCustomers();
      }

      function customerOption(c) {
        const label = `${c.name}${(isEmpty(c.phone) ? "" : " — " + c.phone)}`;
        return {
          id: String(c.id),
          // The mark says this customer has a BOSS account, which is worth
          // knowing before the row is opened: they manage their own
          // contact information, so the form opens read-only.
          name: c.hasBossAccount ? `${BOSS_MARK},${label}` : label
        };
      }

      function applyCustomerFilter() {
        const list = view.ui.select("customers").ui;
        const selected = list.selectedValue();
        const term = view.ui.input("customers-filter").ui.term().toLowerCase();
        const filtered = isEmpty(term)
          ? customers
          : customers.filter(function(c) {
              const hay = `${c.name} ${c.phone ?? ""}`.toLowerCase();
              return hay.includes(term);
            });
        list.addNewOptions(filtered.map(customerOption));
        if (!isEmpty(selected)) {
          list.selectValue(selected);
        }
        view.ui.button("view-btn").disabled = filtered.length === 0;
      }

      async function loadCustomers() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/business/${businessId}/customers`);
        }
        catch {
          os.ui.showError("Failed to load customers. Please try again.");
          return;
        }
        customers = response.customers;
        applyCustomerFilter();
      }

      // --- OS listeners ---

      this.didHitEnter = openCustomer;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).openCustomer();">View Customer</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Customers</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-10" style="width: 400px;">
    <div class="ui-filter">
      <input name="customers-filter" type="text" placeholder="Search for customer">
    </div>
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 220px;">
        <select name="customers"></select>
      </div>
      <div class="controls-right">
        <div class="vbox gap-10">
          <button name="view-btn" class="default" disabled onclick="$(this.controller).openCustomer();">View</button>
        </div>
      </div>
    </div>
  </div>
</div>
