<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // Long enough that a search is not sent per keystroke, short enough that
      // the list keeps up with typing. Same delay `UISearchMenu` uses.
      const SEARCH_DELAY = 333;

      // The BOSS mark, in the form `UIListBox` reads as an option's icon.
      const BOSS_MARK = "img:/boss/img/logo.png";

      let searchTimer = null;

      // --- Controller functions ---

      /**
       * Searches for what has been typed so far.
       */
      function didChangeQuery() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
          loadCustomers(view.ui.input("search-query").value.trim());
        }, SEARCH_DELAY);
      }
      this.didChangeQuery = didChangeQuery;

      async function openCustomer() {
        const value = view.ui.select("customers").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("Customer");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
          ctrl.delegate = { didSaveCustomer: reload };
        });
      }
      this.openCustomer = openCustomer;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("customers").ui.delegate = {
          didSelectListBoxOption: function() {
            view.ui.button("view-btn").disabled = false;
          },
          didRemoveAllOptions: function() {
            view.ui.button("view-btn").disabled = true;
          }
        };
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        view.ui.input("search-query").focus();
      }
      this.viewDidAppear = viewDidAppear;

      function viewWillUnload() {
        clearTimeout(searchTimer);
      }
      this.viewWillUnload = viewWillUnload;

      /**
       * Reload against whatever is currently being searched for.
       */
      async function reload() {
        await loadCustomers(view.ui.input("search-query").value.trim());
      }

      async function loadCustomers(q) {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/customers" + (q ? "?q=" + encodeURIComponent(q) : ""));
        }
        catch {
          os.ui.showError("Failed to load customers. Please try again.");
          return;
        }
        view.ui.select("customers").ui.addNewOptions(
          response.customers.map(function(c) {
            const label = c.firstName + " " + c.lastName +
                          (isEmpty(c.phone) ? "" : " — " + c.phone);
            return {
              id: String(c.id),
              // The mark says this customer has a BOSS account, which is worth
              // knowing before the row is opened: they manage their own
              // contact information, so the form opens read-only.
              name: c.hasBossAccount ? `${BOSS_MARK},${label}` : label
            };
          })
        );
        view.ui.button("view-btn").disabled = response.customers.length === 0;
      }

      // --- OS listeners ---

      this.didHitEnter = openCustomer;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).openCustomer();">View Customer</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Customers</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 400px;">
    <div class="text-field">
      <label for="search-query">Search</label>
      <input type="text" name="search-query" placeholder="Name or phone"
             oninput="$(this.controller).didChangeQuery();">
    </div>
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 220px;">
        <select name="customers"></select>
      </div>
      <div class="controls-right">
        <div class="vbox gap-10">
          <button name="view-btn" class="default" disabled onclick="$(this.controller).openCustomer();">View</button>
        </div>
      </div>
    </div>
  </div>
</div>
