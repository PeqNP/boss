<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // The business this window acts on, held by the app from `/me`.
      const businessId = $(app.controller).getBusinessId();

      // --- Private helpers ---

      function renderReport(response) {
        const period = response.period;
        const year = response.year;
        const quarter = response.quarter;
        view.ui.span("report-period").textContent = period === "quarter"
          ? `Q${quarter} ${year}`
          : `Full Year ${year}`;
        view.ui.span("revenue").textContent = `$${response.revenue.toFixed(2)}`;
        view.ui.span("deposits").textContent = `$${response.depositsCollected.toFixed(2)}`;
        view.ui.span("write-offs").textContent = `$${response.writeOffs.toFixed(2)}`;
        view.ui.span("jobs-completed").textContent = response.jobsCompleted;
        view.ui.span("jobs-cancelled").textContent = response.jobsCancelled;
        view.ui.div("quarter-select").style.display = period === "quarter" ? "" : "none";
      }

      // --- Controller functions ---

      async function loadReport() {
        const period = view.ui.select("period").ui.selectedValue() || "quarter";
        const year = parseInt(view.ui.select("year").ui.selectedValue());
        const quarter = parseInt(view.ui.select("quarter").ui.selectedValue() || "1");
        if (!isNumeric(year)) {
          return;
        }
        let url = `/api/io.bithead.scheduler/business/${businessId}/reports/financial?period=${period}&year=${year}`;
        if (period === "quarter") {
          url += `&quarter=${quarter}`;
        }
        let response;
        try {
          response = await os.network.get(url);
        }
        catch {
          os.ui.showError("Failed to load report. Please try again.");
          return;
        }
        renderReport(response);
      }
      this.loadReport = loadReport;

      async function exportCsv() {
        const period = view.ui.select("period").ui.selectedValue() || "quarter";
        const year = parseInt(view.ui.select("year").ui.selectedValue());
        const quarter = parseInt(view.ui.select("quarter").ui.selectedValue() || "1");
        let url = `/api/io.bithead.scheduler/business/${businessId}/reports/financial/export?period=${period}&year=${year}`;
        if (period === "quarter") {
          url += `&quarter=${quarter}`;
        }
        window.location.href = url;
      }
      this.exportCsv = exportCsv;

      function onPeriodChange() {
        const period = view.ui.select("period").ui.selectedValue();
        view.ui.div("quarter-select").style.display = period === "quarter" ? "" : "none";
      }
      this.onPeriodChange = onPeriodChange;

      // --- Lifecycle ---

      async function viewDidLoad() {
        // Load with no params — server returns current period/year/quarter as defaults.
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.scheduler/business/${businessId}/reports/financial`);
        }
        catch {
          os.ui.showError("Failed to load report. Please try again.");
          return;
        }

        // Populate year menu from server-provided list and select the server's default.
        view.ui.select("year").ui.addNewOptions(
          response.availableYears.map(function(y) { return { id: String(y), name: String(y) }; })
        );
        view.ui.select("year").ui.selectValue(String(response.year));
        view.ui.select("period").ui.selectValue(response.period);
        view.ui.select("quarter").ui.selectValue(String(response.quarter));

        renderReport(response);
        view.ui.div("quarter-select").style.display = response.period === "quarter" ? "" : "none";
      }
      this.viewDidLoad = viewDidLoad;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).exportCsv();">Export CSV</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Financial Report</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 660px;">

    <fieldset>
      <legend>Period</legend>
      <div class="hbox gap-10" style="align-items: center;">
        <div class="ui-popup-menu intrinsic">
          <label for="period">Period</label>
          <select name="period" onchange="$(this.controller).onPeriodChange();">
            <option>Select a period</option>
            <option value="quarter">Quarterly</option>
            <option value="year">Yearly</option>
          </select>
        </div>
        <div class="ui-popup-menu intrinsic" style="--popup-width: 100px;">
          <label for="year">Year</label>
          <select name="year">
            <option>Select a year</option>
          </select>
        </div>
        <div name="quarter-select">
          <div class="ui-popup-menu intrinsic" style="--popup-width: 80px;">
            <label for="quarter">Quarter</label>
            <select name="quarter">
              <option>Select a quarter</option>
              <option value="1">Q1</option>
              <option value="2">Q2</option>
              <option value="3">Q3</option>
              <option value="4">Q4</option>
            </select>
          </div>
        </div>
        <button class="primary" onclick="$(this.controller).loadReport();">Load</button>
      </div>
    </fieldset>

    <table class="side-header">
      <thead>
        <tr><th colspan="2"><span name="report-period">—</span></th></tr>
      </thead>
      <tbody>
        <tr><th>Revenue</th><td><span name="revenue">—</span></td></tr>
        <tr><th>Deposits Collected</th><td><span name="deposits">—</span></td></tr>
        <tr><th>Write-Offs</th><td><span name="write-offs">—</span></td></tr>
        <tr><th>Jobs Completed</th><td><span name="jobs-completed">—</span></td></tr>
        <tr><th>Jobs Cancelled</th><td><span name="jobs-cancelled">—</span></td></tr>
      </tbody>
    </table>

    <div class="controls">
      <button class="default" onclick="$(this.controller).exportCsv();">Export CSV</button>
    </div>

  </div>
</div>
