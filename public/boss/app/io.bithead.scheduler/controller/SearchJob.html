<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // --- Controller functions ---

      async function search() {
        // Read through `.ui`: a menu's own `value` is the raw `select`, which
        // reports the prompt as a value and misses a styled selection.
        const status = view.ui.select("filter-status").ui.selectedValue();
        const name = view.ui.input("filter-name").value.trim();
        const phone = view.ui.input("filter-phone").value.trim();
        const from = view.ui.input("filter-from").value;
        const to = view.ui.input("filter-to").value;
        const jobTypeId = view.ui.select("filter-job-type").ui.selectedValue();
        const employeeId = view.ui.select("filter-employee").ui.selectedValue();
        await loadJobs({ status, name, phone, from, to, jobTypeId, employeeId });
      }
      this.search = search;

      /**
       * @param {number} jobId - The row that was tapped
       */
      async function openJob(jobId) {
        if (isEmpty(jobId)) {
          return;
        }
        const win = await $(app.controller).loadController("Job");
        win.ui.show(function(ctrl) {
          ctrl.configure(jobId);
          ctrl.delegate = { didSaveJob: search, didDeleteJob: search };
        });
      }
      this.openJob = openJob;

      /**
       * Keep the range the right way round.
       *
       * Whichever field was just edited is left alone and the other one moves
       * to meet it. Snapping back a date somebody has this second typed is the
       * one correction that reads as a bug rather than as help.
       *
       * `YYYY-MM-DD` compares correctly as a string, so no parsing is needed.
       *
       * @param {string} edited - "from" or "to"
       */
      function keepRangeOrdered(edited) {
        const from = view.ui.input("filter-from");
        const to = view.ui.input("filter-to");
        if (isEmpty(from.value) || isEmpty(to.value) || from.value <= to.value) {
          return;
        }
        if (edited === "from") {
          to.value = from.value;
        }
        else {
          from.value = to.value;
        }
      }

      function didChangeFromDate() {
        keepRangeOrdered("from");
      }
      this.didChangeFromDate = didChangeFromDate;

      function didChangeToDate() {
        keepRangeOrdered("to");
      }
      this.didChangeToDate = didChangeToDate;

      function clearFilters() {
        // Index 0 is the prompt — the one place selecting by index is right.
        view.ui.select("filter-status").ui.selectOption(0);
        view.ui.input("filter-name").value = "";
        view.ui.input("filter-phone").value = "";
        view.ui.input("filter-from").value = "";
        view.ui.input("filter-to").value = "";
        view.ui.select("filter-job-type").ui.selectOption(0);
        view.ui.select("filter-employee").ui.selectOption(0);
        search();
      }
      this.clearFilters = clearFilters;

      // --- Lifecycle ---

      async function viewDidLoad() {
        // Load employees for filter
        try {
          const empResp = await os.network.get("/api/io.bithead.scheduler/admin/employees");
          view.ui.select("filter-employee").ui.addNewOptions(
            [{ id: "all", name: "All employees" }].concat(
              empResp.employees.map(function(e) {
                return { id: String(e.id), name: `${e.firstName} ${e.lastName}` };
              })
            )
          );
        }
        catch { }

        // Load job types for filter
        try {
          const jtResp = await os.network.get("/api/io.bithead.scheduler/admin/job-types");
          view.ui.select("filter-job-type").ui.addNewOptions(
            [{ id: "all", name: "All job types" }].concat(
              jtResp.jobTypes.map(function(jt) {
                return { id: String(jt.id), name: jt.name };
              })
            )
          );
        }
        catch { }

        await search();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadJobs(filters) {
        // Filter to query parameter. A filter left blank is not a filter, so
        // it is left out of the query rather than sent empty.
        const QUERY_PARAMS = {
          status: "status",
          name: "name",
          phone: "phone",
          from: "fromDate",
          to: "toDate",
          jobTypeId: "jobTypeId",
          employeeId: "employeeId"
        };
        const params = new URLSearchParams();
        for (const [filter, param] of Object.entries(QUERY_PARAMS)) {
          // "all" is a choice the customer made, and it means no constraint —
          // so the client maps it away rather than the server learning a
          // magic word. Empty means unchosen, and is left out for the same
          // reason.
          if (!isEmpty(filters[filter]) && filters[filter] !== "all") {
            params.set(param, filters[filter]);
          }
        }
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/admin/jobs?" + params.toString());
        }
        catch {
          os.ui.showError("Failed to search jobs. Please try again.");
          return;
        }
        const tbody = view.ui.table("results-table").querySelector("tbody");
        tbody.innerHTML = "";
        for (const job of response.jobs) {
          const emp = (job.employees || []).map(e => e.firstName + " " + e.lastInitial + ".").join(", ");
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + job.jobCode + "</td>" +
            "<td>" + job.jobType + "</td>" +
            "<td>" + job.customerName + "</td>" +
            "<td>" + job.displayDate + " " + job.displayTime + "</td>" +
            "<td>" + job.status + "</td>" +
            "<td>" + job.paymentStatus + "</td>" +
            "<td>" + emp + "</td>";
          tr.onclick = (function(jid) { return function() { openJob(jid); }; })(job.id);
          tbody.appendChild(tr);
        }
        view.ui.span("result-count").textContent = response.jobs.length + (response.total > 50 ? " (showing first 50)" : "");
      }

      // --- OS listeners ---

      this.didHitEnter = search;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).search();">Search</option>
        <option onclick="$(this.controller).clearFilters();">Clear Filters</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Search Jobs</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-10" style="width: 760px;">

    <fieldset>
      <legend>Filters</legend>
      <div class="hbox gap-10" style="flex-wrap: wrap;">
        <div class="ui-popup-menu stacked">
          <label>Status</label>
          <select name="filter-status">
            <option>Select a status</option>
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="text-field">
          <label for="filter-name">Customer Name</label>
          <input type="text" name="filter-name" style="width: 140px;">
        </div>
        <div class="text-field">
          <label for="filter-phone">Phone</label>
          <input type="text" name="filter-phone" style="width: 120px;">
        </div>
        <div class="text-field">
          <label for="filter-from">From Date</label>
          <input type="date" name="filter-from" onchange="$(this.controller).didChangeFromDate();">
        </div>
        <div class="text-field">
          <label for="filter-to">To Date</label>
          <input type="date" name="filter-to" onchange="$(this.controller).didChangeToDate();">
        </div>
        <div class="ui-popup-menu stacked">
          <label>Job Type</label>
          <select name="filter-job-type">
            <option>Select a job type</option>
          </select>
        </div>
        <div class="ui-popup-menu stacked">
          <label>Employee</label>
          <select name="filter-employee">
            <option>Select an employee</option>
          </select>
        </div>
      </div>
      <div class="controls" style="margin-top: 6px;">
        <button class="primary" onclick="$(this.controller).clearFilters();">Clear</button>
        <button class="default" onclick="$(this.controller).search();">Search</button>
      </div>
    </fieldset>

    <div class="hbox gap-8" style="align-items: center;">
      <span>Results: </span><span name="result-count">—</span>
    </div>

    <table name="results-table" style="width: 100%;">
      <thead>
        <tr>
          <th>Code</th>
          <th>Job Type</th>
          <th>Customer</th>
          <th>Date/Time</th>
          <th>Status</th>
          <th>Payment</th>
          <th>Employees</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
