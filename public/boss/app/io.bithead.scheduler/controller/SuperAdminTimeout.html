<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view, win) {

      // A document: the window owns Save, asks before discarding a change
      // nobody saved, and says "Saved". There is nothing here to delete.
      this.document = new UIDocument(null, null);

      // --- Controller functions ---

      /**
       * @returns {boolean} `true` when the setting was written
       */
      async function save() {
        const minutes = parseInt(win.input("timeout-minutes").value);
        if (!isNumeric(minutes) || minutes < 1) {
          win.showMessage("Enter a timeout of at least 1 minute.", { error: true });
          return false;
        }
        try {
          await os.network.put("/api/io.bithead.scheduler/superadmin/timeout", { timeoutMinutes: minutes });
        }
        catch (error) {
          win.showMessage(error.message, { error: true });
          return false;
        }
        return true;
      }
      this.save = save;

      // --- Lifecycle ---

      async function viewDidLoad() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.scheduler/superadmin/timeout");
        }
        catch {
          os.ui.showError("Failed to load timeout setting. Please try again.");
          return;
        }
        win.input("timeout-minutes").value = response.timeoutMinutes;
      }
      this.viewDidLoad = viewDidLoad;

      // Enter is the window's to wire: a document gives it to the default
      // control, so `didHitEnter` is not declared here.
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Schedule Timeout</span></div>
  </div>

  <div class="container vbox gap-20" style="width: 360px;">
    <p>Set the number of minutes a customer has to complete scheduling before their reserved slot is released.</p>
    <div class="text-field">
      <label for="timeout-minutes">Timeout (minutes)</label>
      <input type="number" name="timeout-minutes" value="10" min="1" style="width: 80px;">
    </div>
    <!-- No onclick: a document's controls are wired by the window, which asks
         before discarding and disables them all while one runs. -->
    <div class="controls">
      <button class="default" doc-action="save">Save</button>
    </div>
  </div>
</div>
