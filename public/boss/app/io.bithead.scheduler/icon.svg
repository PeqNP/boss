<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>Scheduler</title>
  <!-- Calendar body -->
  <rect x="6" y="14" width="52" height="44" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Header bar -->
  <rect x="6" y="14" width="52" height="14" fill="#000000"/>
  <!-- Calendar rings -->
  <rect x="18" y="8" width="6" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="40" y="8" width="6" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Grid dots representing days -->
  <rect x="14" y="36" width="6" height="6" fill="#000000"/>
  <rect x="26" y="36" width="6" height="6" fill="#000000"/>
  <rect x="38" y="36" width="6" height="6" fill="#000000"/>
  <rect x="14" y="46" width="6" height="6" fill="#000000"/>
  <rect x="26" y="46" width="6" height="6" fill="#000000"/>
</svg>
