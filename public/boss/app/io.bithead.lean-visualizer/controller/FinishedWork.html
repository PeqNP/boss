<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      let year = "";
      let payload = null;
      let operatorName = "";

      function close() {
        view.ui.close();
      }
      this.close = close;

      function showOperator(name) {
        operatorName = name;
        render();
      }
      this.showOperator = showOperator;

      async function viewDidLoad() {
        const now = new Date().getFullYear();
        const years = [];
        for (let value = 2026; value <= now; value += 1) {
          years.push({ id: String(value), name: String(value) });
        }
        const menu = view.ui.select("year").ui;
        menu.addNewOptions(years);
        view.ui.select("year").addEventListener("change", function() {
          const value = menu.selectedValue();
          if (isEmpty(value) || value === year) {
            return;
          }
          year = value;
          load();
        });
        year = String(Math.max(now, 2026));
        menu.selectValue(year);
        await load();
      }
      this.viewDidLoad = viewDidLoad;

      async function load() {
        payload = await os.network.get(
          "/api/io.bithead.lean-visualizer/finished-work?year=" + encodeURIComponent(year)
        );
        const names = [];
        for (const item of payload.items || []) {
          if (names.indexOf(item.operatorName) === -1) {
            names.push(item.operatorName);
          }
        }
        operatorName = names.length === 0 ? "" : names[0];
        render();
      }

      function render() {
        const items = (payload && payload.items || []).filter(function(item) {
          return item.operatorName === operatorName;
        });
        view.ui.span("count").textContent = String(items.length);
        drawOperators(payload ? payload.items || [] : []);
        const body = view.ui.table("finished").querySelector("tbody");
        body.innerHTML = "";
        if (items.length === 0) {
          const empty = document.createElement("tr");
          empty.innerHTML = "<td colspan=\"3\">No finished work for this year.</td>";
          body.appendChild(empty);
          return;
        }
        const root = payload ? payload.jiraRootUrl : "";
        for (const item of items) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td>" + keyLink(root, item.issueKey) + "</td><td>"
            + escapeHtml(item.description || "—") + "</td><td>"
            + escapeHtml(item.completedWeek || "—") + "</td>";
          body.appendChild(tr);
        }
      }

      function drawOperators(items) {
        const box = view.ui.div("operators");
        box.innerHTML = "";
        const names = [];
        for (const item of items) {
          if (names.indexOf(item.operatorName) === -1) {
            names.push(item.operatorName);
          }
        }
        for (const name of names) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "primary";
          button.textContent = name;
          button.addEventListener("click", function() {
            showOperator(name);
          });
          box.appendChild(button);
        }
      }

      function keyLink(root, key) {
        const text = escapeHtml(key || "");
        if (isEmpty(root) || isEmpty(key)) {
          return text;
        }
        const href = String(root).replace(/\/$/, "") + "/browse/" + encodeURIComponent(key);
        return "<a class=\"jira-key\" href=\"" + escapeHtml(href) + "\" target=\"_blank\">" + text + "</a>";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;");
      }
    }
  </script>

  <div class="title">Finished Work</div>
  <div class="container vbox gap-10" style="width: 560px;">
    <div class="ui-popup-menu">
      <label for="year">Year</label>
      <select name="year">
        <option>Year</option>
      </select>
    </div>
    <div class="read-only">
      <label>Completed FRs</label>
      <span name="count"></span>
    </div>
    <div name="operators" class="operator-tabs"></div>
    <table name="finished">
      <thead>
        <tr><th title="Key"><span class="column-name">Key</span></th><th title="Description"><span class="column-name">Description</span></th><th title="Week"><span class="column-name">Week</span></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
