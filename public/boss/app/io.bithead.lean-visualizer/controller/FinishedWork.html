<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      let year = "";
      let payload = null;
      let operatorName = "";

      function close() {
        view.ui.close();
      }
      this.close = close;

      function showOperator(name) {
        operatorName = name;
        render();
      }
      this.showOperator = showOperator;

      async function viewDidLoad() {
        const now = new Date().getFullYear();
        const years = [];
        for (let value = 2026; value <= now; value += 1) {
          years.push({ id: String(value), name: String(value) });
        }
        const menu = view.ui.select("year").ui;
        menu.addNewOptions(years);
        const tabs = view.ui.select("operators").ui;
        tabs.delegate = {
          didSelectTab: function(option) {
            showOperator(option.value);
          },
          didCloseTab: function() {}
        };
        view.ui.select("year").addEventListener("change", function() {
          const value = menu.selectedValue();
          if (isEmpty(value) || value === year) {
            return;
          }
          year = value;
          load();
        });
        year = String(Math.max(now, 2026));
        menu.selectValue(year);
        await load();
      }
      this.viewDidLoad = viewDidLoad;

      async function load() {
        payload = await os.network.get(
          "/api/io.bithead.lean-visualizer/finished-work?year=" + encodeURIComponent(year)
        );
        const names = [];
        for (const item of payload.items || []) {
          if (names.indexOf(item.operatorName) === -1) {
            names.push(item.operatorName);
          }
        }
        const tabs = view.ui.select("operators").ui;
        if (names.length === 0) {
          tabs.addNewTabs([]);
          operatorName = "";
          render();
          return;
        }
        tabs.addNewTabs(names.map(function(name) {
          return new UITabChoice(name, name);
        }));
        operatorName = names[0];
        tabs.selectTab(operatorName);
        const selected = tabs.selectedTab();
        if (!isEmpty(selected) && !isEmpty(selected.ui)) {
          selected.ui.parentElement.scrollLeft = selected.ui.offsetLeft;
        }
      }

      function render() {
        const all = (payload && payload.items) || [];
        const items = all.filter(function(item) {
          return item.operatorName === operatorName;
        });
        view.ui.span("year-count").textContent = String(all.length);
        view.ui.span("operator-count").textContent = String(items.length);
        const body = view.ui.table("finished").querySelector("tbody");
        body.innerHTML = "";
        if (items.length === 0) {
          const empty = document.createElement("tr");
          empty.innerHTML = "<td colspan=\"3\">No finished work for this year.</td>";
          body.appendChild(empty);
          return;
        }
        const root = payload ? payload.jiraRootUrl : "";
        for (const item of items) {
          const description = item.description || "—";
          const tr = document.createElement("tr");
          tr.innerHTML = "<td class=\"key\">" + keyLink(root, item.issueKey) + "</td>"
            + "<td class=\"summary\" title=\"" + escapeHtml(description) + "\">"
            + escapeHtml(description) + "</td>"
            + "<td class=\"week\">" + escapeHtml(item.completedWeek || "—") + "</td>";
          body.appendChild(tr);
        }
      }

      function keyLink(root, key) {
        const text = escapeHtml(key || "");
        if (isEmpty(root) || isEmpty(key)) {
          return text;
        }
        const href = String(root).replace(/\/$/, "") + "/browse/" + encodeURIComponent(key);
        return "<a class=\"jira-key\" href=\"" + escapeHtml(href) + "\" target=\"_blank\">" + text + "</a>";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;");
      }
    }
  </script>

  <div class="title">Finished Work</div>
  <div class="container vbox gap-10" style="width: 560px;">
    <div class="ui-popup-menu">
      <label for="year">Year</label>
      <select name="year">
        <option>Year</option>
      </select>
    </div>
    <div class="read-only">
      <label class="intrinsic">Total completed</label>
      <span name="year-count"></span>
    </div>
    <div class="ui-tabs">
      <select name="operators"></select>
    </div>
    <div class="read-only">
      <label class="intrinsic">Completed</label>
      <span name="operator-count"></span>
    </div>
    <div class="five-rows">
      <table name="finished">
        <thead>
          <tr><th class="key" title="Key">Key</th><th class="summary" title="Description">Description</th><th class="week" title="Week">Week</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
