<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      let weekStart = "";
      let payload = null;
      let operatorName = "";

      function close() {
        view.ui.close();
      }
      this.close = close;

      /**
       * @param {{weekStart: string}} options
       */
      function configure(options) {
        weekStart = options && options.weekStart ? options.weekStart : "";
      }
      this.configure = configure;

      function showOperator(name) {
        operatorName = name;
        render();
      }
      this.showOperator = showOperator;

      async function viewDidLoad() {
        let path = "/api/io.bithead.lean-visualizer/metrics-tasks";
        if (!isEmpty(weekStart)) {
          path += "?week_start=" + encodeURIComponent(weekStart);
        }
        payload = await os.network.get(path);
        const tabs = view.ui.select("operators").ui;
        tabs.delegate = {
          didSelectTab: function(option) {
            showOperator(option.value);
          },
          didCloseTab: function() {}
        };
        const choices = (payload.operators || []).map(function(item) {
          return new UITabChoice(item.operatorName, item.operatorName);
        });
        if (choices.length === 0) {
          render();
          return;
        }
        tabs.addNewTabs(choices);
        operatorName = choices[0].id;
        tabs.selectTab(operatorName);
        const selected = tabs.selectedTab();
        if (!isEmpty(selected) && !isEmpty(selected.ui)) {
          selected.ui.parentElement.scrollLeft = selected.ui.offsetLeft;
        }
      }
      this.viewDidLoad = viewDidLoad;

      function render() {
        const week = payload ? payload.weekStart + " – " + payload.weekEnd : weekStart;
        view.ui.span("week").textContent = week;
        const body = view.ui.table("tasks").querySelector("tbody");
        body.innerHTML = "";
        const group = ((payload && payload.operators) || []).find(function(item) {
          return item.operatorName === operatorName;
        });
        const tasks = group ? group.tasks : [];
        if (tasks.length === 0) {
          const empty = document.createElement("tr");
          empty.innerHTML = "<td colspan=\"3\">No tasks for this week.</td>";
          body.appendChild(empty);
          return;
        }
        const root = payload ? payload.jiraRootUrl : "";
        for (const task of tasks) {
          const tr = document.createElement("tr");
          const description = task.description || "—";
          tr.innerHTML = "<td class=\"key\">" + keyLink(root, task.issueKey) + "</td>"
            + "<td class=\"summary\" title=\"" + escapeHtml(description) + "\">"
            + escapeHtml(description) + "</td>"
            + "<td class=\"kind\">" + (task.planned ? "Planned" : "Unplanned") + "</td>";
          body.appendChild(tr);
        }
      }

      function keyLink(root, key) {
        const text = escapeHtml(key || "");
        if (isEmpty(root) || isEmpty(key)) {
          return text;
        }
        const href = String(root).replace(/\/$/, "") + "/browse/" + encodeURIComponent(key);
        return "<a class=\"jira-key\" href=\"" + escapeHtml(href) + "\" target=\"_blank\">" + text + "</a>";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;");
      }
    }
  </script>

  <div class="title">Tasks Included In Units / Week</div>
  <div class="container vbox gap-10" style="width: 560px;">
    <div class="read-only">
      <label>Week</label>
      <span name="week"></span>
    </div>
    <div class="ui-tabs">
      <select name="operators"></select>
    </div>
    <div class="task-scroll">
      <table name="tasks">
        <thead>
          <tr><th class="key" title="Key">Key</th><th class="summary" title="Description">Description</th><th class="kind" title="Kind">Kind</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
