<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      let releases = [];
      let root = "";

      function close() {
        view.ui.close();
      }
      this.close = close;

      async function viewDidLoad() {
        const list = view.ui.select("release-choices").ui;
        list.delegate = {
          didSelectListBoxOption: function(option) {
            showRelease(option.value);
          },
          didRemoveAllOptions: function() {}
        };
        const options = await os.network.get("/api/io.bithead.lean-visualizer/release-options");
        releases = options.releases || [];
        showMatches("");
        view.ui.input("release-search").addEventListener("input", function(event) {
          showMatches(event.target.value);
        });
      }
      this.viewDidLoad = viewDidLoad;

      function showMatches(term) {
        const needle = term.trim().toLowerCase();
        const matches = releases.filter(function(release) {
          return isEmpty(needle) || release.version.toLowerCase().indexOf(needle) >= 0;
        });
        view.ui.select("release-choices").ui.addNewOptions(matches.map(function(release) {
          return { id: release.version, name: release.version + "  " + release.date };
        }));
      }

      async function showRelease(version) {
        view.ui.span("chosen").textContent = version || "";
        const body = view.ui.table("units").querySelector("tbody");
        body.innerHTML = "";
        if (isEmpty(version)) {
          return;
        }
        const result = await os.network.get(
          "/api/io.bithead.lean-visualizer/metrics-release-work-units?release_version="
          + encodeURIComponent(version)
        );
        root = result.jiraRootUrl || "";
        const tasks = result.tasks || [];
        if (tasks.length === 0) {
          const empty = document.createElement("tr");
          empty.innerHTML = "<td colspan=\"3\">No completed issues for this release.</td>";
          body.appendChild(empty);
          return;
        }
        for (const task of tasks) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td>" + keyLink(task.issueKey) + "</td><td>"
            + escapeHtml(task.description || "—") + "</td><td>"
            + escapeHtml(task.operatorName || "—") + "</td>";
          body.appendChild(tr);
        }
      }

      function keyLink(key) {
        const text = escapeHtml(key || "");
        if (isEmpty(root) || isEmpty(key)) {
          return text;
        }
        const href = String(root).replace(/\/$/, "") + "/browse/" + encodeURIComponent(key);
        return "<a class=\"jira-key\" href=\"" + escapeHtml(href) + "\" target=\"_blank\">" + text + "</a>";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;");
      }
    }
  </script>

  <div class="title">Prepare Release</div>
  <div class="container vbox gap-10" style="width: 560px;">
    <div class="text-field">
      <label for="release-search">Release</label>
      <input type="text" name="release-search" autocomplete="off">
    </div>
    <div class="ui-list-box" style="width: auto; height: 90px;">
      <select name="release-choices"></select>
    </div>
    <div class="read-only">
      <label>Chosen</label>
      <span name="chosen"></span>
    </div>
    <table name="units">
      <thead>
        <tr><th title="Key"><span class="column-name">Key</span></th><th title="Description"><span class="column-name">Description</span></th><th title="Operator"><span class="column-name">Operator</span></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
