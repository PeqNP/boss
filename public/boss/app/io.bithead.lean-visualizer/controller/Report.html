<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      let callerRole = "Admin";
      let jiraRootUrl = "";

      /**
       * Opens the checkpoint modal.
       */
      /**
       * Records a priority snapshot. Stubbed until the route exists.
       */
      function saveSnapshot() {
        view.ui.showMessage("Snapshot saved.");
        renderLog(stubMaterialLog());
      }
      this.saveSnapshot = saveSnapshot;

      /**
       * Opens the log for one feature.
       *
       * @param {string} featureId
       */
      async function openLog(featureId) {
        const feature = stubMaterialLog().features.find(function(item) {
          return item.featureId === featureId;
        });
        if (isEmpty(feature)) {
          return;
        }
        const child = await $(app.controller).loadController("MaterialLog");
        child.ui.show(function(ctrl) {
          ctrl.configure({ name: feature.name, entries: feature.entries });
        });
      }
      this.openLog = openLog;

      async function saveCheckpoint() {
        const win = await $(app.controller).loadController("Checkpoint");
        win.ui.show(function(ctrl) {
          ctrl.configure({
            releases: [
              { id: "rel_14", version: "1.4.0", date: "2026-09-11" },
              { id: "rel_15", version: "1.5.0", date: "2026-09-25" }
            ]
          });
          ctrl.delegate = {
            didSaveCheckpoint: function() {
              reload();
            }
          };
        });
      }
      this.saveCheckpoint = saveCheckpoint;

      /**
       * @param {{role: string}} options - Admin sees Save Checkpoint
       */
      function configure(options) {
        callerRole = options && options.role ? options.role : "Admin";
      }
      this.configure = configure;

      async function viewDidLoad() {
        reload();
      }
      this.viewDidLoad = viewDidLoad;

      async function reload() {
        const report = await os.network.get("/api/io.bithead.lean-visualizer/report");
        const model = await os.network.get("/api/io.bithead.lean-visualizer/model");
        jiraRootUrl = model.config && model.config.jiraRootUrl ? model.config.jiraRootUrl : "";
        render(report);
        renderLog(stubMaterialLog());
        const writing = callerRole !== "Admin";
        view.ui.button("checkpoint").hidden = writing;
        view.ui.button("snapshot").hidden = writing;
      }

      function render(report) {
        view.ui.span("as-of").textContent = report.asOf;
        view.ui.span("rate-window").textContent = report.rates.windowStart + " – " + report.rates.windowEnd;
        fill(view.ui.table("rates"), report.rates.operators.map(function(row) {
          const plannedRate = Number(row.plannedPerWeek) || 0;
          const unplannedRate = Number(row.unplannedPerWeek) || 0;
          return [
            row.operatorName,
            row.plannedTotal,
            twoPlaces(plannedRate),
            row.unplannedTotal,
            twoPlaces(unplannedRate),
            twoPlaces(plannedRate + unplannedRate),
            row.weeksCounted
          ];
        }));
        fill(view.ui.table("open-pillars"), report.pillars.open.map(function(row) {
          return [row.pillar, row.featureCount, percentText(row.share)];
        }));
      }

      /**
       * Sample log so the section can be judged before the route exists.
       */
      function stubMaterialLog() {
        return {
          savedAt: "2026-09-24",
          previousSavedAt: "2026-09-10",
          features: [
            {
              featureId: "fr-badge",
              issueKey: "BDG-120",
              name: "Badge Mobile check-in for the lobby kiosk and the overnight reprint queue",
              color: "#336699",
              entries: [
                {
                  kind: "blockage",
                  startedOn: "2026-09-18",
                  endedOn: "",
                  createdOn: "2026-09-24",
                  note: "Waiting on the vendor beta signup.",
                  days: 6
                },
                {
                  kind: "sequence",
                  startedOn: "2026-09-22",
                  createdOn: "2026-09-22",
                  note: "Reprioritized behind Upgrade MariaDB.",
                  days: 0
                },
                {
                  kind: "units",
                  startedOn: "2026-09-20",
                  createdOn: "2026-09-20",
                  note: "Added 8 units.",
                  days: 4
                },
                {
                  kind: "rate",
                  startedOn: "2026-09-17",
                  createdOn: "2026-09-17",
                  note: "The lane's rate changed from 8.5 to 6.",
                  days: 3
                },
                {
                  kind: "sequence",
                  startedOn: "2026-09-15",
                  createdOn: "2026-09-15",
                  note: "Reprioritized behind Badge printing.",
                  days: 0
                },
                {
                  kind: "entered",
                  startedOn: "2026-09-12",
                  createdOn: "2026-09-12",
                  note: "Entered the queue.",
                  days: 0
                },
                {
                  kind: "blockage",
                  startedOn: "2026-09-01",
                  endedOn: "2026-09-08",
                  createdOn: "2026-09-08",
                  note: "Waiting on a third-party beta.",
                  days: 7
                }
              ]
            }
          ]
        };
      }

      function renderLog(log) {
        const changes = view.ui.table("changes").querySelector("tbody");
        changes.innerHTML = "";
        if (isEmpty(log.previousSavedAt)) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td colspan=\"2\">A snapshot is the baseline.</td>";
          changes.appendChild(tr);
          return;
        }
        if (log.features.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td colspan=\"2\">No changes since the last snapshot.</td>";
          changes.appendChild(tr);
          return;
        }
        for (const feature of log.features) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td class=\"change-feature\"><span class=\"feature-name\">"
            + dot(feature.color) + featureLine(feature) + "</span></td>"
            + "<td class=\"log\"><button type=\"button\" class=\"primary\" data-log=\"" + feature.featureId + "\">Log</button></td>";
          changes.appendChild(tr);
        }
        changes.onclick = function(event) {
          const button = event.target.closest("[data-log]");
          if (isEmpty(button)) {
            return;
          }
          openLog(button.dataset.log);
        };
      }

      function featureLine(feature) {
        const name = "<span class=\"feature-desc\">" + escapeHtml(feature.name) + "</span>";
        const key = featureKey(feature);
        if (isEmpty(key)) {
          return " " + name;
        }
        return "<span class=\"key-part\"> " + key + "</span><span class=\"feature-desc\">: "
          + escapeHtml(feature.name) + "</span>";
      }

      function featureKey(feature) {
        const key = String(feature.issueKey || "").trim();
        if (isEmpty(key)) {
          return "";
        }
        const root = String(jiraRootUrl || "").replace(/\/$/, "");
        if (isEmpty(root)) {
          return escapeHtml(key);
        }
        return "<a class=\"jira-key\" href=\"" + root + "/browse/" + encodeURIComponent(key)
          + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + escapeHtml(key) + "</a>";
      }

      function dot(color) {
        return "<span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:"
          + color + ";vertical-align:middle\"></span>";
      }

      function twoPlaces(value) {
        return (Number(value) || 0).toFixed(2);
      }

      function percentText(value) {
        const rounded = Math.round((Number(value) || 0) * 100) / 100;
        return String(rounded) + "%";
      }

      function fill(table, rows) {
        const body = table.querySelector("tbody");
        body.innerHTML = "";
        for (const row of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML = row.map(function(cell) {
            return "<td>" + escapeHtml(cell) + "</td>";
          }).join("");
          body.appendChild(tr);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Capacity report</span></div>
  </div>

  <div class="container vbox gap-20 resizable" style="width: 760px; height: 560px;">
    <div class="hbox gap-10">
      <div class="read-only">
        <label>As of</label>
        <span name="as-of"></span>
      </div>
      <button name="snapshot" class="primary" onclick="$(this.controller).saveSnapshot();">Save Snapshot</button>
      <button name="checkpoint" class="default" onclick="$(this.controller).saveCheckpoint();">Save Checkpoint</button>
    </div>

    <fieldset>
      <legend>Planned and unplanned (<span name="rate-window"></span>)</legend>
      <div class="vbox gap-10">
        <table name="rates">
          <thead>
            <tr>
              <th title="Operator">Operator</th>
              <th title="Planned tasks in these weeks">Planned</th>
              <th title="Planned tasks per week">Rate</th>
              <th title="Unplanned tasks in these weeks">Unplanned</th>
              <th title="Unplanned tasks per week">Rate</th>
              <th title="Planned rate plus unplanned rate">Total Rate</th>
              <th title="Weeks in the average">Weeks</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </fieldset>

    <fieldset>
      <legend>Strategic pillar</legend>
      <div class="vbox gap-10">
        <table name="open-pillars">
          <thead>
            <tr><th title="Pillar">Pillar</th><th title="Open features in this pillar">Open features</th><th title="Share of open features">Distribution</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </fieldset>

    <fieldset>
      <legend>Material changes</legend>
      <div class="vbox gap-10">
        <table name="changes">
          <thead>
            <tr><th title="Feature"><span class="column-name">Feature</span></th><th class="log" title="Log"><span class="column-name">Log</span></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </fieldset>
  </div>
</div>
