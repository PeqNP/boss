<div class="ui-application">
  <script type="text/javascript">
    function $(this.id)() {

      let signedInRole = null;
      let sessionPromise = null;
      let openingHome = null;
      let askedToSignIn = false;

      function quit() {
        os.closeApplication("$(app.bundleId)");
      }
      this.quit = quit;

      /**
       * Read who is signed in, once.
       *
       * Opening as a guest returns before this runs. The role must not stay
       * at a default, or Board keeps opening the report after they sign in.
       *
       * @returns {Promise<boolean>}
       */
      function ensureSession() {
        if (os.isGuestUser(os.user)) {
          if (!askedToSignIn) {
            askedToSignIn = true;
            os.ui.showSignIn();
          }
          return Promise.resolve(false);
        }
        askedToSignIn = false;
        if (sessionPromise !== null) {
          return sessionPromise;
        }
        sessionPromise = os.network.get("/api/io.bithead.lean-visualizer/me").then(function(me) {
          signedInRole = me.role;
          applyRoleMenu();
          return true;
        }).catch(function(error) {
          sessionPromise = null;
          throw error;
        });
        return sessionPromise;
      }

      /**
       * Opens the board.
       */
      async function showBoard() {
        if (!await ensureSession()) {
          return;
        }
        await open("Board");
      }
      this.showBoard = showBoard;

      /**
       * Opens the capacity report.
       */
      async function showReport() {
        const win = await $(this.controller).loadController("Report");
        win.ui.show(function(ctrl) {
          ctrl.configure({ role: role() });
        });
      }
      this.showReport = showReport;

      /**
       * Opens the read-only schedule.
       */
      async function showSchedule() {
        await open("Schedule");
      }
      this.showSchedule = showSchedule;

      async function applicationDidStart() {
        await os.network.stylesheet("$(app.resourcePath)/lean.css");
        await openHome();
      }
      this.applicationDidStart = applicationDidStart;

      /**
       * Somebody signed in after this app was opened as a guest.
       *
       * The role from that earlier moment is discarded and `/me` is read again.
       */
      async function userDidSignIn() {
        sessionPromise = null;
        signedInRole = null;
        openingHome = null;
        await openHome();
      }
      this.userDidSignIn = userDidSignIn;

      /**
       * A second tap focuses an app that started as a guest and never opened
       * a window. Sign-in does not start it again, so this is when home opens.
       */
      async function applicationDidFocus() {
        const container = document.getElementById(os.ui.appContainerId("$(app.bundleId)"));
        if (!isEmpty(container) && container.querySelector(".ui-window, .ui-modal")) {
          return;
        }
        await openHome();
      }
      this.applicationDidFocus = applicationDidFocus;

      function openHome() {
        if (openingHome !== null) {
          return openingHome;
        }
        openingHome = doOpenHome();
        return openingHome;
      }

      async function doOpenHome() {
        if (!await ensureSession()) {
          openingHome = null;
          return;
        }
        await open(home());
      }

      this.openDeepLink = async function(deepLink) {
        if (!await ensureSession()) {
          return;
        }
        await open(screenFor(deepLink.path));
      };

      this.openUniversalLink = async function(link) {
        if (!await ensureSession()) {
          return;
        }
        await open(screenFor(link.path));
      };

      function role() {
        return signedInRole;
      }

      function home() {
        return role() === "Employee" ? "Report" : "Board";
      }

      function screenFor(path) {
        const name = String(path || "").replace(/^\//, "").split("/")[0];
        if (name === "schedule") {
          return "Schedule";
        }
        if (name === "report") {
          return "Report";
        }
        if (name === "board") {
          return "Board";
        }
        return home();
      }

      function applyRoleMenu() {
        const select = os.application("$(app.bundleId)").menus().ui.select("go-menu");
        if (role() === "Employee") {
          return;
        }
        select.ui.removeOption("schedule");
      }

      async function open(name) {
        if (name === "Report") {
          await showReport();
          return;
        }
        const win = await $(this.controller).loadController(name);
        win.ui.show();
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 200px;">
      <select name="application-menu">
        <option>Lean Visualizer</option>
        <option onclick="$(this.controller).quit();">Quit Lean Visualizer</option>
      </select>
    </div>
    <div class="ui-menu secure" style="width: 180px;">
      <select name="go-menu">
        <option>Dashboards</option>
        <option value="board" onclick="$(this.controller).showBoard();">Board</option>
        <option value="report" onclick="$(this.controller).showReport();">Capacity report</option>
        <option value="schedule" onclick="$(this.controller).showSchedule();">Schedule</option>
      </select>
    </div>
  </div>
</div>
