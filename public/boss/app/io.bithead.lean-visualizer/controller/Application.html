<div class="ui-application">
  <script type="text/javascript">
    function $(this.id)() {

      let signedInRole = "Employee";
      let boardLink = null;

      const API = "/api/io.bithead.lean-visualizer";

      function quit() {
        os.closeApplication("$(app.bundleId)");
      }
      this.quit = quit;

      /**
       * Opens the board. An Employee lands on the report.
       */
      async function showBoard() {
        await open(role() === "Employee" ? "Report" : "Board");
      }
      this.showBoard = showBoard;

      /**
       * Opens the capacity report.
       */
      async function showReport() {
        const win = await $(this.controller).loadController("Report");
        win.ui.show(function(ctrl) {
          ctrl.configure({ role: role() });
        });
      }
      this.showReport = showReport;

      /**
       * Opens the read-only schedule.
       */
      async function showSchedule() {
        await open("Schedule");
      }
      this.showSchedule = showSchedule;

      /**
       * The open board, so a release save uses its revision.
       *
       * @param {{snapshot: function(): {revision: number, state: object}, adopt: function(object): void}|null} link
       */
      function attachBoard(link) {
        boardLink = link;
      }
      this.attachBoard = attachBoard;

      /**
       * Opens Manage Releases. The list is the board's releases.
       */
      async function showReleases() {
        let held = await os.network.get(API + "/model");
        if (!isEmpty(boardLink)) {
          held = boardLink.snapshot();
        }
        const win = await $(this.controller).loadController("Releases");
        let chain = Promise.resolve();
        win.ui.show(function(ctrl) {
          ctrl.configure({ releases: held.state.releases || [] });
          ctrl.delegate = {
            didChangeReleases: function(next) {
              chain = chain.then(async function() {
                const source = isEmpty(boardLink) ? held : boardLink.snapshot();
                const saved = await os.network.put(API + "/model", {
                  revision: source.revision,
                  state: Object.assign({}, source.state, { releases: next })
                });
                if (isEmpty(saved) || isEmpty(saved.revision)) {
                  return;
                }
                held = saved;
                if (!isEmpty(boardLink)) {
                  boardLink.adopt(saved);
                }
              }).catch(function() {});
            }
          };
        });
      }
      this.showReleases = showReleases;

      async function applicationDidStart() {
        await os.network.stylesheet("$(app.resourcePath)/lean.css");
        if (os.isGuestUser(os.user)) {
          os.ui.showSignIn();
          return;
        }
        const me = await os.network.get("/api/io.bithead.lean-visualizer/me");
        signedInRole = me.role;
        applyRoleMenu();
        await open(home());
      }
      this.applicationDidStart = applicationDidStart;

      this.openDeepLink = async function(deepLink) {
        if (os.isGuestUser(os.user)) {
          os.ui.showSignIn();
          return;
        }
        applyRoleMenu();
        await open(screenFor(deepLink.path));
      };

      this.openUniversalLink = async function(link) {
        if (os.isGuestUser(os.user)) {
          os.ui.showSignIn();
          return;
        }
        applyRoleMenu();
        await open(screenFor(link.path));
      };

      function role() {
        return signedInRole;
      }

      function home() {
        return role() === "Employee" ? "Report" : "Board";
      }

      function screenFor(path) {
        const name = String(path || "").replace(/^\//, "").split("/")[0];
        if (name === "schedule") {
          return "Schedule";
        }
        if (name === "report") {
          return "Report";
        }
        if (name === "board") {
          return home();
        }
        return home();
      }

      function applyRoleMenu() {
        const select = os.application("$(app.bundleId)").menus().ui.select("go-menu");
        if (role() === "Employee") {
          select.ui.removeOption("board");
          select.ui.removeOption("releases");
          return;
        }
        select.ui.removeOption("schedule");
      }

      async function open(name) {
        if (name === "Report") {
          await showReport();
          return;
        }
        const win = await $(this.controller).loadController(name);
        win.ui.show();
      }
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 200px;">
      <select name="application-menu">
        <option>Lean Visualizer</option>
        <option onclick="$(this.controller).quit();">Quit Lean Visualizer</option>
      </select>
    </div>
    <div class="ui-menu secure" style="width: 140px;">
      <select name="go-menu">
        <option>Go</option>
        <option value="board" onclick="$(this.controller).showBoard();">Board</option>
        <option value="report" onclick="$(this.controller).showReport();">Report</option>
        <option value="releases" onclick="$(this.controller).showReleases();">Releases</option>
        <option value="schedule" onclick="$(this.controller).showSchedule();">Schedule</option>
      </select>
    </div>
  </div>
</div>
