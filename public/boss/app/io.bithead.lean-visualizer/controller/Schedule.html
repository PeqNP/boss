<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      async function viewDidLoad() {
        // Stand-in for GET /schedule.
        const schedule = {
          horizonDays: 180,
          tracks: [
            {
              id: "tr_platform",
              name: "Platform",
              enabled: true,
              capacity: 6.5,
              bars: [
                { featureId: "f_portal", name: "Client portal", color: "#d95f02", startOn: "2026-09-22", finishOn: "2026-10-09" }
              ]
            },
            {
              id: "tr_client",
              name: "Client",
              enabled: true,
              capacity: 3,
              bars: [
                { featureId: "f_billing", name: "Billing export", color: "#216e39", startOn: "2026-09-22", finishOn: "2026-10-23" }
              ]
            }
          ],
          releases: [
            { id: "rel_14", version: "1.4.0", date: "2026-09-11" },
            { id: "rel_15", version: "1.5.0", date: "2026-09-25" }
          ]
        };
        render(schedule);
      }
      this.viewDidLoad = viewDidLoad;

      function render(schedule) {
        view.ui.span("horizon").textContent = schedule.horizonDays + " days";
        const body = view.ui.table("tracks").querySelector("tbody");
        body.innerHTML = "";
        for (const track of schedule.tracks) {
          const tr = document.createElement("tr");
          const bars = track.bars.map(function(bar) {
            const finish = bar.finishOn || "—";
            return "<span style=\"display:inline-block;width:12px;height:12px;border-radius:50%;background:"
              + bar.color + "\"></span> " + escapeHtml(bar.name) + " " + escapeHtml(finish);
          }).join("<br>");
          tr.innerHTML = "<td>" + escapeHtml(track.name) + "</td>"
            + "<td>" + track.capacity + "</td>"
            + "<td>" + (bars || "—") + "</td>";
          body.appendChild(tr);
        }
        const releases = view.ui.table("releases").querySelector("tbody");
        releases.innerHTML = "";
        for (const release of schedule.releases) {
          const tr = document.createElement("tr");
          tr.innerHTML = "<td>" + escapeHtml(release.version) + "</td><td>" + escapeHtml(release.date) + "</td>";
          releases.appendChild(tr);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Schedule</span></div>
  </div>

  <div class="container vbox gap-20 resizable" style="width: 720px; height: 420px;">
    <fieldset>
      <legend>Tracks (<span name="horizon"></span>)</legend>
      <table name="tracks">
        <thead>
          <tr><th title="Track"><span class="column-name">Track</span></th><th title="Rate"><span class="column-name">Rate</span></th><th title="Work"><span class="column-name">Work</span></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </fieldset>
    <fieldset>
      <legend>Releases</legend>
      <table name="releases">
        <thead>
          <tr><th title="Version"><span class="column-name">Version</span></th><th title="Date"><span class="column-name">Date</span></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </fieldset>
  </div>
</div>
