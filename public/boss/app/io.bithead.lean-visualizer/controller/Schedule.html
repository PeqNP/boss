<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      const DAY_SPAN = 180;
      const PX_PER_DAY = 8;

      let schedule = null;

      /**
       * Opens Manage Releases. A change redraws the chart.
       */
      async function openReleases() {
        const win = await $(app.controller).loadController("Releases");
        win.ui.show(function(ctrl) {
          ctrl.configure({ releases: schedule.releases });
          ctrl.delegate = {
            didChangeReleases: function(next) {
              schedule.releases = next.map(function(release) {
                return { id: release.id, version: release.version, date: release.date };
              });
              render();
            }
          };
        });
      }
      this.openReleases = openReleases;

      async function viewDidLoad() {
        schedule = await os.network.get("/api/io.bithead.lean-visualizer/schedule");
        render();
      }
      this.viewDidLoad = viewDidLoad;

      function render() {
        view.ui.span("horizon").textContent = schedule.horizonDays + " days";
        renderGantt();
        renderTracks();
      }

      function renderGantt() {
        const width = DAY_SPAN * PX_PER_DAY;
        const releases = visibleReleases();
        const ticks = [];
        for (let day = 0; day <= DAY_SPAN; day += 28) {
          ticks.push("<span class=\"gantt-tick\" style=\"left:" + (day * PX_PER_DAY) + "px;\">"
            + shortDate(day) + "</span>");
        }
        const rows = schedule.tracks.map(function(track) {
          const bars = (track.bars || []).map(function(bar) {
            return barMarkup(bar);
          }).join("");
          const label = escapeHtml(track.name) + (track.enabled ? "" : " (disabled)");
          return "<div class=\"gantt-row\"><div class=\"gantt-track-label\">" + label
            + "</div><div class=\"gantt-grid\" style=\"width:" + width + "px;\">"
            + bars + poleMarkup(releases) + "</div></div>";
        }).join("");
        view.ui.div("gantt").innerHTML = "<div class=\"gantt-header\"><div class=\"gantt-track-label\">Track</div>"
          + "<div class=\"gantt-grid\" style=\"width:" + width + "px;\">" + ticks.join("")
          + flagMarkup(releases) + poleMarkup(releases) + "</div></div>"
          + rows;
      }

      function renderTracks() {
        const body = view.ui.table("tracks").querySelector("tbody");
        body.innerHTML = "";
        for (const track of schedule.tracks) {
          const tr = document.createElement("tr");
          const bars = track.bars || [];
          const current = bars[0];
          const waiting = Math.max(bars.length - 1, 0);
          const work = isEmpty(current)
            ? "—"
            : escapeHtml(current.name) + (waiting > 0 ? " · " + waiting + " queued" : "");
          tr.innerHTML = "<td>" + escapeHtml(track.name) + "</td>"
            + "<td>" + track.capacity + "</td>"
            + "<td>" + work + "</td>";
          body.appendChild(tr);
        }
      }

      function visibleReleases() {
        const found = [];
        for (const release of schedule.releases || []) {
          const day = daysFromToday(release.date);
          if (!isNumeric(day) || day < 0 || day > DAY_SPAN) {
            continue;
          }
          found.push({
            left: day * PX_PER_DAY,
            version: release.version,
            date: release.date
          });
        }
        found.sort(function(a, b) { return a.left - b.left; });
        return found;
      }

      function poleMarkup(releases) {
        return releases.map(function(release) {
          return "<div class=\"release-pole\" style=\"left:" + release.left + "px;\" title=\""
            + escapeHtml(release.version + " " + release.date) + "\"></div>";
        }).join("");
      }

      function flagMarkup(releases) {
        return releases.map(function(release) {
          return "<div class=\"release-flag\" style=\"left:" + release.left + "px;\"><strong>"
            + escapeHtml(release.version) + "</strong> " + escapeHtml(release.date) + "</div>";
        }).join("");
      }

      function shortDate(dayOffset) {
        const value = new Date();
        value.setHours(0, 0, 0, 0);
        value.setDate(value.getDate() + dayOffset);
        return (value.getMonth() + 1) + "/" + value.getDate();
      }

      function barMarkup(bar) {
        const start = daysFromToday(bar.startOn);
        const finish = daysFromToday(bar.finishOn);
        if (!isNumeric(start) || !isNumeric(finish) || start > DAY_SPAN) {
          return "";
        }
        const duration = Math.max(finish - start, 0.5);
        const left = Math.max(start, 0) * PX_PER_DAY;
        const width = Math.max(6, Math.min(duration, DAY_SPAN - Math.max(start, 0)) * PX_PER_DAY);
        return "<div class=\"gantt-bar\" title=\"" + escapeHtml(bar.name) + "\" style=\"left:"
          + left + "px;width:" + width + "px;background:" + bar.color + ";\">"
          + escapeHtml(bar.name) + "</div>";
      }

      function daysFromToday(iso) {
        if (isEmpty(iso)) {
          return NaN;
        }
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(iso + "T00:00:00");
        return Math.round((target.getTime() - today.getTime()) / 86400000);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;");
      }
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Schedule</span></div>
  </div>

  <div class="container vbox gap-20 resizable" style="width: 1100px; height: 720px;">
    <div class="hbox gap-10">
      <button class="primary" onclick="$(this.controller).openReleases();">Manage Releases</button>
    </div>
    <div class="gantt-wrap">
      <div name="gantt" class="gantt"></div>
    </div>
    <fieldset>
      <legend>Tracks (<span name="horizon"></span>)</legend>
      <table name="tracks">
        <thead>
          <tr><th title="Track"><span class="column-name">Track</span></th><th title="Rate"><span class="column-name">Rate</span></th><th title="Work"><span class="column-name">Work</span></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </fieldset>
  </div>
</div>
