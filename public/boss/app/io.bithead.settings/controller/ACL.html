<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {
      // The user to configure ACL for
      let user;

      // The full ACL tree
      let acl;

      // The bundle ID of the currently selected app
      let bundleId;
      // The license for the currently selected app
      let license = null;
      // Every role the user holds, across all apps
      let userRoles = [];
      // The roles the selected app declares
      let appRoles = [];

      let delegate = protocol(
        "ACLDelegate", this, "delegate",
        ["didSaveACL", "didCancelACL"]
      );

      async function save() {
        if (isEmpty(bundleId)) {
          console.log("Will not save when no app bundle has been selected.");
          return;
        }

        let issueLicense = view.ui.input("issue-license").checked;

        let addRoles = [];
        for (let check of view.ui.div("roles").querySelectorAll(".acl-role input")) {
          if (check.checked) {
            addRoles.push(check.data.id);
          }
        }

        // Only this app's roles are on screen, so only this app's roles may be
        // taken away. `userRoles` carries every app's.
        let removeRoles = [];
        for (let role of appRoles) {
          if (!addRoles.includes(role.id)) {
            removeRoles.push(role.id);
          }
        }

        let body = {
          userId: parseInt(user.id),
          bundleId: bundleId,
          issueLicense: issueLicense,
          addRoles: addRoles,
          removeRoles: removeRoles
        };
        try {
          await os.network.post(`/account/assign-acl`, body);
        }
        catch {
          os.ui.showError("Failed to assign ACL. Please try again later.");
          return;
        }
        delegate.didSaveACL();
        view.ui.close();
      }
      this.save = save;

      function cancel() {
        delegate.didCancelACL();
        view.ui.close();
      }
      this.cancel = cancel;

      function configure(_user) {
        user = _user;
      }
      this.configure = configure;

      async function loadUserAcl() {
        let body = {
          userId: parseInt(user.id),
          bundleId: bundleId
        };
        let response;
        try {
          response = await os.network.post(`/account/user-acl`, body);
        }
        catch {
          os.ui.showError("Failed to load ACL. Please try again later.");
          return;
        }

        license = response.license;
        userRoles = response.roles;
      }

      async function loadAclTree() {
        let response;
        try {
          response = await os.network.get("/account/acl-tree");
        }
        catch {
          os.ui.showError("Failed to load ACL. Please try again later.");
          return;
        }

        acl = response;

        // TODO: Show the app's name over the bundle ID(?)
        let options = [];
        for (catalog of acl.tree.catalogs) {
          for (app of catalog.apps) {
            options.push(app);
          }
        }
        view.ui.select("apps").ui.addNewOptions(options, new UIChoiceConfig(true));
      }

      /// What a role holds, as one line per feature.
      ///
      /// Read only. A role is granted whole, so ticking a permission within it
      /// would mean nothing.
      function makeRoleDetail(role, into) {
        for (let feature of role.features) {
          // `ui.fragment` hands back the fragment's own element, so this is
          // the `li` rather than something holding one.
          let frag = view.ui.fragment("acl-role-feature-fragment");
          let names = feature.permissions.map(p => p.name).join(", ");
          frag.textContent = `${feature.name}: ${names}`;
          into.appendChild(frag);
        }
      }

      async function viewDidLoad() {
        if (isEmpty(user)) {
          os.ui.showError("The ACL form must be configured with a User ID.");
          return;
        }

        document.getElementById("acl-user").innerHTML = `<b>User:</b> ${user.name}`;

        view.ui.select("apps").ui.delegate = {
          didSelectListBoxOption: async function (option) {
            bundleId = option.text;
            appRoles = option.data.roles;

            // ACL must be loaded before ticking anything
            await loadUserAcl();

            let rs = view.ui.div("roles");
            let existing = rs.querySelectorAll(".acl-role");
            if (existing.length > 0) {
              rs.removeChild(...existing);
            }

            for (let role of appRoles) {
              let frag = view.ui.fragment("acl-role-fragment");
              let check = frag.querySelector("input");
              check.setAttribute("id", `acl-role-${role.id}`);
              check.data = role;
              check.checked = userRoles.includes(role.id);
              let label = frag.querySelector("label");
              label.setAttribute("for", `acl-role-${role.id}`);
              label.textContent = role.name;
              makeRoleDetail(role, frag.querySelector(".acl-role-features"));
              rs.appendChild(frag);
            }

            view.ui.input("issue-license").checked = !isEmpty(license);
          }
        };

        loadAclTree();
      }
      this.viewDidLoad = viewDidLoad;

      this.didHitEnter = save;
    }
  </script>
  <div class="ui-menus">
    <div class="ui-menu" style="width: 180px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).save();">Save</option>
        <option class="group"></option>
        <option onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>
  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>ACL</span></div>
    <div class="zoom-button"></div>
  </div>
  <div class="container vbox gap-10" style="width: 550px">
    <div class="hbox gap-10" style="height: 300px;">
      <div class="vbox ratio-1 gap-5">
        <h2>Apps</h2>
        <div class="ui-list-box">
          <select name="apps"></select>
        </div>
      </div>

      <div class="vbox ratio-1 gap-5">
        <h2>Roles</h2>
        <div name="roles" class="vbox gap-separator scrollable bordered expanded"></div>
      </div>
    </div>

    <div class="checkbox-field">
      <input type="checkbox" name="issue-license" id="issue-license"> <label for="issue-license">Issue license</label>
    </div>

    <div class="controls separated align-left">
      <div class="text align-left" style="flex: 1;"><p id="acl-user" ></p></div>
      <div>
        <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
        <button class="default" onclick="$(this.controller).save();">Save</button>
      <div>
    </div>
  </div>
  <fragment id="acl-role-fragment">
    <div class="acl-role" style="padding: 5px;">
      <div class="checkbox-field"><input type="checkbox"> <label></label></div>
      <ul class="acl-role-features" style="margin-left: 18px;"></ul>
    </div>
  </fragment>
  <fragment id="acl-role-feature-fragment">
    <li class="acl-role-feature"></li>
  </fragment>
</div>
