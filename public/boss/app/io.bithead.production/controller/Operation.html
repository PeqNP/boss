<div class="ui-window">
  <script type="text/javascript">

    /**
     * @param {number} productionLineId - Line the operation belongs to
     * @param {number?} operationId - `null` creates a new operation
     */
    function OperationConfig(productionLineId, operationId) {
      property(this, "productionLineId", productionLineId);
      // `null` creates a new operation.
      property(this, "operationId", operationId);
    }

    function $(this.id)(view) {

      let config = null;

      // Set from `config`, then again after a new operation is created — the
      // sections API needs an operation that exists.
      let operationId = null;

      // Sections as last loaded from the server. Order here is render order
      // for the operator.
      let sections = [];

      // SectionDelegate
      let sectionDelegate = {
        didSaveSection: reload,
        didDeleteSection: reload
      };

      // OperationDelegate
      let delegate = protocol(
        "OperationDelegate", this, "delegate",
        [
          /**
           * @param {object} operation - The saved operation.
           */
          "didSaveOperation",
          /**
           * @param {number} operationId - The deleted operation's ID.
           */
          "didDeleteOperation"
        ]
      );

      // --- Private helpers ---

      /**
       * One-line summary of a section, for the table.
       *
       * @param {object} section
       * @returns {string}
       */
      function sectionSummary(section) {
        if (section.type === "description") {
          // Collapse newlines: the list box shows a single line and clips the
          // rest with an ellipsis.
          return isEmpty(section.body) ? "" : section.body.replace(/\s+/g, " ").trim();
        }
        if (section.type === "image") {
          if (isEmpty(section.imagePath)) {
            return "No image uploaded";
          }
          return section.imagePath;
        }
        let summary = section.name + " — " + section.label;
        if (section.required) {
          summary = summary + " · required";
        }
        if (section.options.length > 0) {
          summary = summary + " · " + section.options.join(" / ");
        }
        return summary;
      }

      /**
       * Commit a new section order after a drag. Returning the promise lets the
       * list box hold the row until the server accepts the move.
       *
       * @param {HTMLElement[]} options - Options being moved
       * @param {number} position - Proposed index
       * @returns {Promise}
       */
      async function didChangePositionOfSections(options, position) {
        const ids = sections.map(function(section) { return section.id; });
        const moved = options.map(function(option) { return parseInt(option.value); });
        const remaining = ids.filter(function(id) { return !moved.includes(id); });
        remaining.splice(position, 0, ...moved);
        await commitOrder(remaining);
      }
      this.didChangePositionOfSections = didChangePositionOfSections;

      /**
       * Commit a new section order.
       *
       * @param {number[]} sectionIds - Section IDs in their new order
       */
      async function commitOrder(sectionIds) {
        let response;
        try {
          response = await os.network.post(
            `/api/io.bithead.production/operation/${operationId}/sections/order`,
            { sectionIds }
          );
        }
        catch {
          os.ui.showError("Failed to reorder sections. Please try again later.");
          return;
        }
        // A fork replaced every section ID; reload rather than trust the list.
        if (response.forked) {
          await reload();
          return;
        }
        sections = response.sections;
        renderSections();
      }

      function renderSections() {
        view.ui.select("sections").ui.addNewOptions(
          sections.map(function(section) {
            return {
              id: String(section.id),
              name: section.type + " — " + sectionSummary(section),
              data: section
            };
          })
        );
        view.ui.button("delete-section-btn").disabled = sections.length === 0;
      }

      // --- Controller functions ---

      async function addSection() {
        if (isEmpty(operationId)) {
          os.ui.showAlert("Save the operation before adding sections.");
          return;
        }
        const win = await $(app.controller).loadController("Section");
        win.ui.show(function(ctrl) {
          ctrl.configure({ operationId: operationId, sectionId: null });
          ctrl.delegate = sectionDelegate;
        });
      }
      this.addSection = addSection;

      /**
       * @param {number?} [sectionId] - Defaults to the selected section
       */
      async function editSection(sectionId) {
        if (isEmpty(sectionId)) {
          sectionId = parseInt(view.ui.select("sections").ui.selectedValue());
        }
        if (!isNumeric(sectionId)) {
          return;
        }
        const win = await $(app.controller).loadController("Section");
        win.ui.show(function(ctrl) {
          ctrl.configure({ operationId: operationId, sectionId: sectionId });
          ctrl.delegate = sectionDelegate;
        });
      }
      this.editSection = editSection;

      /**
       * Delete the selected section.
       */
      async function deleteSection() {
        const sectionId = parseInt(view.ui.select("sections").ui.selectedValue());
        if (!isNumeric(sectionId)) {
          return;
        }
        os.ui.showDelete("Delete this section?", null, async function() {
          let response;
          try {
            response = await os.network.delete(`/api/io.bithead.production/section/${sectionId}`);
          }
          catch {
            os.ui.showError("Failed to delete the section. Please try again later.");
            return;
          }
          await reload();
        });
      }
      this.deleteSection = deleteSection;

      /**
       * Render the operation the way an operator will read it, with tokens
       * resolved against sample values.
       */
      /**
       * One section as the operator will see it. Input sections are built
       * through the component factory and disabled — this is a preview, not
       * a working form.
       *
       * @param {object} section - Rendered by the server; tokens are resolved
       * @returns {HTMLElement}
       */
      function previewElement(section) {
        if (section.type === "description") {
          const element = document.createElement("div");
          element.classList.add("mfg-section-description");
          element.innerText = section.body;
          return element;
        }
        if (section.type === "image") {
          const element = document.createElement("div");
          if (isEmpty(section.imagePath)) {
            element.innerText = "[no image uploaded]";
            return element;
          }
          element.classList.add("mfg-section-image");
          const image = document.createElement("img");
          image.src = section.imagePath;
          element.appendChild(image);
          return element;
        }

        const name = "preview-" + section.id;
        if (section.type === "checkbox") {
          const element = os.ui.makeCheckbox(name, section.label);
          element.querySelector("input").disabled = true;
          return element;
        }
        if (section.type === "options") {
          const choices = section.options.map(function(option) {
            return { id: option, name: option };
          });
          const element = os.ui.makePopupMenu(name, section.label, "Select one", choices,
                                              { classes: "stacked", width: "100%" });
          element.querySelector("select").ui.disable();
          return element;
        }
        const element = os.ui.makeTextField(name, section.label,
                                            { type: section.type === "number" ? "number" : "text" });
        element.querySelector("input").disabled = true;
        return element;
      }

      async function preview() {
        if (isEmpty(operationId)) {
          os.ui.showAlert("Save the operation before previewing it.");
          return;
        }
        let rendered;
        try {
          rendered = await os.network.get(
            `/api/io.bithead.production/operation/${operationId}/preview`
          );
        }
        catch {
          os.ui.showError("Failed to render the preview. Please try again later.");
          return;
        }
        const container = view.ui.div("preview-body");
        container.innerHTML = "";
        for (const section of rendered) {
          container.appendChild(previewElement(section));
        }
      }
      this.preview = preview;

      async function save() {
        const name = view.ui.inputValue("operation-name", "Please provide an operation name.");
        if (isEmpty(name)) {
          return;
        }
        let response;
        try {
          if (isEmpty(operationId)) {
            response = await os.network.post(
              `/api/io.bithead.production/production-line/${config.productionLineId}/operation`,
              { name }
            );
          }
          else {
            response = await os.network.put(
              `/api/io.bithead.production/operation/${operationId}`,
              { name }
            );
          }
        }
        catch {
          os.ui.showError("Failed to save the operation. Please try again later.");
          return;
        }
        delegate.didSaveOperation(response);
        view.ui.close();
      }
      this.save = save;

      function _delete() {
        os.ui.showDelete(
          "Delete this operation and all of its sections?",
          null,
          async function() {
            try {
              await os.network.delete(`/api/io.bithead.production/operation/${operationId}`);
            }
            catch {
              os.ui.showError("Failed to delete the operation. Please try again later.");
              return;
            }
            delegate.didDeleteOperation(operationId);
            view.ui.close();
          }
        );
      }
      this.delete = _delete;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      /**
       * @param {OperationConfig} _config
       */
      function configure(_config) {
        config = _config;
        operationId = isEmpty(_config?.operationId) ? null : parseInt(_config.operationId);
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        if (isEmpty(config?.productionLineId)) {
          throw new Error("Operation: productionLineId is required");
        }
        // Creating: there is nothing to load, and no operation to delete.
        // Sections cannot be added until it has been saved and has an ID.
        if (isEmpty(config.operationId)) {
          view.ui.button("delete-btn").remove();
          view.ui.menu("file-menu").removeOption("delete");
          return;
        }
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        view.ui.input("operation-name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      async function reload() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.production/operation/${operationId}`);
        }
        catch {
          os.ui.showError("Failed to load the operation. Please try again later.");
          return;
        }
        sections = response.sections;
        view.ui.input("operation-name").value = response.name;
        renderSections();
      }
      this.reload = reload;

      // --- OS listeners ---

      this.didHitEnter = save;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option value="save" onclick="$(this.controller).save();">Save</option>
        <option value="delete" onclick="$(this.controller).delete();">Delete</option>
        <option value="cancel" onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Operation</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 600px;">

    <div class="vbox gap-10">
      <div class="text-field">
        <label for="operation-name">Name</label>
        <input type="text" name="operation-name" autocomplete="new-password">
      </div>
    </div>

    <fieldset>
      <legend>Sections</legend>
      <div class="vbox gap-10">
        <p>Sections render top to bottom in the order below. Drag to reorder,
           double-click to edit.</p>
        <div class="hbox gap-10">
          <div class="ui-list-box sortable" style="width: 100%; height: 160px;">
            <select name="sections"></select>
          </div>
          <div class="controls-right separated">
            <div class="vbox gap-10">
              <button class="primary" onclick="$(this.controller).addSection();">Add</button>
            </div>
            <div class="vbox gap-10">
              <button name="delete-section-btn" class="primary" disabled onclick="$(this.controller).deleteSection();">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </fieldset>

    <details name="preview">
      <summary onclick="$(this.controller).preview();">Preview</summary>
      <div name="preview-body" class="vbox gap-10" style="padding-top: 10px;"></div>
    </details>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button name="delete-btn" class="primary" onclick="$(this.controller).delete();">Delete</button>
      <button class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
