<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      let lineId = null;
      let jobId = null;

      // The unit this operator holds, or `null` when the queue is empty.
      let workUnit = null;

      // Operations for this unit, in order, each with its own state, notes,
      // captured values, and sections.
      let operations = [];

      // Sections arrive with every token already resolved. The server is the
      // only renderer, so what an operator reads here and what an admin sees
      // in the preview cannot drift.

      // The step being displayed. Not always the step being worked — an
      // operator may navigate back to a completed step and edit it.
      let displayedStep = null;

      // Open LineBlocked window, so an admin clearing the block from the
      // dashboard can close it without the operator touching anything.
      let blockedWindow = null;

      // --- Private helpers ---

      /**
       * @returns {object?} The operation being displayed
       */
      function displayedOperation() {
        if (isEmpty(displayedStep)) {
          return null;
        }
        return operations.find(function(o) { return o.step === displayedStep; });
      }

      /**
       * The first step that has not been completed. This is the step the
       * operator is actually working; everything after it is locked.
       *
       * @returns {number} Step number, or one past the last when all are done
       */
      function currentStep() {
        const pending = operations.find(function(o) { return o.state !== "complete"; });
        if (isEmpty(pending)) {
          return operations.length + 1;
        }
        return pending.step;
      }

      /**
       * Sections that capture a value. Description and image sections do not.
       *
       * @param {object} operation
       * @returns {object[]}
       */
      function inputSections(operation) {
        return operation.sections.filter(function(section) {
          return !isEmpty(section.name);
        });
      }

      /**
       * Read what the operator has entered on the displayed operation.
       *
       * @returns {object} `{sectionName: value}`
       */
      function collectValues() {
        const operation = displayedOperation();
        const values = {};
        if (isEmpty(operation)) {
          return values;
        }
        for (const section of inputSections(operation)) {
          const name = "section-" + section.id;
          if (section.type === "options") {
            values[section.name] = view.ui.select(name)?.ui.selectedValue();
            continue;
          }
          const field = view.ui.input(name);
          if (isEmpty(field)) {
            continue;
          }
          if (section.type === "checkbox") {
            values[section.name] = field.checked;
            continue;
          }
          values[section.name] = field.value;
        }
        return values;
      }

      /**
       * Every required section on the displayed operation has a value.
       *
       * @returns {boolean}
       */
      function requiredSectionsFilled() {
        const operation = displayedOperation();
        if (isEmpty(operation)) {
          return false;
        }
        const values = collectValues();
        for (const section of inputSections(operation)) {
          if (!section.required) {
            continue;
          }
          const value = values[section.name];
          if (section.type === "checkbox") {
            if (value !== true) {
              return false;
            }
            continue;
          }
          if (isEmpty(value)) {
            return false;
          }
        }
        return true;
      }

      /**
       * A revisited step saves as an edit, which resets every later step, so
       * the primary button says what it will actually do.
       */
      function updateActionButtons() {
        const operation = displayedOperation();
        const complete = view.ui.button("complete-btn");
        const fail = view.ui.button("fail-btn");
        if (isEmpty(operation)) {
          complete.disabled = true;
          fail.disabled = true;
          return;
        }
        const isRevisit = operation.state === "complete";
        complete.replaceChildren(isRevisit ? "Save changes" : "Complete");
        complete.disabled = !requiredSectionsFilled();
        fail.disabled = false;
      }

      /**
       * Build one section as a styled element.
       *
       * Input sections go through the component factory so they arrive with
       * their `ui` interface attached — the window's styling pass ran when the
       * line opened, long before this operation was rendered.
       *
       * @param {object} section
       * @param {object} values - Captured values for this operation
       * @returns {HTMLElement}
       */
      function sectionElement(section, values) {
        if (section.type === "description") {
          const element = document.createElement("div");
          element.classList.add("mfg-section-description");
          element.innerText = section.body;
          return element;
        }
        if (section.type === "image") {
          const element = document.createElement("div");
          element.classList.add("mfg-section-image");
          const image = document.createElement("img");
          image.src = section.imagePath;
          element.appendChild(image);
          return element;
        }

        const name = "section-" + section.id;
        const value = values[section.name];

        if (section.type === "checkbox") {
          const element = os.ui.makeCheckbox(name, section.label);
          element.querySelector("input").checked = value === true;
          return element;
        }
        if (section.type === "options") {
          const choices = section.options.map(function(option) {
            return { id: option, name: option };
          });
          const element = os.ui.makePopupMenu(name, section.label, "Select one", choices,
                                              { classes: "stacked", width: "100%" });
          if (!isEmpty(value)) {
            element.querySelector("select").ui.selectValue(value);
          }
          return element;
        }
        const element = os.ui.makeTextField(name, section.label,
                                            { type: section.type === "number" ? "number" : "text" });
        element.querySelector("input").value = isEmpty(value) ? "" : value;
        return element;
      }

      /**
       * Draw one operation into the right-hand pane.
       *
       * @param {number} step
       */
      function renderOperation(step) {
        displayedStep = step;
        const operation = displayedOperation();
        if (isEmpty(operation)) {
          return;
        }

        const banner = view.ui.div("revisit-banner");
        if (operation.state === "complete") {
          banner.style.display = "";
          banner.innerText = "This step is already complete. Saving a change here resets every step after it.";
        }
        else {
          banner.style.display = "none";
        }

        const container = view.ui.div("sections");
        container.innerHTML = "";
        for (const section of operation.sections) {
          container.appendChild(sectionElement(section, operation.values));
        }

        // Native inputs bubble, so one listener on the pane covers text,
        // number, and checkbox sections.
        container.oninput = updateActionButtons;
        container.onchange = updateActionButtons;

        // A UIPopupMenu calls `select.onchange()` directly rather than
        // dispatching an event, so nothing bubbles — each menu is wired
        // individually.
        for (const section of inputSections(operation)) {
          if (section.type !== "options") {
            continue;
          }
          view.ui.select("section-" + section.id).onchange = updateActionButtons;
        }

        view.ui.textarea("notes").value = isEmpty(operation.notes) ? "" : operation.notes;
        updateActionButtons();
      }

      /**
       * Draw the step list. Completed steps carry a checkmark, the step being
       * worked carries an arrow, and steps beyond it are marked as locked —
       * operations are performed in order.
       */
      function renderSteps() {
        const working = currentStep();
        const listBox = view.ui.select("steps").ui;
        listBox.addNewOptions(
          operations.map(function(operation) {
            let mark = "     ";
            if (operation.state === "complete") {
              mark = "✓  ";
            }
            else if (operation.step === working) {
              mark = "▶  ";
            }
            return {
              id: String(operation.step),
              name: mark + operation.step + ". " + operation.name,
              data: operation,
              // A later step is greyed out and cannot be selected, so its
              // description cannot be opened. Operations run in order.
              disabled: operation.step > working
            };
          })
        );
        // `selectValue` maps the option's value to its index. `selectOption`
        // takes an index, and these options are keyed by 1-based step number.
        listBox.selectValue(String(Math.min(working, operations.length)));
      }

      /**
       * Draw everything for the unit this operator holds.
       */
      function renderWorkUnit() {
        view.ui.div("line-body").style.display = "";
        view.ui.div("empty-queue").style.display = "none";
        view.ui.span("unit-label").innerText = workUnit.label;
        renderSteps();
      }

      /**
       * The queue has nothing left for this operator. Their supplies must go
       * back, so they are listed explicitly.
       *
       * @param {object[]} resources - `{pool, resource, value}`
       */
      function renderEmptyQueue(resources) {
        workUnit = null;
        view.ui.div("line-body").style.display = "none";
        view.ui.div("empty-queue").style.display = "";
        view.ui.span("unit-label").innerText = "";
        let text = "No more work units remaining in the queue.";
        if (!isEmpty(resources) && resources.length > 0) {
          text = text + "\n\nPlease return:\n" + resources.map(function(r) {
            return "  " + r.resource + " (" + r.pool + ")";
          }).join("\n");
        }
        view.ui.p("empty-message").innerText = text;
      }

      /**
       * Cover the line with the blocking modal.
       *
       * @param {object} blocked - `{kind, origin, reason}`
       */
      async function showBlocked(blocked) {
        if (!isEmpty(blockedWindow)) {
          return;
        }
        const win = await $(app.controller).loadController("LineBlocked");
        blockedWindow = win;
        win.ui.show(function(ctrl) {
          ctrl.configure(blocked);
          ctrl.delegate = { didClearBlock: didClearBlock };
        });
      }

      /**
       * Remove the blocking modal. Called when the operator clears the block
       * and when an admin clears it from the dashboard.
       */
      function hideBlocked() {
        if (isEmpty(blockedWindow)) {
          return;
        }
        blockedWindow.ui.close();
        blockedWindow = null;
      }

      // --- Controller functions ---

      /**
       * @param {HTMLOption} option - The selected step option
       */
      function didSelectStep(option) {
        const operation = option?.data;
        if (isEmpty(operation)) {
          return;
        }
        renderOperation(operation.step);
      }
      this.didSelectStep = didSelectStep;

      /**
       * Complete the displayed step, or save an edit to an already-completed
       * one. An edit resets every later step, so it is confirmed first.
       */
      async function complete() {
        const operation = displayedOperation();
        if (isEmpty(operation)) {
          return;
        }
        const payload = { values: collectValues(), notes: view.ui.textarea("notes").value };

        if (operation.state !== "complete") {
          let response;
          try {
            response = await os.network.post(
              `/api/io.bithead.production/work-unit/${workUnit.id}/operation/${operation.step}/complete`,
              payload
            );
          }
          catch {
            os.ui.showError("Failed to complete this operation. Please try again later.");
            return;
          }
          if (response.unitComplete) {
            await pullNext();
            return;
          }
          await reload();
          return;
        }

        const laterSteps = operations.length - operation.step;
        os.ui.showDelete(
          "Save this change? The " + laterSteps + " step(s) after it will be reset and must be completed again.",
          null,
          async function() {
            try {
              await os.network.post(
                `/api/io.bithead.production/work-unit/${workUnit.id}/operation/${operation.step}/edit`,
                payload
              );
            }
            catch {
              os.ui.showError("Failed to save the change. Please try again later.");
              return;
            }
            await reload();
          }
        );
      }
      this.complete = complete;

      /**
       * Fail the work unit at the displayed step. Notes are required so the
       * record says why.
       */
      async function fail() {
        const operation = displayedOperation();
        if (isEmpty(operation)) {
          return;
        }
        const notes = view.ui.textarea("notes").value;
        if (isEmpty(notes)) {
          os.ui.showAlert("Please describe what went wrong in the notes before failing this work unit.");
          view.ui.textarea("notes").focus();
          return;
        }
        os.ui.showDelete(
          "Fail this work unit? It leaves the queue and you move on to the next one.",
          null,
          async function() {
            try {
              await os.network.post(
                `/api/io.bithead.production/work-unit/${workUnit.id}/operation/${operation.step}/fail`,
                { values: collectValues(), notes }
              );
            }
            catch {
              os.ui.showError("Failed to record the failure. Please try again later.");
              return;
            }
            await pullNext();
          }
        );
      }
      this.fail = fail;

      /**
       * Raise the andon. The reason is optional but goes to the dashboard.
       */
      async function stopLine() {
        const win = await $(app.controller).loadController("StopLine");
        win.ui.show(function(ctrl) {
          ctrl.delegate = { didStopLine: didStopLine };
        });
      }
      this.stopLine = stopLine;

      /**
       * @param {string} reason - The operator's reason. May be empty.
       */
      async function didStopLine(reason) {
        try {
          await os.network.post(`/api/io.bithead.production/line/${lineId}/stop`, { reason });
        }
        catch {
          os.ui.showError("Failed to stop the line. Please tell your line manager directly.");
          return;
        }
        await showBlocked({ kind: "stopped", origin: "operator", reason: reason });
      }
      this.didStopLine = didStopLine;

      async function pause() {
        try {
          await os.network.post(`/api/io.bithead.production/line/${lineId}/pause`);
        }
        catch {
          os.ui.showError("Failed to pause the line. Please try again later.");
          return;
        }
        await showBlocked({ kind: "paused", origin: "operator", reason: null });
      }
      this.pause = pause;

      /**
       * The operator cleared their own block. A block a manager raised has no
       * button, so this only ever runs for operator-raised blocks.
       */
      async function didClearBlock() {
        blockedWindow = null;
        const state = await loadState();
        if (isEmpty(state)) {
          return;
        }
        const action = state.state === "stopped" ? "resume-line" : "resume";
        try {
          await os.network.post(`/api/io.bithead.production/line/${lineId}/${action}`);
        }
        catch {
          os.ui.showError("Failed to resume the line. Please try again later.");
          return;
        }
        await reload();
      }
      this.didClearBlock = didClearBlock;

      /**
       * Leave the job: releases the work unit with its progress kept, returns
       * every pool resource, and closes the line.
       */
      async function leaveLine() {
        let message = "Leave this line? Your supplies are returned and you are taken off this job.";
        if (!isEmpty(workUnit)) {
          message = "Leave this line? Your work unit is released with its progress kept, " +
                    "your supplies are returned, and you are taken off this job.";
        }
        os.ui.showDelete(message, null, async function() {
          let response;
          try {
            response = await os.network.post(`/api/io.bithead.production/line/${lineId}/leave`);
          }
          catch {
            os.ui.showError("Failed to leave the line. Please try again later.");
            return;
          }
          if (!isEmpty(response.resources) && response.resources.length > 0) {
            await os.ui.showAlert("Please return: " + response.resources.map(function(r) {
              return r.resource + " (" + r.pool + ")";
            }).join(", "));
          }
          hideBlocked();
          view.ui.close();
        });
      }
      this.leaveLine = leaveLine;

      // --- Configure ---

      /**
       * @param {number} _lineId
       */
      function configure(_lineId) {
        lineId = parseInt(_lineId);
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        if (isEmpty(lineId)) {
          throw new Error("ManufacturingLine: lineId is required");
        }
        view.ui.select("steps").ui.delegate = {
          didSelectListBoxOption: didSelectStep
        };
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      /**
       * Closing the window pauses the line rather than leaving it. The work
       * unit and supplies stay assigned so the operator resumes exactly where
       * they left off.
       */
      async function viewWillUnload() {
        if (isEmpty(workUnit)) {
          return;
        }
        // Fire and forget — the window is going away either way.
        os.network.post(`/api/io.bithead.production/line/${lineId}/pause`, { origin: "window" });
      }
      this.viewWillUnload = viewWillUnload;

      /**
       * @returns {object?} The line's state, or `null` when it failed to load
       */
      async function loadState() {
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.production/line/${lineId}/state`);
        }
        catch {
          os.ui.showError("Failed to load your line. Please try again later.");
          return null;
        }
        return response;
      }

      async function reload() {
        const state = await loadState();
        if (isEmpty(state)) {
          return;
        }
        jobId = state.jobId;

        // A manager removed this operator from the job. Their unit and their
        // resources are already back; what is left is a screen for a line they
        // are no longer on, and the pull below would ask it for more work.
        if (state.state === "left") {
          hideBlocked();
          os.ui.showAlert("Your line manager removed you from this job.");
          view.ui.close();
          return;
        }

        view.ui.span("job-name").innerText = state.jobName;

        // A block covers the line no matter what else is going on.
        if (isEmpty(state.blocked)) {
          hideBlocked();
        }
        else {
          await showBlocked(state.blocked);
        }

        // No unit held — take the next one off the queue.
        if (isEmpty(state.workUnit)) {
          await pullNext();
          return;
        }
        workUnit = state.workUnit;
        operations = state.operations;
        renderWorkUnit();
      }
      this.reload = reload;

      /**
       * Claim the next work unit, or show the terminal screen when the queue
       * has nothing left.
       */
      async function pullNext() {
        let response;
        try {
          response = await os.network.post(`/api/io.bithead.production/line/${lineId}/pull`);
        }
        catch {
          os.ui.showError("Failed to pull the next work unit. Please try again later.");
          return;
        }
        if (response.empty === true) {
          renderEmptyQueue(response.resources);
          return;
        }
        workUnit = response.workUnit;
        operations = response.operations;
        renderWorkUnit();
      }
      this.pullNext = pullNext;

      // --- OS listeners ---

      this.events = {
        // A manager pausing, stopping, or clearing this line arrives here.
        "io.bithead.production.line-status": async function(event) {
          if (parseInt(event.data.lineId) !== lineId) {
            return;
          }
          await reload();
        },
        // Stopping the job pauses every operator on it.
        "io.bithead.production.job-status": async function(event) {
          if (parseInt(event.data.jobId) !== jobId) {
            return;
          }
          await reload();
        }
      };
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 160px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).complete();">Complete Operation</option>
        <option onclick="$(this.controller).fail();">Fail Work Unit</option>
        <option class="group"></option>
        <option onclick="$(this.controller).pause();">Pause</option>
        <option onclick="$(this.controller).stopLine();">Stop Line</option>
        <option onclick="$(this.controller).leaveLine();">Leave Line</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Manufacturing Line</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-10 mfg-line">

    <div class="mfg-header">
      <div class="vbox mfg-unit-label">
        <span name="job-name"></span>
        <span name="unit-label" style="font-family: ChicagoFLF;"></span>
      </div>
      <button class="primary" onclick="$(this.controller).leaveLine();">Leave line</button>
      <button class="primary" onclick="$(this.controller).pause();">Pause</button>
      <button class="primary" onclick="$(this.controller).stopLine();">Stop line</button>
    </div>

    <div name="line-body" class="mfg-body">
      <div class="ui-list-box mfg-steps">
        <select name="steps"></select>
      </div>
      <div class="mfg-operation">
        <div name="revisit-banner" class="mfg-revisit-banner"></div>
        <div name="sections" class="mfg-sections"></div>
        <div class="vbox gap-10">
          <label for="notes">Notes</label>
          <textarea name="notes" style="width: 100%; height: 60px;"></textarea>
        </div>
        <div class="controls">
          <button name="fail-btn" class="primary" onclick="$(this.controller).fail();">Fail</button>
          <button name="complete-btn" class="default" onclick="$(this.controller).complete();">Complete</button>
        </div>
      </div>
    </div>

    <div name="empty-queue" class="mfg-empty">
      <p name="empty-message"></p>
      <div class="controls">
        <button class="default" onclick="$(this.controller).leaveLine();">Leave line</button>
      </div>
    </div>

  </div>
</div>
