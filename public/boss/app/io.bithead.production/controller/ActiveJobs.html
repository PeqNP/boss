<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // The line this operator already holds, if any. A user may hold one
      // line at a time, so this gates every other job's Join button.
      let heldLine = null;

      // --- Private helpers ---

      /**
       * @param {object} job
       * @returns {HTMLElement}
       */
      function buildJobRow(job) {
        const tr = document.createElement("tr");
        const isHeld = !isEmpty(heldLine) && heldLine.jobId === job.jobId;
        let action;
        if (isHeld) {
          action = "<button class='default' onclick='$(this.controller).resume();'>Resume</button>";
        }
        else if (isEmpty(heldLine)) {
          action = "<button class='primary' onclick='$(this.controller).join(" + job.jobId + ");'>Join</button>";
        }
        else {
          action = "<button class='primary' disabled>Join</button>";
        }
        tr.innerHTML =
          "<td>" + job.name + "</td>" +
          "<td>" + job.product + "</td>" +
          "<td>" + job.unitsRemaining + "</td>" +
          "<td>" + action + "</td>";
        return tr;
      }

      // --- Controller functions ---

      /**
       * @param {number} jobId
       */
      async function join(jobId) {
        if (!isEmpty(heldLine)) {
          os.ui.showAlert("You are already on a line for " + heldLine.jobName +
                          ". Leave that line before joining another job.");
          return;
        }
        const win = await $(app.controller).loadController("JoinLine");
        win.ui.show(function(ctrl) {
          ctrl.configure(jobId);
          ctrl.delegate = { didJoinLine: loadJobs };
        });
      }
      this.join = join;

      /**
       * Return to the line this operator already holds, in whatever state
       * they left it.
       */
      async function resume() {
        if (isEmpty(heldLine)) {
          return;
        }
        const win = await $(app.controller).loadController("ManufacturingLine");
        win.ui.show(function(ctrl) {
          ctrl.configure(heldLine.lineId);
        });
      }
      this.resume = resume;

      // --- Lifecycle ---

      async function viewDidLoad() {
        await loadJobs();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadJobs() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.production/active-jobs");
        }
        catch {
          os.ui.showError("Failed to load active jobs. Please try again later.");
          return;
        }
        heldLine = response.heldLine;

        const notice = view.ui.p("held-notice");
        if (isEmpty(heldLine)) {
          notice.style.display = "none";
        }
        else {
          notice.style.display = "";
          notice.innerText = "You are on a line for " + heldLine.jobName +
                             ". Leave that line before joining another job.";
        }

        const body = view.ui.table("jobs-table").querySelector("tbody");
        body.innerHTML = "";
        if (response.jobs.length === 0) {
          body.innerHTML = "<tr><td colspan='4'>No jobs are running right now.</td></tr>";
          return;
        }
        for (const job of response.jobs) {
          body.appendChild(buildJobRow(job));
        }
      }
      this.loadJobs = loadJobs;

      // --- OS listeners ---

      this.events = {
        "io.bithead.production.job-status": async function(event) {
          await loadJobs();
        },
        "io.bithead.production.work-unit": async function(event) {
          await loadJobs();
        }
      };
    }
  </script>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Active Jobs</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">
    <p name="held-notice"></p>
    <table name="jobs-table" style="width: 100%;">
      <thead>
        <tr>
          <th>Job</th>
          <th>Product</th>
          <th>Units left</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
