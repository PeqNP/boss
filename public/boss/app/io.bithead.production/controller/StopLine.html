<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      // StopLineDelegate
      let delegate = protocol(
        "StopLineDelegate", this, "delegate",
        [
          /**
           * @param {string} reason - The operator's reason. May be empty.
           */
          "didStopLine"
        ]
      );

      // --- Controller functions ---

      function stopLine() {
        const reason = view.ui.textarea("reason").value;
        delegate.didStopLine(reason);
        view.ui.close();
      }
      this.stopLine = stopLine;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      // --- Lifecycle ---

      function viewDidAppear() {
        view.ui.textarea("reason").focus();
      }
      this.viewDidAppear = viewDidAppear;

      // --- OS listeners ---

      this.didHitEnter = stopLine;
    }
  </script>

  <div class="title">Stop Line</div>

  <div class="container vbox gap-10" style="width: 380px;">
    <p>Your line manager is notified immediately. Adding a reason helps them
       arrive knowing what is wrong.</p>
    <div class="vbox gap-10">
      <label for="reason">Reason (optional)</label>
      <textarea name="reason" style="width: 100%; height: 80px;"></textarea>
    </div>
    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button class="default" onclick="$(this.controller).stopLine();">Stop line</button>
    </div>
  </div>
</div>
