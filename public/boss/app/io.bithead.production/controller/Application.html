<div class="ui-application">
  <script type="text/javascript">
    function $(this.id)(view) {

      // Set from GET /me. Admin surfaces are hidden when `false`; the server
      // is still the authority on every admin route.
      let isAdmin = false;

      // --- Controller functions ---

      function quit() {
        os.closeApplication('$(app.bundleId)');
      }
      this.quit = quit;

      async function showAbout() {
        const win = await $(this.controller).loadController("About");
        win.ui.show();
      }
      this.showAbout = showAbout;

      async function showActiveJobs() {
        const win = await $(this.controller).loadController("ActiveJobs");
        win.ui.show();
      }
      this.showActiveJobs = showActiveJobs;

      async function showJobs() {
        const win = await $(this.controller).loadController("Jobs");
        win.ui.show();
      }
      this.showJobs = showJobs;

      async function showProductionLines() {
        const win = await $(this.controller).loadController("ProductionLines");
        win.ui.show();
      }
      this.showProductionLines = showProductionLines;

      async function showPools() {
        const win = await $(this.controller).loadController("Pools");
        win.ui.show();
      }
      this.showPools = showPools;

      /**
       * Open a job's dashboard. Called from the Jobs list and from deep links.
       *
       * @param {number} jobId
       */
      async function showJobDashboard(jobId) {
        const win = await $(this.controller).loadController("JobDashboard");
        win.ui.show(function(ctrl) {
          ctrl.configure(jobId);
        });
      }
      this.showJobDashboard = showJobDashboard;

      /**
       * Open the caller's manufacturing line for a job, joining first when
       * they do not already hold a line.
       *
       * @param {number} jobId
       */
      async function showLine(jobId) {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.production/active-jobs");
        }
        catch {
          os.ui.showError("Failed to load active jobs. Please try again later.");
          return;
        }
        if (!isEmpty(response.heldLine) && response.heldLine.jobId === jobId) {
          const win = await $(this.controller).loadController("ManufacturingLine");
          win.ui.show(function(ctrl) {
            ctrl.configure(response.heldLine.lineId);
          });
          return;
        }
        const win = await $(this.controller).loadController("JoinLine");
        win.ui.show(function(ctrl) {
          ctrl.configure(jobId);
        });
      }
      this.showLine = showLine;

      // --- Lifecycle ---

      async function applicationDidStart() {
        await os.network.stylesheet(`$(app.resourcePath)/production.css`);

        let response;
        try {
          response = await os.network.get("/api/io.bithead.production/me");
        }
        catch {
          os.ui.showError("Failed to load Production. Please try again later.");
          return;
        }
        isAdmin = response.isAdmin;

        // Admin tools are removed from the menu for operators. The routes
        // themselves are protected server-side.
        if (!isAdmin) {
          const menu = $(this.controller).menus().ui.select("production-menu").ui;
          menu.removeOption("jobs");
          menu.removeOption("production-lines");
          menu.removeOption("pools");
          menu.removeOption("admin-group");
        }

        // An operator already on a line goes straight back to it.
        if (!isEmpty(response.activeLine)) {
          const win = await $(this.controller).loadController("ManufacturingLine");
          win.ui.show(function(ctrl) {
            ctrl.configure(response.activeLine.lineId);
          });
          return;
        }

        if (isAdmin) {
          await showJobs();
          return;
        }
        await showActiveJobs();
      }
      this.applicationDidStart = applicationDidStart;

      // --- OS listeners ---

      // Deep links:
      //   production://jobs            -> Active Jobs
      //   production://job/{jobId}     -> Job Dashboard (admin)
      //   production://line/{jobId}    -> join or resume the caller's line
      this.openDeepLink = async function(deepLink) {
        const segments = deepLink.path.split('/').filter(Boolean);
        if (segments.length === 0) {
          return;
        }
        if (segments[0] === "jobs") {
          await showActiveJobs();
          return;
        }
        if (segments.length < 2) {
          return;
        }
        const jobId = parseInt(segments[1]);
        if (!isNumeric(jobId)) {
          return;
        }
        if (segments[0] === "job") {
          await showJobDashboard(jobId);
          return;
        }
        if (segments[0] === "line") {
          await showLine(jobId);
        }
      };
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 200px;">
      <select name="production-menu">
        <option>Production</option>
        <option value="about" onclick="$(this.controller).showAbout();">About Production</option>
        <option class="group"></option>
        <option value="active-jobs" onclick="$(this.controller).showActiveJobs();">Active Jobs</option>
        <option value="admin-group" class="group"></option>
        <option value="jobs" onclick="$(this.controller).showJobs();">Jobs</option>
        <option value="production-lines" onclick="$(this.controller).showProductionLines();">Production Lines</option>
        <option value="pools" onclick="$(this.controller).showPools();">Pools</option>
        <option class="group"></option>
        <option value="quit" onclick="$(this.controller).quit();">Quit Production</option>
      </select>
    </div>
  </div>

</div>
