<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // ProductionLineDelegate
      let lineDelegate = {
        didSaveProductionLine: loadProductionLines,
        didDeleteProductionLine: loadProductionLines
      };

      // --- Controller functions ---

      async function addProductionLine() {
        const win = await $(app.controller).loadController("ProductionLine");
        win.ui.show(function(ctrl) {
          ctrl.configure(null);
          ctrl.delegate = lineDelegate;
        });
      }
      this.addProductionLine = addProductionLine;

      async function editProductionLine() {
        const value = view.ui.select("production-lines").ui.selectedValue();
        if (isEmpty(value)) {
          return;
        }
        const win = await $(app.controller).loadController("ProductionLine");
        win.ui.show(function(ctrl) {
          ctrl.configure(parseInt(value));
          ctrl.delegate = lineDelegate;
        });
      }
      this.editProductionLine = editProductionLine;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("production-lines").ui.delegate = {
          didSelectListBoxOption: function() {
            view.ui.button("edit-btn").disabled = false;
          },
          didRemoveAllOptions: function() {
            view.ui.button("edit-btn").disabled = true;
          }
        };
        await loadProductionLines();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadProductionLines() {
        let response;
        try {
          // TODO: GET /api/io.bithead.production/production-lines
          response = await os.network.get("/api/io.bithead.production/production-lines");
        }
        catch {
          os.ui.showError("Failed to load production lines. Please try again later.");
          return;
        }
        view.ui.select("production-lines").ui.addNewOptions(
          response.map(function(line) {
            let name = line.name + " (v" + line.version + ") — " + line.operationCount + " operation(s)";
            if (line.inUse) {
              name = name + " · in use";
            }
            return { id: String(line.id), name: name, data: line };
          })
        );
        view.ui.button("edit-btn").disabled = response.length === 0;
      }
      this.loadProductionLines = loadProductionLines;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 180px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).addProductionLine();">Add Production Line</option>
        <option onclick="$(this.controller).editProductionLine();">Edit Production Line</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Production Lines</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 460px;">
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 220px;">
        <select name="production-lines"></select>
      </div>
      <div class="controls-right separated">
        <div class="vbox gap-10">
          <button class="primary" onclick="$(this.controller).addProductionLine();">Add</button>
        </div>
        <div class="vbox gap-10">
          <button name="edit-btn" class="default" disabled onclick="$(this.controller).editProductionLine();">Edit</button>
        </div>
      </div>
    </div>
  </div>
</div>
