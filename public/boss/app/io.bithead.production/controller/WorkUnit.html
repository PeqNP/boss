<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {

      let workUnitId = null;

      // --- Private helpers ---

      /**
       * @param {string?} timestamp - ISO 8601 UTC
       * @returns {string} Local time, or an em dash when absent
       */
      function localTime(timestamp) {
        if (isEmpty(timestamp)) {
          return "—";
        }
        return new Date(timestamp).toLocaleString();
      }

      /**
       * @param {object} operation
       * @returns {string} One operation's log entry as HTML
       */
      function operationHtml(operation) {
        const values = operation.values.map(function(v) {
          return "<div>" + v.label + ": <b>" + v.value + "</b></div>";
        }).join("");
        let notes = "";
        if (!isEmpty(operation.notes)) {
          notes = "<div>Notes: " + operation.notes + "</div>";
        }
        return "<fieldset><legend>" + operation.step + ". " + operation.name + "</legend>" +
               "<div class='vbox'>" +
               "<div>" + operation.state + " · " + localTime(operation.completedAt) +
               " · " + (isEmpty(operation.completedBy) ? "—" : operation.completedBy) + "</div>" +
               values + notes +
               "</div></fieldset>";
      }

      // --- Controller functions ---

      function close() {
        view.ui.close();
      }
      this.close = close;

      // --- Configure ---

      /**
       * @param {number} _workUnitId
       */
      function configure(_workUnitId) {
        workUnitId = parseInt(_workUnitId);
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        if (isEmpty(workUnitId)) {
          throw new Error("WorkUnit: workUnitId is required");
        }
        let response;
        try {
          response = await os.network.get(`/api/io.bithead.production/work-unit/${workUnitId}`);
        }
        catch {
          os.ui.showError("Failed to load the work unit. Please try again later.");
          return;
        }

        view.ui.span("unit-label").innerText = response.label;
        view.ui.span("unit-state").innerText = response.state;

        // Input columns, including any the production line did not declare.
        view.ui.div("unit-input").innerHTML = Object.keys(response.input).map(function(key) {
          return "<div>" + key + ": <b>" + response.input[key] + "</b></div>";
        }).join("");

        const resources = view.ui.div("unit-resources");
        if (response.resources.length === 0) {
          resources.innerText = "No resources were used.";
        }
        else {
          resources.innerHTML = response.resources.map(function(r) {
            return "<div>" + r.pool + ": <b>" + r.resource + "</b> (" + r.value + ")</div>";
          }).join("");
        }

        view.ui.div("unit-operations").innerHTML =
          response.operations.map(operationHtml).join("");

        // Corrections made after a step was completed. Absent for most units.
        const edits = view.ui.div("unit-edits");
        if (response.edits.length === 0) {
          view.ui.div("edits-group").style.display = "none";
        }
        else {
          edits.innerHTML = response.edits.map(function(edit) {
            return "<div>Step " + edit.step + " · " + edit.name + ": " +
                   "<s>" + edit.oldValue + "</s> → <b>" + edit.newValue + "</b> — " +
                   edit.editedBy + " at " + localTime(edit.editedAt) +
                   " (" + edit.stepsReset + " later step(s) reset)</div>";
          }).join("");
        }
      }
      this.viewDidLoad = viewDidLoad;

      // --- OS listeners ---

      this.didHitEnter = close;
    }
  </script>

  <div class="title">Work Unit</div>

  <div class="container vbox gap-20" style="width: 520px; max-height: 70vh; overflow-y: auto;">

    <div class="hbox gap-10">
      <span name="unit-label" style="flex: 1; font-family: ChicagoFLF;"></span>
      <span name="unit-state"></span>
    </div>

    <fieldset>
      <legend>Input</legend>
      <div name="unit-input" class="vbox"></div>
    </fieldset>

    <fieldset>
      <legend>Resources used</legend>
      <div name="unit-resources" class="vbox"></div>
    </fieldset>

    <div name="unit-operations" class="vbox gap-10"></div>

    <div name="edits-group">
      <fieldset>
        <legend>Corrections</legend>
        <div name="unit-edits" class="vbox"></div>
      </fieldset>
    </div>

    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>

  </div>
</div>
