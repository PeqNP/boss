<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // `null` creates a new job.
      let jobId = null;

      // Set once the job is loaded. A job that has started may not have its
      // work units replaced, and the form says so rather than failing on save.
      let hasStarted = false;
      let workUnitCount = 0;

      // Parsed CSV waiting for the admin to confirm. Cleared on commit or discard.
      let pendingUpload = null;

      // JobDelegate
      let delegate = protocol(
        "JobDelegate", this, "delegate",
        [
          /**
           * @param {object} job - The saved job.
           */
          "didSaveJob",
          /**
           * @param {number} jobId - The deleted job's ID.
           */
          "didDeleteJob"
        ]
      );

      // --- Private helpers ---

      /**
       * Load the chosen production line's contract and show it beneath the
       * menu. The contract is what a CSV must satisfy, so it is displayed
       * before the admin picks a file rather than after.
       */
      async function loadContract() {
        const lineId = view.ui.select("production-line").ui.selectedValue();
        const summary = view.ui.div("contract-summary");
        if (isEmpty(lineId)) {
          summary.innerText = "Choose a production line to see which columns the CSV must contain.";
          view.ui.button("upload-btn").disabled = true;
          return;
        }
        let response;
        try {
          // TODO: GET /api/io.bithead.production/production-line/{id}
          response = await os.network.get(`/api/io.bithead.production/production-line/${lineId}`);
        }
        catch {
          os.ui.showError("Failed to load the production line. Please try again later.");
          return;
        }
        const columns = response.columns.map(function(c) { return c.name; });
        const pools = response.pools.map(function(p) { return p.name; });
        let text = "Required columns: " + columns.join(", ");
        if (pools.length > 0) {
          text = text + "\nRequired pools: " + pools.join(", ");
        }
        summary.innerText = text;
        view.ui.button("upload-btn").disabled = hasStarted;
      }

      /**
       * Render the parsed preview so the admin confirms what will be created.
       *
       * @param {object} preview - Response from the preview endpoint
       */
      function showPreview(preview) {
        const container = view.ui.div("csv-preview");
        container.style.display = "";
        view.ui.span("preview-summary").innerText =
          preview.rowCount + " work unit(s) · columns: " + preview.columns.join(", ");

        const errors = view.ui.div("preview-errors");
        if (preview.errors.length === 0) {
          errors.style.display = "none";
        }
        else {
          errors.style.display = "";
          errors.innerText = preview.errors.map(function(e) {
            return "Line " + e.line + (isEmpty(e.column) ? "" : " (" + e.column + ")") + ": " + e.message;
          }).join("\n");
        }

        const table = view.ui.table("preview-table");
        const head = table.querySelector("thead");
        const body = table.querySelector("tbody");
        head.innerHTML = "<tr>" + preview.columns.map(function(c) {
          return "<th>" + c + "</th>";
        }).join("") + "</tr>";
        body.innerHTML = preview.rows.map(function(row) {
          return "<tr>" + preview.columns.map(function(c) {
            return "<td>" + (isEmpty(row[c]) ? "" : row[c]) + "</td>";
          }).join("") + "</tr>";
        }).join("");

        // A file with errors cannot be committed.
        view.ui.button("commit-btn").disabled = preview.errors.length > 0;
      }

      /**
       * Update the label describing how many work units the job holds.
       */
      function updateWorkUnitCount() {
        let text = workUnitCount + " work unit(s)";
        if (hasStarted) {
          text = text + " — this job has started, so its work units may not be replaced.";
        }
        view.ui.span("work-unit-count").innerText = text;
      }

      // --- Controller functions ---

      /**
       * Open the file picker. The hidden input is reset first so choosing the
       * same file twice still fires a change event.
       */
      function chooseFile() {
        const input = view.ui.input("csv-file");
        input.value = "";
        input.click();
      }
      this.chooseFile = chooseFile;

      async function uploadFile() {
        const input = view.ui.input("csv-file");
        if (input.files.length === 0) {
          return;
        }
        if (isEmpty(jobId)) {
          os.ui.showAlert("Save the job before uploading work units.");
          return;
        }
        let response;
        try {
          // TODO: POST /api/io.bithead.production/job/{jobId}/work-units/preview
          response = await os.network.upload(
            `/api/io.bithead.production/job/${jobId}/work-units/preview`,
            input.files[0]
          );
        }
        catch {
          os.ui.showError("Failed to read the CSV file. Please try again later.");
          return;
        }
        pendingUpload = response;
        showPreview(response);
      }
      this.uploadFile = uploadFile;

      /**
       * Commit the previewed CSV, replacing every work unit on the job.
       */
      async function commitUpload() {
        if (isEmpty(pendingUpload)) {
          return;
        }
        os.ui.showDelete(
          "Replace all work units on this job with the " + pendingUpload.rowCount + " row(s) in this file?",
          null,
          async function() {
            let response;
            try {
              // TODO: POST /api/io.bithead.production/job/{jobId}/work-units/commit
              response = await os.network.post(
                `/api/io.bithead.production/job/${jobId}/work-units/commit`,
                { uploadId: pendingUpload.uploadId }
              );
            }
            catch {
              os.ui.showError("Failed to save the work units. Please try again later.");
              return;
            }
            workUnitCount = response.workUnitCount;
            updateWorkUnitCount();
            discardUpload();
          }
        );
      }
      this.commitUpload = commitUpload;

      function discardUpload() {
        pendingUpload = null;
        view.ui.div("csv-preview").style.display = "none";
      }
      this.discardUpload = discardUpload;

      async function save() {
        const name = view.ui.inputValue("job-name", "Please provide a job name.");
        if (isEmpty(name)) {
          return;
        }
        const productionLineId = view.ui.select("production-line").ui.selectedValue();
        if (isEmpty(productionLineId)) {
          os.ui.showAlert("Please choose a production line.");
          return;
        }
        const scheduledStart = view.ui.input("scheduled-start").value;
        const scheduledCompletion = view.ui.input("scheduled-completion").value;
        if (isEmpty(scheduledStart) || isEmpty(scheduledCompletion)) {
          os.ui.showAlert("Please provide a scheduled start and completion date.");
          return;
        }
        if (scheduledCompletion < scheduledStart) {
          os.ui.showAlert("The completion date must be on or after the start date.");
          return;
        }
        const payload = {
          name,
          productionLineId: parseInt(productionLineId),
          scheduledStart,
          scheduledCompletion
        };
        let response;
        try {
          if (isEmpty(jobId)) {
            // TODO: POST /api/io.bithead.production/job
            response = await os.network.post("/api/io.bithead.production/job", payload);
          }
          else {
            // TODO: PUT /api/io.bithead.production/job/{jobId}
            response = await os.network.put(`/api/io.bithead.production/job/${jobId}`, payload);
          }
        }
        catch {
          os.ui.showError("Failed to save the job. Please try again later.");
          return;
        }
        delegate.didSaveJob(response);
        view.ui.close();
      }
      this.save = save;

      function _delete() {
        os.ui.showDelete(
          "Delete this job and all of its work units?",
          null,
          async function() {
            try {
              // TODO: DELETE /api/io.bithead.production/job/{jobId}
              await os.network.delete(`/api/io.bithead.production/job/${jobId}`);
            }
            catch {
              os.ui.showError("Failed to delete the job. A job may not be deleted while it is running or after work units have been completed.");
              return;
            }
            delegate.didDeleteJob(jobId);
            view.ui.close();
          }
        );
      }
      this.delete = _delete;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      /**
       * @param {number?} _jobId - `null` creates a new job
       */
      function configure(_jobId) {
        jobId = isEmpty(_jobId) ? null : parseInt(_jobId);
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.div("csv-preview").style.display = "none";

        let lines;
        try {
          // TODO: GET /api/io.bithead.production/production-lines
          lines = await os.network.get("/api/io.bithead.production/production-lines");
        }
        catch {
          os.ui.showError("Failed to load production lines. Please try again later.");
          return;
        }
        // `addNewOptions` preserves the menu's first option — the "Choose
        // one" prompt declared in the HTML — and appends after it, so the
        // prompt must not be repeated here.
        const options = [];
        for (const line of lines.productionLines) {
          options.push({ id: String(line.id), name: line.name + " (v" + line.version + ")" });
        }
        view.ui.select("production-line").ui.addNewOptions(options);

        // Creating: nothing to load, and there is nothing to delete yet.
        if (isEmpty(jobId)) {
          view.ui.button("delete-btn").remove();
          view.ui.menu("file-menu").removeOption("delete");
          view.ui.button("upload-btn").disabled = true;
          view.ui.span("work-unit-count").innerText =
            "Save the job before uploading work units.";
          await loadContract();
          return;
        }

        let response;
        try {
          // TODO: GET /api/io.bithead.production/job/{jobId}
          response = await os.network.get(`/api/io.bithead.production/job/${jobId}`);
        }
        catch {
          os.ui.showError("Failed to load the job. Please try again later.");
          return;
        }
        hasStarted = response.hasStarted;
        workUnitCount = response.workUnitCount;
        view.ui.input("job-name").value = response.name;
        view.ui.input("scheduled-start").value = response.scheduledStart;
        view.ui.input("scheduled-completion").value = response.scheduledCompletion;
        view.ui.select("production-line").ui.selectValue(String(response.productionLineId));
        updateWorkUnitCount();
        await loadContract();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        view.ui.input("job-name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      /**
       * Changing the production line changes the contract, so any work units
       * already attached must be revalidated against it.
       */
      async function didChangeProductionLine() {
        if (workUnitCount > 0) {
          os.ui.showAlert("This job already has work units. They will be revalidated against the new production line when the job is started.");
        }
        await loadContract();
      }
      this.didChangeProductionLine = didChangeProductionLine;

      // --- OS listeners ---

      this.didHitEnter = save;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option value="save" onclick="$(this.controller).save();">Save</option>
        <option value="delete" onclick="$(this.controller).delete();">Delete</option>
        <option value="cancel" onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Job</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">

    <fieldset>
      <legend>Job</legend>
      <div class="vbox gap-10">
        <div class="text-field">
          <label for="job-name">Name</label>
          <input type="text" name="job-name" autocomplete="new-password">
        </div>
        <div class="hbox gap-10">
          <div class="text-field">
            <label for="scheduled-start">Scheduled start</label>
            <input type="date" name="scheduled-start">
          </div>
          <div class="text-field">
            <label for="scheduled-completion">Completion</label>
            <input type="date" name="scheduled-completion">
          </div>
        </div>
        <div class="ui-popup-menu stacked" style="--popup-width: 280px;">
          <label for="production-line">Production line</label>
          <select name="production-line" onchange="$(this.controller).didChangeProductionLine();">
            <option value="">Choose one</option>
          </select>
        </div>
        <div name="contract-summary" class="prod-contract"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Work units</legend>
      <div class="vbox gap-10">
        <span name="work-unit-count"></span>
        <!-- Hidden native picker; the visible control is the button below. -->
        <input type="file" name="csv-file" accept=".csv,text/csv" style="display: none;"
               onchange="$(this.controller).uploadFile();">
        <div class="controls">
          <button name="upload-btn" class="primary" onclick="$(this.controller).chooseFile();">Upload CSV</button>
        </div>

        <div name="csv-preview" class="vbox gap-10">
          <span name="preview-summary"></span>
          <div name="preview-errors" class="prod-token-errors"></div>
          <table name="preview-table" style="width: 100%;">
            <thead></thead>
            <tbody></tbody>
          </table>
          <div class="controls">
            <button class="primary" onclick="$(this.controller).discardUpload();">Discard</button>
            <button name="commit-btn" class="primary" onclick="$(this.controller).commitUpload();">Use this file</button>
          </div>
        </div>
      </div>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button name="delete-btn" class="primary" onclick="$(this.controller).delete();">Delete</button>
      <button class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
