<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // Cached so the button labels can follow the selected job's state
      // without another round trip.
      let jobs = [];

      // JobDelegate
      let jobDelegate = {
        didSaveJob: loadJobs,
        didDeleteJob: loadJobs
      };

      // --- Private helpers ---

      /**
       * The job backing the selected row.
       *
       * @returns {object?}
       */
      function selectedJob() {
        const option = view.ui.select("jobs").ui.selectedOption();
        if (isEmpty(option)) {
          return null;
        }
        return option.data;
      }

      /**
       * Point the toggle, `Show progress`, and `Edit` buttons at the selected
       * job's state. A job that is running may not be edited, and progress is
       * only meaningful once it has started.
       *
       * @param {object?} job - The selected job, or `null` when nothing is selected
       */
      function updateButtons(job) {
        const toggle = view.ui.button("toggle-btn");
        const progress = view.ui.button("progress-btn");
        const edit = view.ui.button("edit-btn");
        if (isEmpty(job)) {
          toggle.disabled = true;
          toggle.innerText = "Start";
          progress.disabled = true;
          edit.disabled = true;
          return;
        }
        toggle.disabled = false;
        toggle.innerText = job.active ? "Stop" : "Start";
        progress.disabled = !job.hasStarted;
        edit.disabled = job.active;
      }

      /**
       * Row label: name, product, and the scheduled window.
       *
       * @param {object} job
       * @returns {string}
       */
      function jobLabel(job) {
        let label = job.name + " — " + job.productionLineName;
        label = label + " (" + job.scheduledStart + " to " + job.scheduledCompletion + ")";
        if (job.active) {
          return "▶ " + label;
        }
        return label;
      }

      // --- Controller functions ---

      async function addJob() {
        const win = await $(app.controller).loadController("Job");
        win.ui.show(function(ctrl) {
          ctrl.configure(null);
          ctrl.delegate = jobDelegate;
        });
      }
      this.addJob = addJob;

      async function editJob() {
        const job = selectedJob();
        if (isEmpty(job)) {
          return;
        }
        if (job.active) {
          os.ui.showAlert("A running job may not be edited. Stop the job first.");
          return;
        }
        const win = await $(app.controller).loadController("Job");
        win.ui.show(function(ctrl) {
          ctrl.configure(job.id);
          ctrl.delegate = jobDelegate;
        });
      }
      this.editJob = editJob;

      async function showProgress() {
        const job = selectedJob();
        if (isEmpty(job)) {
          return;
        }
        const win = await $(app.controller).loadController("JobDashboard");
        win.ui.show(function(ctrl) {
          ctrl.configure(job.id);
        });
      }
      this.showProgress = showProgress;

      /**
       * Start or stop the selected job. Stopping warns how many operators are
       * on lines, because every one of them will be paused.
       */
      async function toggleJob() {
        const job = selectedJob();
        if (isEmpty(job)) {
          return;
        }
        if (!job.active) {
          await startJob(job);
          return;
        }
        os.ui.showDelete(
          "Stop " + job.name + "? Every operator on this job will be paused until it is started again.",
          null,
          async function() {
            let response;
            try {
              response = await os.network.post(`/api/io.bithead.production/job/${job.id}/stop`);
            }
            catch {
              os.ui.showError("Failed to stop the job. Please try again later.");
              return;
            }
            await loadJobs();
            if (response.operatorsPaused > 0) {
              os.ui.showAlert(response.operatorsPaused + " operator(s) were paused.");
            }
          }
        );
      }
      this.toggleJob = toggleJob;

      /**
       * @param {object} job - The job to start
       */
      async function startJob(job) {
        let response;
        try {
          response = await os.network.post(`/api/io.bithead.production/job/${job.id}/start`);
        }
        catch (error) {
          // The server refuses to start a job with no work units or an empty
          // production line, and says which.
          os.ui.showError("Failed to start the job. Please make sure it has work units and a production line with at least one operation.");
          return;
        }
        await loadJobs();
        await showProgress();
      }

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("jobs").ui.delegate = {
          didSelectListBoxOption: function(option) {
            updateButtons(option?.data);
          },
          didRemoveAllOptions: function() {
            updateButtons(null);
          }
        };
        await loadJobs();
      }
      this.viewDidLoad = viewDidLoad;

      async function loadJobs() {
        let response;
        try {
          response = await os.network.get("/api/io.bithead.production/jobs");
        }
        catch {
          os.ui.showError("Failed to load jobs. Please try again later.");
          return;
        }
        jobs = response.jobs;
        view.ui.select("jobs").ui.addNewOptions(
          jobs.map(function(job) {
            return { id: String(job.id), name: jobLabel(job), data: job };
          })
        );
      }
      this.loadJobs = loadJobs;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 160px;">
      <select name="file-menu">
        <option>File</option>
        <option onclick="$(this.controller).addJob();">Add job</option>
        <option onclick="$(this.controller).editJob();">Edit job</option>
        <option class="group"></option>
        <option onclick="$(this.controller).toggleJob();">Start/Stop job</option>
        <option onclick="$(this.controller).showProgress();">Show dashboard</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Jobs</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 560px;">
    <div class="hbox gap-10">
      <div class="ui-list-box" style="width: 100%; height: 260px;">
        <select name="jobs"></select>
      </div>
      <div class="controls-right separated">
        <div class="vbox gap-10">
          <button class="primary" onclick="$(this.controller).addJob();">Add</button>
        </div>
        <div class="vbox gap-10">
          <button name="toggle-btn" class="primary" disabled onclick="$(this.controller).toggleJob();">Start</button>
          <button name="progress-btn" class="primary" disabled onclick="$(this.controller).showProgress();">Dashboard</button>
          <button name="edit-btn" class="default" disabled onclick="$(this.controller).editJob();">Edit</button>
        </div>
      </div>
    </div>
  </div>
</div>
