<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {
      function close() {
        view.ui.close();
      }
      this.close = close;

      this.didHitEnter = close;
    }
  </script>

  <div class="title">About Production</div>

  <div class="container vbox gap-10" style="width: 320px;">
    <h1><img src="$(app.resourcePath)/icon.svg" width="26" height="26"> Production</h1>
    <p>
      Production — Guides operators through every step of a manufacturing
      process and gives line managers a live view of the floor.
    </p>
    <p>2026 Bithead LLC. All rights reserved.</p>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
