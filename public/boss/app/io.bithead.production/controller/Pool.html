<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {

      // `null` creates a new pool.
      let poolId = null;

      let resources = [];

      // ResourceDelegate
      let resourceDelegate = {
        didSaveResource: reload,
        didDeleteResource: reload
      };

      // PoolDelegate
      let delegate = protocol(
        "PoolDelegate", this, "delegate",
        [
          /**
           * @param {object} pool - The saved pool.
           */
          "didSavePool",
          /**
           * @param {number} poolId - The deleted pool's ID.
           */
          "didDeletePool"
        ]
      );

      // --- Private helpers ---

      /**
       * The resource backing the selected row.
       *
       * @returns {object?}
       */
      function selectedResource() {
        const option = view.ui.select("resources").ui.selectedOption();
        if (isEmpty(option)) {
          return null;
        }
        return option.data;
      }

      /**
       * A resource can only be returned when someone is holding it.
       */
      function updateButtons() {
        const resource = selectedResource();
        if (isEmpty(resource)) {
          view.ui.button("edit-resource-btn").disabled = true;
          view.ui.button("return-btn").disabled = true;
          return;
        }
        view.ui.button("edit-resource-btn").disabled = false;
        view.ui.button("return-btn").disabled = isEmpty(resource.heldBy);
      }

      /**
       * @param {object} resource
       * @returns {string}
       */
      function resourceLabel(resource) {
        let label = resource.name + " — " + resource.value;
        if (!resource.inService) {
          return label + " · out of service";
        }
        if (isEmpty(resource.heldBy)) {
          return label + " · available";
        }
        return label + " · held by " + resource.heldBy.fullName +
               " (" + resource.heldBy.jobName + ")";
      }

      // --- Controller functions ---

      async function addResource() {
        if (isEmpty(poolId)) {
          os.ui.showAlert("Save the pool before adding resources.");
          return;
        }
        const win = await $(app.controller).loadController("Resource");
        win.ui.show(function(ctrl) {
          ctrl.configure({ poolId: poolId, resourceId: null });
          ctrl.delegate = resourceDelegate;
        });
      }
      this.addResource = addResource;

      async function editResource() {
        const resource = selectedResource();
        if (isEmpty(resource)) {
          return;
        }
        const win = await $(app.controller).loadController("Resource");
        win.ui.show(function(ctrl) {
          ctrl.configure({ poolId: poolId, resourceId: resource.id });
          ctrl.delegate = resourceDelegate;
        });
      }
      this.editResource = editResource;

      /**
       * Force a held resource back into the pool. Used when an operator ends a
       * shift without leaving their line.
       */
      async function returnResource() {
        const resource = selectedResource();
        if (isEmpty(resource) || isEmpty(resource.heldBy)) {
          return;
        }
        os.ui.showDelete(
          "Return " + resource.name + "? It is currently held by " +
          resource.heldBy.fullName + ". Make sure it is physically back before returning it.",
          null,
          async function() {
            try {
              // TODO: POST /api/io.bithead.production/resource/{resourceId}/return
              await os.network.post(`/api/io.bithead.production/resource/${resource.id}/return`);
            }
            catch {
              os.ui.showError("Failed to return the resource. Please try again later.");
              return;
            }
            await reload();
          }
        );
      }
      this.returnResource = returnResource;

      async function save() {
        const name = view.ui.inputValue("pool-name", "Please provide a pool name.");
        if (isEmpty(name)) {
          return;
        }
        let response;
        try {
          if (isEmpty(poolId)) {
            // TODO: POST /api/io.bithead.production/pool
            response = await os.network.post("/api/io.bithead.production/pool", { name });
          }
          else {
            // TODO: PUT /api/io.bithead.production/pool/{poolId}
            response = await os.network.put(`/api/io.bithead.production/pool/${poolId}`, { name });
          }
        }
        catch {
          os.ui.showError("Failed to save the pool. A pool may not be renamed while a production line requires it.");
          return;
        }
        delegate.didSavePool(response);
        view.ui.close();
      }
      this.save = save;

      function _delete() {
        os.ui.showDelete(
          "Delete this pool and all of its resources?",
          null,
          async function() {
            try {
              // TODO: DELETE /api/io.bithead.production/pool/{poolId}
              await os.network.delete(`/api/io.bithead.production/pool/${poolId}`);
            }
            catch {
              os.ui.showError("Failed to delete the pool. A pool may not be deleted while a production line requires it or a resource is checked out.");
              return;
            }
            delegate.didDeletePool(poolId);
            view.ui.close();
          }
        );
      }
      this.delete = _delete;

      function cancel() {
        view.ui.close();
      }
      this.cancel = cancel;

      // --- Configure ---

      /**
       * @param {number?} _poolId - `null` creates a new pool
       */
      function configure(_poolId) {
        poolId = isEmpty(_poolId) ? null : parseInt(_poolId);
      }
      this.configure = configure;

      // --- Lifecycle ---

      async function viewDidLoad() {
        view.ui.select("resources").ui.delegate = {
          didSelectListBoxOption: updateButtons,
          didRemoveAllOptions: updateButtons
        };

        // Creating: no resources yet, nothing to delete.
        if (isEmpty(poolId)) {
          view.ui.button("delete-btn").remove();
          view.ui.menu("file-menu").removeOption("delete");
          return;
        }
        await reload();
      }
      this.viewDidLoad = viewDidLoad;

      function viewDidAppear() {
        view.ui.input("pool-name").focus();
      }
      this.viewDidAppear = viewDidAppear;

      async function reload() {
        let response;
        try {
          // TODO: GET /api/io.bithead.production/pool/{poolId}
          response = await os.network.get(`/api/io.bithead.production/pool/${poolId}`);
        }
        catch {
          os.ui.showError("Failed to load the pool. Please try again later.");
          return;
        }
        resources = response.resources;
        view.ui.input("pool-name").value = response.name;
        view.ui.select("resources").ui.addNewOptions(
          resources.map(function(resource) {
            return { id: String(resource.id), name: resourceLabel(resource), data: resource };
          })
        );
      }
      this.reload = reload;

      // --- OS listeners ---

      this.didHitEnter = save;
    }
  </script>

  <div class="ui-menus">
    <div class="ui-menu" style="width: 140px;">
      <select name="file-menu">
        <option>File</option>
        <option value="save" onclick="$(this.controller).save();">Save</option>
        <option value="delete" onclick="$(this.controller).delete();">Delete</option>
        <option value="cancel" onclick="$(this.controller).cancel();">Cancel</option>
      </select>
    </div>
  </div>

  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Pool</span></div>
    <div class="zoom-button"></div>
  </div>

  <div class="container vbox gap-20" style="width: 520px;">

    <div class="vbox gap-10">
      <div class="text-field">
        <label for="pool-name">Name</label>
        <input type="text" name="pool-name" autocomplete="new-password">
      </div>
      <p>The name is the interpolation key. A pool named <b>Test card</b> is
         referenced in an operation as <b>{pool.Test card}</b>.</p>
    </div>

    <fieldset>
      <legend>Resources</legend>
      <div class="hbox gap-10">
        <div class="ui-list-box" style="width: 100%; height: 180px;">
          <select name="resources"></select>
        </div>
        <div class="controls-right separated">
          <div class="vbox gap-10">
            <button class="primary" onclick="$(this.controller).addResource();">Add</button>
          </div>
          <div class="vbox gap-10">
            <button name="return-btn" class="primary" disabled onclick="$(this.controller).returnResource();">Return</button>
            <button name="edit-resource-btn" class="primary" disabled onclick="$(this.controller).editResource();">Edit</button>
          </div>
        </div>
      </div>
    </fieldset>

    <div class="controls">
      <button class="primary" onclick="$(this.controller).cancel();">Cancel</button>
      <button name="delete-btn" class="primary" onclick="$(this.controller).delete();">Delete</button>
      <button class="default" onclick="$(this.controller).save();">Save</button>
    </div>

  </div>
</div>
