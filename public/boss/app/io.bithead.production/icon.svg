<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>Production</title>
  <!-- Conveyor belt -->
  <rect x="4" y="42" width="56" height="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Belt rollers -->
  <rect x="12" y="54" width="8" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="44" y="54" width="8" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Work units travelling the line -->
  <rect x="10" y="28" width="12" height="12" fill="#000000"/>
  <rect x="26" y="28" width="12" height="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <rect x="42" y="28" width="12" height="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Andon signal above the line -->
  <rect x="30" y="4" width="4" height="10" fill="#000000"/>
  <rect x="24" y="12" width="16" height="10" fill="#ffffff" stroke="#000000" stroke-width="4"/>
</svg>
