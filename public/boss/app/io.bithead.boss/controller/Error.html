<div class="ui-modal">
  <script type="text/javascript">
    function $(this.id)(view) {
      var msg;

      function close() {
        view.ui.close();
      }
      this.close = close;

      function configure(_msg) {
        msg = _msg;
      }
      this.configure = configure;

      function viewDidLoad() {
        view.ui.pByClassName("message").innerHTML = msg;
      }
      this.viewDidLoad = viewDidLoad;

      this.didHitEnter = close;
    }
  </script>
  <div class="title">Error</div>
  <div class="container vbox gap-10 default-width">
    <div class="error">
      <p class="message"></p>
    </div>
    <p>If you believe you have reached this in error, please contact <a href="tel:$(os.phone)">$(os.phone)</a>.</p>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">OK</button>
    </div>
  </div>
</div>
