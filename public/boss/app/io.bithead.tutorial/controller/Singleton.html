<div class="ui-window">
  <script type="text/javascript">
    function $(this.id)(view) {
      function close() {
        view.ui.close();
      }
      this.close = close;
    }
  </script>
  <div class="top">
    <div class="close-button"></div>
    <div class="title"><span>Singleton</span></div>
    <div class="zoom-button"></div>
  </div>
  <div class="container vbox gap-10" style="width: 420px;">
    <p>This controller is registered with <code>singleton: true</code>. Opening it again focuses this window instead of creating a second one.</p>
    <div class="controls">
      <button class="default" onclick="$(this.controller).close();">Close</button>
    </div>
  </div>
</div>
